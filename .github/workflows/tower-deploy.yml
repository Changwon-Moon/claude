name: 관제탑 배포 (Cloudflare)

# 저장소 산출물 → 카드 재생성·렌더 → 관제탑 사이트 조립 → Cloudflare Workers 게시.
#
# 왜 카드를 CI에서 다시 그리나:
#   콘텐츠 JSON(data/content)과 카드 PNG(data/out)는 용량 때문에 저장소에 안 넣는다(gitignore).
#   대신 재료(data/datasets 실거래·정책 데이터)는 커밋돼 있으므로, 여기서 다시 그리면
#   저장소를 깨끗하게 두면서도 관제탑에 썸네일이 들어간다.
#
# 필요한 저장소 시크릿:
#   CLOUDFLARE_API_TOKEN    (필수) Workers Scripts: Edit 권한
#   CLOUDFLARE_ACCOUNT_ID   (필수)
#   TOWER_PASSWORD          (선택) 넣으면 관제탑에 비밀번호 문이 생긴다. 없으면 문 없이 공개.
on:
  push:
    branches:
      - claude/instagram-content-automation-roadmap-fxnb7p
    paths:
      - "research/**"
      - "company/**"
      - "prompts/**"
      - "data/datasets/**"
      - "data/review/sets.json"
      - "data/review/builders.json"
      - "data/review/captions/**"
      - "data/archive/**"
      - "data/publish-queue.md"
      - "data/performance.md"
      - "scripts/build-tower-site.mjs"
      - "scripts/collect-actions-health.mjs"
      - "scripts/smoke-tower.mjs"
      - "scripts/sim-tower.mjs"
      - "scripts/verify-live.mjs"
      # ⚠️ 아래 셋이 빠져 있어서 **완성본 페이지를 고쳐도 배포가 안 돌았다**(2026-08-01).
      #    화면을 만드는 스크립트와 화면의 재료(published/)는 전부 여기 있어야 한다.
      - "scripts/stage-public-cards.mjs"
      - "scripts/build-archive.mjs"
      # ⚠️ 카드 자체를 만드는 소스도 넣는다 — 템플릿·빌더만 고친 push 도 배포가 돌아야
      #    관제탑 썸네일이 갱신된다(2026-08-05: 제목 4줄 수정이 sets 변경 없인 안 돌 뻔했다).
      - "templates/**"
      - "scripts/build-*.mjs"
      - "scripts/lib/**"
      - "published/**"
      - "data/pipeline-state.json"
      - "data/requests.json"
      - "packages/dashboard-static/**"
      - "packages/tower-worker/**"
      - ".github/workflows/tower-deploy.yml"
  # schedule:  ← 2026-08-31 해제(아래 주석 참고)
        # ⚠️ **정각을 피한다** (2026-08-27). 8/26~27 GitHub Actions 장애 때
    #    21:00~22:10 UTC 창의 예약이 통째로 사라졌다 — 관제탑 배포(21:00)·데이터 수집(21:30)·
    #    파이프라인(22:00)·소재 보드(22:00)·신고가(22:00)가 한꺼번에 안 떴다.
    #    같은 시간대의 `17 */2`·`37 */2` 는 멀쩡히 돌았다. 정각은 전 세계가 몰리는 자리다.
    #    ↳ 파수꾼은 **안 뜬 것을 찾아낸다**. 이 줄은 **애초에 덜 몰리게 한다**. 둘 다 필요하다.
  #    - cron: "6 21 * * *" # 매일 06:06 KST
  # ── 2026-08-31 예약 해제 — 수동(workflow_dispatch)·푸시 방아쇠로만 돈다.
  #    30일 실측에서 예약이 몰린 시간대일수록 스케줄러가 건너뛰었다(파수꾼 7%).
  #    매일 도는 예약은 텔레그램 알림 2건과 그 재료 4개만 남긴다:
  #      applyhome-collect(10:00) · singo-daily(07:30) · molit-peak-backfill(11:00) · apt-universe(매달 1일)
  #    깨우는 법: 대기열 파일에 한 줄 쓰고 push (CLAUDE.md §6) 또는 Actions 에서 Run workflow.
  workflow_dispatch:

concurrency:
  group: tower-deploy
  cancel-in-progress: true

permissions:
  contents: write # 발행 완료 표시를 대기열에 되쓴다

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 시크릿을 if 조건에서 바로 못 쓰므로 불린으로 한 번 옮긴다
      HAS_PASSWORD: ${{ secrets.TOWER_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 셀프테스트(관제탑 파서 + 게이트 잠금)
        run: |
          pnpm --filter @wirit/dashboard-static selftest
          pnpm --filter @wirit/tower-worker selftest

      - name: Chromium 설치(카드 렌더용)
        run: pnpm --filter @wirit/renderer exec playwright-core install --with-deps chromium chromium-headless-shell

      # 썸네일 복구 — 재료(data/datasets)에서 카드를 다시 그린다.
      # ⚠️ 빌더 목록을 여기 하드코딩하지 않는다 — data/review/builders.json 이 단일 원천.
      #    하드코딩하던 시절, 새 카드('월급 34평')가 목록에 빠져 실사이트에 카드가 없었다.
      #
      # ── 2026-08-31: 주석은 "개별 빌더가 실패해도 배포는 계속"이라 적혀 있었는데
      #    `continue-on-error` 가 없어 실제로는 **통째로 멈췄다.** 의도와 코드가 갈라져 있었다.
      #    구리 롯데캐슬 하나가 접수 종료로 죽자 8/30~8/31 배포가 전부 접혔고,
      #    조립·계기판·게시가 다 건너뛰어져 **관제탑 화면이 이틀간 낡은 채로 있었다.**
      #    카드 한 장이 관제탑 전체를 인질로 잡으면 안 된다.
      #
      # ⚠️ 그렇다고 조용히 넘기지는 않는다 — 이 저장소 규칙은
      #    "초록불은 일을 했다는 뜻이어야지 죽지 않고 끝났다는 뜻이면 안 된다" 이다.
      #    실패하면 **텔레그램으로 말하고** 요약을 배포 화면에 남긴다.
      #    낡은 카드가 조용히 실리는 것이 실패보다 나쁘다.
      - name: 카드 재생성
        id: rebuild
        continue-on-error: true
        run: node scripts/rebuild-cards.mjs

      - name: 재생성 실패 알림
        if: steps.rebuild.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/notify-telegram.mjs \
            "⚠️ 카드 재생성 실패 — 관제탑은 올라가지만 **일부 카드가 낡은 판본**입니다.
          Actions 로그의 '빌더 실패' 줄을 보세요. 청약 접수가 끝난 단지면:
          node scripts/retire-danji.mjs <라벨>" || true

      - name: 카드 렌더(PNG)
        continue-on-error: true
        run: |
          set +e
          shopt -s nullglob
          for f in data/content/*/*.json; do
            d="$(basename "$(dirname "$f")")"
            echo "▶ render $f → data/out/$d"
            # ⚠️ 두 가지 함정:
            #   (1) pnpm --filter는 작업 폴더를 packages/renderer로 바꾼다 → 절대경로 필수
            #   (2) 관제탑은 썸네일을 data/out/{날짜}/{slug}-p1.png 에서 찾는다 → 날짜 폴더로 출력
            pnpm --filter @wirit/renderer render -- --data "$PWD/$f" --out "$PWD/data/out/$d"
          done
          echo "생성된 PNG: $(find data/out -name '*-p1.png' 2>/dev/null | wc -l)장" 
          exit 0

      # 완성 작업물을 주제별로 정리한 색인 — 관제탑 보관함 탭이 이걸 읽는다
      - name: 보관함 색인
        run: node scripts/build-archive.mjs

      # 배관 계기판 재료 — 예약이 제때 왔는지 날짜별로 굽는다(2026-08-31).
      # ⚠️ 조립 **직전**에 둔다. 뒤에 두면 이번 배포 화면에는 지난번 숫자가 실린다.
      # 실패해도 배포를 막지 않는다 — 계기판이 없다고 관제탑을 못 올리면 본말전도다.
      # 판형 사용 현황도 같이 굽는다 (2026-08-31). 세트가 늘면 표가 낡는데,
      # 손으로 다시 돌리는 일은 언젠가 멈춘다 — 이 저장소가 오늘 하루에 세 번 확인했다.
      - name: 판형 사용 현황
        continue-on-error: true
        run: node scripts/template-usage.mjs --write

      - name: 배관 계기판 재료
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collect-actions-health.mjs

      - name: 사이트 조립
        run: node scripts/build-tower-site.mjs

      # 오너가 수동 업로드할 원본(JPEG)과 지난 발행분을 문 안쪽에 깐다.
      # ⚠️ 사이트 조립이 _site 를 통째로 지우므로 반드시 그 **뒤에** 와야 한다.
      - name: 내려받기·완성본 이미지 준비
        run: node scripts/stage-public-cards.mjs

      # 관제탑이 실제로 동작하는지(읽기 전용 게이트 + 저장소 직접 쓰기) 배포 전에 확인
      - name: 관제탑 스모크
        run: node scripts/smoke-tower.mjs packages/tower-worker/_site/index.html

      # 화면의 모든 버튼을 눌러보는 전수 조사.
      # 처음엔 오탐 때문에 경고로만 뒀는데, 실제로 **배선이 통째로 빠진 버그**
      # (연결 뱃지가 안 열림)를 이게 잡았다. 오탐은 검사를 고쳐서 없애고,
      # 검사 자체는 배포를 막게 둔다 — 안 눌리는 버튼을 내보내는 게 더 나쁘다.
      - name: 전 버튼 시뮬레이션
        run: node scripts/sim-tower.mjs packages/tower-worker/_site/index.html

      # wrangler-action@v3은 구버전(3.90)을 설치해 jsonc 설정을 못 읽는다("Missing entry-point").
      # 버전을 직접 고정해 실행한다.
      - name: Cloudflare 게시
        working-directory: packages/tower-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      # 비밀번호 문 — TOWER_PASSWORD 시크릿이 있을 때만 건다.
      # 없으면 워커가 문 없이 통과시키므로(자물쇠 사고 방지) 배포 자체는 정상.
      - name: 비밀번호 설정
        if: env.HAS_PASSWORD == 'true'
        working-directory: packages/tower-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOWER_PASSWORD: ${{ secrets.TOWER_PASSWORD }}
        run: printf '%s' "$TOWER_PASSWORD" | npx --yes wrangler@4 secret put TOWER_PASSWORD

      # ⚠️ 여기가 핵심이다 — 지금까지 검사는 전부 '로컬 파일' 대상이었고,
      #    그래서 배포가 실패해 사이트가 옛 버전에 멈춰 있어도 아무도 몰랐다.
      #    이제 **인터넷에 올라간 그 주소**를 실제로 열어 최신 화면인지 확인한다.
      # ⚠️ 실패 내용을 **요약 화면에 그대로 남긴다** (2026-08-12).
      #    이 검사는 2026-07-31 이후 계속 실패해 왔는데, 무엇이 실패했는지는 로그를 열어야만
      #    보였다. 로그 zip 은 세션의 egress 허용목록 밖이라 작업 세션이 읽을 수 없다
      #    (results-receiver.actions.githubusercontent.com). 그래서 아무도 원인을 못 봤다.
      #    → 요약(Summary)에 찍으면 오너도 세션도 클릭 한 번으로 본다.
      #    ※ 게시(Cloudflare) 단계는 이 앞에서 이미 성공한다 — 이 검사가 빨간불이라고
      #      사이트가 안 올라간 것은 아니다. 둘을 섞어 읽지 않는다.
      - name: 실제 사이트 확인
        env:
          TOWER_URL: https://wirit-tower.engineerest0.workers.dev
          TOWER_PASSWORD: ${{ secrets.TOWER_PASSWORD }}
        run: |
          set -o pipefail
          node scripts/verify-live.mjs 2>&1 | tee /tmp/verify-live.txt   # 전파 대기는 스크립트가 version.txt 로 확인
      - name: 실제 사이트 확인 — 결과를 요약에 남긴다
        if: always()
        run: |
          {
            echo "### 🌐 실제 사이트 확인"
            echo ""
            echo '```'
            sed -n '1,80p' /tmp/verify-live.txt 2>/dev/null || echo "(출력 없음 — 스크립트가 시작 전에 죽었습니다)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      # ⚠️ 요약(Summary)은 사람 눈에는 보이지만 **작업 세션은 못 읽는다** —
      #    Summary 는 check-runs API 로만 나오고 그 API 는 토큰 권한 밖(403),
      #    로그 zip 과 아티팩트 zip 은 egress 허용목록 밖 호스트로 리다이렉트된다
      #    (results-receiver… / …blob.core.windows.net). 셋 다 막혀 있다.
      #    → 그래서 **저장소에 적는다.** git 은 세션이 읽을 수 있는 유일한 통로다.
      #    이 파일이 없었기에 이 검사의 실패 이유가 2주간 아무에게도 안 보였다.
      #    경로를 docs/_health/ 로 둔 이유: 이 커밋이 tower-deploy·guard 의 트리거
      #    paths 어디에도 안 걸려 배포 루프가 생기지 않는다.
      - name: 실제 사이트 확인 — 결과를 저장소에 남긴다
        if: always()
        run: |
          mkdir -p docs/_health
          {
            echo "# 실제 사이트 확인 — 마지막 실행 결과"
            echo ""
            echo "> 이 파일은 tower-deploy.yml 이 매 배포마다 덮어쓴다. 손으로 고치지 않는다."
            echo "> 작업 세션이 Actions 로그를 못 읽어서(egress 차단) 만든 통로다."
            echo ""
            echo "- 실행: \`${{ github.run_id }}\` · 커밋 \`${{ github.sha }}\`"
            echo "- 시각(UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo '```'
            cat /tmp/verify-live.txt 2>/dev/null || echo "(출력 없음 — 스크립트가 시작 전에 죽었습니다)"
            echo '```'
          } > docs/_health/verify-live-last.md
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_health/verify-live-last.md
          # 판형 사용 현황도 같이 남긴다 — 굽기만 하고 커밋 안 하면 저장소엔 옛 표가 남는다
          # (2026-08-31: 배선해 놓고 이 줄을 빠뜨릴 뻔했다)
          git add docs/TEMPLATES.md data/actions-health.json 2>/dev/null || true
          git diff --cached --quiet && { echo "변화 없음 — 커밋 생략"; exit 0; }
          git commit -m "관제탑 검증·판형 현황 기록 (run ${{ github.run_id }}) [skip ci]"
          # 그새 다른 워크플로가 밀었을 수 있다 — 받아서 얹고 민다. 실패해도 배포를 죽이지 않는다.
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}" || echo "::warning::결과 기록 푸시 실패(배포 판정에는 영향 없음)"

      # ⚠️ 자동 발행 단계는 없앴다(2026-07-27 오너 결정: "인스타는 내가 수동으로 올린다").
      #    올리는 사람은 오너, 관제탑은 **올린 사실을 기록**한다:
      #    결재 화면 [JPG 내려받기]+[캡션 복사] → 오너가 앱에서 업로드 →
      #    [✅ 인스타에 올렸습니다] → publish-archive.yml 이 완성본을 published/ 에 보관.
      #    자동 발행을 다시 켤 땐 scripts/publish-instagram.mjs 를 여기 연결하면 된다.

      - name: 문 상태 확인
        run: |
          if [ "$HAS_PASSWORD" = "true" ]; then
            echo "🔐 비밀번호 문 적용됨"
          else
            echo "::warning::TOWER_PASSWORD 시크릿이 없어 관제탑이 공개 상태입니다. 저장소 Settings → Secrets에서 추가하세요."
          fi

      - name: 결과 안내
        run: |
          echo "### 관제탑 배포 완료 :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 관제탑: https://wirit-tower.engineerest0.workers.dev/" >> $GITHUB_STEP_SUMMARY
          echo "- 실제 사이트 확인까지 통과했습니다(위 '실제 사이트 확인' 단계 참고)." >> $GITHUB_STEP_SUMMARY

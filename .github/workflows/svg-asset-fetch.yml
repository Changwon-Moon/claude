name: SVG 자산 취득 (공개)

# 공개 SVG 자산(서울특별시 공식 로고/휘장)을 직접 URL에서 받아 검증 후 커밋.
# 세션은 외부 다운로드가 정책상 차단 → Actions 러너(개방망) 전용. 취득 후 세션에서 pull.
# 기본값: 위키미디어 공용의 서울특별시 로고(초록 산·파랑 한강·빨강 해 + 서울 로고타입).
on:
  workflow_dispatch:
    inputs:
      url:
        description: "다운로드할 SVG 직접 URL"
        required: true
        default: "https://upload.wikimedia.org/wikipedia/commons/f/f6/Logo_of_Seoul%2C_South_Korea.svg"
      out:
        description: "저장 경로"
        required: true
        default: "data/assets/seoul/seoul-logo.svg"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 다운로드 + 검증(SVG)
        run: |
          OUT="${{ github.event.inputs.out }}"
          mkdir -p "$(dirname "$OUT")"
          curl -sSL -A "Mozilla/5.0 (wirit-bot)" -o "$OUT" "${{ github.event.inputs.url }}"
          echo "size: $(wc -c < "$OUT") bytes"
          if head -c 400 "$OUT" | grep -qi "<svg\|<?xml"; then
            echo "OK SVG"; head -c 600 "$OUT"; echo
          else
            echo "SVG 아님"; head -c 300 "$OUT"; exit 1
          fi
      - name: 커밋
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ github.event.inputs.out }}"
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "SVG 자산 취득: ${{ github.event.inputs.out }}"
            # --autostash: 수집기가 남긴 부산물(data/raw 등) 때문에 rebase가 거부되어
            # **커밋해 놓고 push를 못 한 채 죽는** 일이 있었다(2026-07-26 소재 발굴).
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

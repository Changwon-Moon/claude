name: 곡선 — 자동 재시도

# ── 무엇을 하나 (2026-09-04)
#
# 곡선(신고가 단지 이력) 수집이 **끝까지 못 갔으면 새 러너로 다시 두드린다.**
#
# 왜 이게 답인가 — 09-04 실측:
#   · 07:43 시작한 실행이 **180분 제한에 걸려 취소**됐다. 16곳 중 **6곳**만 받았다
#   · 사람이 대기열을 다시 밀자 **새 실행이 남은 10곳을 10분 미만**에 끝냈다
#   → 같은 대기열·같은 API·같은 코드. **막히는 것은 실행(러너) 단위다.**
#     공급면적에서 이미 확인된 것과 같은 성질이다(`apt-supply-retry.yml` 머리말).
#
# 공급면적에는 08-24 부터 이 사다리가 있었는데 **곡선에는 없었다.** 그래서 09-04 아침에
# 그 3시간을 사람이 손으로 메웠고, 카드가 정오에 나왔다. 같은 고장에 같은 처방을
# **한쪽에만** 단 것 — 09-02 명부 잇기, 09-03 공급면적과 똑같은 실수다.
#
# ── 칸은 셋, 앞을 촘촘히: +2분 · +10분 · +30분
# 곡선은 한 단지 끝날 때마다 커밋하므로 **이어받기가 싸다** — 받아 둔 단지는 건너뛴다.
# 그래서 첫 칸을 공급면적(+3분)보다 더 당겨도 손해가 없다.
#
# ── ⚠️ 성공으로 끝났으면 **돌지 않는다**
# 문지기가 방아쇠 실행의 결론을 본다. `success` 면 거기서 멈춘다 —
# 다 찬 대기열을 다시 훑는 것은 호출은 안 쓰지만 잡을 낭비한다.
#
# ⚠️ `workflow_call` 로 부르는 것은 **호출한 런 안에서** 도므로 `workflow_run` 을 새로 띄우지
#    않는다. 그래서 사다리가 자기를 다시 부르는 고리가 생기지 않는다(apt-supply-retry 와 같은 구조).

on:
  workflow_run:
    workflows: ["신고가 단지 이력 (한 단지 곡선)"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: singo-history-retry
  cancel-in-progress: false

jobs:
  gate1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: { go: "${{ steps.q.outputs.go }}" }
    steps:
      - id: q
        shell: bash
        env:
          CONCL: ${{ github.event.workflow_run.conclusion }}
        run: |
          # 성공이 아니면(취소·실패·시간초과) 아직 못 받은 단지가 남아 있다는 뜻이다.
          if [ "$CONCL" = "success" ]; then
            echo "✅ 곡선 수집이 성공으로 끝났습니다 — 재시도할 것이 없습니다"
            echo "go=0" >> "$GITHUB_OUTPUT"
          else
            echo "곡선 수집이 '$CONCL' 로 끝났습니다 — 새 러너로 이어받습니다"
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi

  wait1:
    needs: gate1
    if: needs.gate1.outputs.go == '1'
    runs-on: ubuntu-latest
    steps: [{ run: sleep 120 }]
  try1:
    needs: wait1
    uses: ./.github/workflows/singo-history.yml
    secrets: inherit

  gate2:
    needs: try1
    # ⚠️ `always()` — 앞 칸이 **실패해도** 이어받는다. 사다리는 원래 실패했을 때 쓰는 것이다.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: { go: "${{ steps.q.outputs.go }}" }
    steps:
      - id: q
        shell: bash
        env:
          R: ${{ needs.try1.result }}
        run: |
          if [ "$R" = "success" ]; then echo "✅ 다 찼습니다"; echo "go=0" >> "$GITHUB_OUTPUT";
          else echo "아직입니다('$R') — 한 칸 더"; echo "go=1" >> "$GITHUB_OUTPUT"; fi
  wait2:
    needs: gate2
    if: needs.gate2.outputs.go == '1'
    runs-on: ubuntu-latest
    steps: [{ run: sleep 600 }]
  try2:
    needs: wait2
    uses: ./.github/workflows/singo-history.yml
    secrets: inherit

  gate3:
    needs: try2
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: { go: "${{ steps.q.outputs.go }}" }
    steps:
      - id: q
        shell: bash
        env:
          R: ${{ needs.try2.result }}
        run: |
          if [ "$R" = "success" ]; then echo "✅ 다 찼습니다"; echo "go=0" >> "$GITHUB_OUTPUT";
          else echo "아직입니다('$R') — 마지막 칸"; echo "go=1" >> "$GITHUB_OUTPUT"; fi
  wait3:
    needs: gate3
    if: needs.gate3.outputs.go == '1'
    runs-on: ubuntu-latest
    steps: [{ run: sleep 1800 }]
  try3:
    needs: wait3
    uses: ./.github/workflows/singo-history.yml
    secrets: inherit

name: 외국인 주택소유통계 수집 (국적별·반기)

# 한국부동산원 외국인주택소유현황(KOSIS orgId 408)에서 **국적별 주택수·소유자수**를 반기 시계열로 받아 커밋한다.
# 「국적별 외국인 집주인 추이」 카드의 재료다. 통계를 만드는 기관이 부동산원 자신이라 1차 출처(오보 0).
#
# ⚠️ 이 통계의 주택수는 **공동주택 + 단독주택**이다. 수집기가 두 표를 더하고 총괄표와 대조한다 —
#    어긋나면 던지고 커밋하지 않는다. 조용히 반쪽 숫자가 카드에 올라가는 것을 막는 자리다.
#
# 공표 주기: 반기(6월말·12월말 기준). 실제 공표는 기준일로부터 약 5개월 뒤라 여유 있게 분기마다 훑는다.
on:
  workflow_dispatch:
  schedule:
    # 1·4·7·10월 12일 02:23 UTC(11:23 KST). 공표가 늦어도 다음 분기에 잡힌다.
    # off-peak 분(:23)으로 둬 혼잡 슬롯 skip 을 줄인다.
    - cron: "23 2 12 1,4,7,10 *"
  # 대기열 한 줄 push 또는 소스 변경으로도 즉시 돈다(세션은 Run 버튼을 못 눌러 push 가 손잡이).
  push:
    branches:
      - claude/instagram-content-automation-roadmap-fxnb7p
    paths:
      - ".github/workflows/foreign-house-collect.yml"
      - "packages/collectors/src/foreignHouseCli.ts"
      - "data/foreign-house-queue.txt"

permissions:
  contents: write

concurrency:
  group: foreign-house-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 키 확인
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          if [ -z "$KOSIS_API_KEY" ]; then
            echo "::error::KOSIS_API_KEY 시크릿이 없습니다"
            exit 1
          fi
          echo "키 확인됨"

      - name: 국적별 외국인 주택소유 수집
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          pnpm --filter @wirit/collectors exec tsx src/foreignHouseCli.ts \
            --out "$GITHUB_WORKSPACE/data/datasets/foreign-house-nat.json"

      - name: 데이터셋 커밋
        run: |
          git config user.name "wirit-bot"
          git config user.email "noreply@github.com"
          git add -- data/datasets/foreign-house-nat.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 새 공표분이 아직 없습니다"
          else
            git commit -m "국적별 외국인 주택소유통계 수집(부동산원)"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

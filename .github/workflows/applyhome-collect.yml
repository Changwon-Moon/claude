name: 청약홈 수집 (daily)

# ── 무엇을 하나 (2026-08-01 오너 "하루에 한 번 자동으로 줍줍·신규분양 뽑아줘")
# 매일 아침 청약홈(한국부동산원) 공공데이터를 불러
#   ① 신규 APT 분양공고  ② 무순위·잔여세대(줍줍)
# 를 받아 점수를 매기고, 문턱을 넘은 것만 소재 보드에 올린 뒤 텔레그램으로 알린다.
#
# ── 왜 여기(Actions)에서 도나
# 작업 세션은 외부망이 막혀 있다(2026-08-01 확인: apis.data.go.kr 로 HTTP 000).
# 게다가 세션은 창을 닫으면 사라진다 — "매일"은 달력이 지켜야지 사람이 지킬 일이 아니다.
#
# ── 안 하는 일
# 카드 제작·발행. 오너가 개입하는 지점은 셋뿐이다(CEO 07-26):
# ①소재 선택 ②기획 방향 ③발행 승인. 여기까지는 ①의 재료를 책상에 올려두는 데까지다.
on:
  schedule:
    # 11:04 KST (02:04 UTC) — 2026-08-14 오너 지시로 08:00 에서 옮겼고,
    # 2026-08-27 정각 무리를 피해 11:00 → 11:04 로 4분 더 옮겼다(아래 ⚠️).
    #
    # ⚠️ 왜 늦췄나: **입주자모집공고는 오전 늦게 뜬다.** 08:00 에 받으면 그날 오전에
    #    올라온 공고를 하루 늦게(다음 날 아침) 알게 된다. 실제로 상동역 롯데캐슬
    #    시그니처(부천 1,859세대)가 그랬다 — 분양 홍보 사이트에는 "8월 분양"이라고
    #    떠 있는데 08:39 수집분에는 08-14 자 공고가 한 건도 없었다(최신이 08-13).
    #    무순위 접수가 당일 오전에 열리는 건은 어차피 전날 공고에 잡히므로 손해가 없다.
        # ⚠️ **정각을 피한다** (2026-08-27). 8/26~27 GitHub Actions 장애 때
    #    21:00~22:10 UTC 창의 예약이 통째로 사라졌다 — 관제탑 배포(21:00)·데이터 수집(21:30)·
    #    파이프라인(22:00)·소재 보드(22:00)·신고가(22:00)가 한꺼번에 안 떴다.
    #    같은 시간대의 `17 */2`·`37 */2` 는 멀쩡히 돌았다. 정각은 전 세계가 몰리는 자리다.
    #    ↳ 파수꾼은 **안 뜬 것을 찾아낸다**. 이 줄은 **애초에 덜 몰리게 한다**. 둘 다 필요하다.
    - cron: "0 1 * * *"

  # ── 대기열 푸시가 방아쇠 (2026-08-02 오너 "액션 탭에 직접 안 들어가고 실행되게 해줘")
  # 작업 세션은 api.github.com 이 프록시에서 막혀(403) workflow_dispatch 버튼을 못 누른다.
  # 하지만 **푸시는 된다.** molit-collect·kr-market·geocode 와 같은 방식으로,
  # 파일 한 줄을 밀어 넣는 것이 세션이 수집을 시작하는 유일한 손잡이다.
  # 한 줄 형식(전부 선택):  within=7 min=45 grep=상동
  push:
    paths:
      - "data/applyhome-queue.txt"

  workflow_dispatch:
    inputs:
      within:
        description: "며칠 이내 공고까지 볼지(기본 7)"
        required: false
        default: "7"
      min:
        description: "소재로 올릴 최소 점수(기본 45)"
        required: false
        default: "45"
      grep:
        description: "진단 — 이 낱말이 든 공고를 걸러지기 전 원본에서 찾아 통째로 남긴다 (예: 상동)"
        required: false
        default: ""
      digest:
        description: "1 이면 새것만이 아니라 지금 살아 있는 소재 전체를 알림으로 보낸다"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: applyhome-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 실행 조건 정하기
        id: cfg
        run: |
          WITHIN="${{ github.event.inputs.within }}"
          MIN="${{ github.event.inputs.min }}"
          GREP="${{ github.event.inputs.grep }}"
          # 대기열 푸시로 들어온 실행은 입력칸이 비어 있다 → 파일 마지막 줄에서 읽는다
          # (주석 #·빈 줄 무시. 없는 값은 기본값으로 떨어진다)
          DIGEST="${{ github.event.inputs.digest }}"
          Q=data/applyhome-queue.txt
          # ── ⛔ 예약 런은 대기열을 **읽지 않는다** (2026-08-27, 신고가·실거래와 같은 규칙)
          #
          # 대기열은 세션이 "지금 한 번 돌려 봐"라고 미는 **일회용 손잡이**다. 예약 런까지
          # 마지막 줄을 읽으면 그게 **상시 설정**이 된다 — 신고가(`months=1`, 5일간)와
          # 실거래(`months=202607`, 26일간)가 실제로 그렇게 조용히 좁아져 있었다.
          # 이 파일에도 `grep=부천` 같은 진단용 줄이 남아 있었다. 지금은 마지막 줄이
          # 우연히 기본값과 같아서 티가 안 났을 뿐, 다음 진단 한 줄이면 똑같이 굳는다.
          EVT="${{ github.event_name }}"
          if [ "$EVT" != "push" ] && [ "$EVT" != "workflow_dispatch" ]; then
            echo "방아쇠 '$EVT' — 대기열을 읽지 않고 기본 기준(within=7 · min=45 · digest)으로 돕니다"
          elif [ -z "$WITHIN$MIN$DIGEST" ] && [ -f "$Q" ]; then
            LINE=$(grep -v '^\s*#' "$Q" | grep -v '^\s*$' | tail -1)
            echo "대기열 마지막 줄: ${LINE:-(비어 있음)}"
            for kv in $LINE; do
              case "$kv" in
                within=*) WITHIN="${kv#within=}" ;;
                min=*)    MIN="${kv#min=}" ;;
                grep=*)   GREP="${kv#grep=}" ;;
                digest=*) DIGEST="${kv#digest=}" ;;
              esac
            done
          fi
          # 예약 실행은 언제나 요약(digest)이다. 새 공고 0건이라 조용한 아침과
          # 수집기가 죽어서 조용한 아침을 오너가 구분할 수 없기 때문이다(2026-08-04 사고).
          [ "${{ github.event_name }}" = "schedule" ] && DIGEST=1
          [ "$DIGEST" = "1" ] && echo "digest=--digest" >> "$GITHUB_OUTPUT" || echo "digest=" >> "$GITHUB_OUTPUT"
          echo "within=${WITHIN:-7}" >> "$GITHUB_OUTPUT"
          echo "min=${MIN:-45}" >> "$GITHUB_OUTPUT"
          echo "grep=$GREP" >> "$GITHUB_OUTPUT"
          echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      # ⚠️ 키가 없으면 **여기서 멈춘다.** 조용히 건너뛰면 몇 주가 지나도 아무도 모른다
      #    (2026-07-31 알림 키 사고). 매일 도는 수집기의 침묵은 정상과 구분되지 않는다.
      - name: 키 확인
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_API_KEY" ]; then
            echo "::error::DATA_GO_KR_API_KEY 가 GitHub Secrets 에 없습니다."
            echo "공공데이터포털 → '한국부동산원_청약홈 분양정보 조회 서비스' 활용신청 →"
            echo "발급된 일반 인증키를 Settings → Secrets → Actions 에 DATA_GO_KR_API_KEY 로 등록하세요."
            exit 1
          fi

      - name: 청약홈 수집
        id: collect
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          # 값이 아니라 **지문(해시 앞 8자)** 만 비교하려고 함께 넘긴다 —
          # 두 Secret 이 같은 키인지 값을 안 보고 아는 유일한 방법이다(2026-08-19).
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          set -o pipefail
          pnpm --filter @wirit/collectors collect-applyhome -- \
            --today ${{ steps.cfg.outputs.today }} \
            --within ${{ steps.cfg.outputs.within }} \
            ${{ steps.cfg.outputs.grep && format('--grep "{0}"', steps.cfg.outputs.grep) || '' }} 2>&1 | tee /tmp/collect.log

      - name: 소재 보드 등록 + 알림 문구
        id: register
        run: |
          set -o pipefail
          node scripts/register-applyhome-ideas.mjs \
            --today ${{ steps.cfg.outputs.today }} \
            --min ${{ steps.cfg.outputs.min }} ${{ steps.cfg.outputs.digest }} 2>&1 | tee /tmp/register.log

      # 파서 셀프테스트는 **수집 뒤에** 돌린다.
      # 2026-07-31 에 증시 수집이 셀프테스트 실패로 며칠간 죽어 있었다 — 테스트가 기능을 지키는
      # 대신 변경을 막는 자물쇠가 됐다. 검사는 하되, 검사가 데이터 수집을 막지는 않게 한다.
      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      # ── 세션의 유일한 눈 ──
      # 작업 세션은 GitHub API 가 막혀 Actions 로그를 못 본다. 그래서 성공이든 실패든
      # 결과를 파일에 적어 커밋한다(research/article-fetch-last.md 와 같은 방식).
      # 이게 없으면 세션은 "돌았는지 안 돌았는지"조차 알 수 없다.
      - name: 실행 결과 기록
        if: always()
        run: |
          {
            echo "# 청약홈 수집 마지막 실행"
            echo
            echo "- 실행: ${{ steps.cfg.outputs.today }} (KST) · 방아쇠 \`${{ github.event_name }}\`"
            echo "- 조건: 최근 ${{ steps.cfg.outputs.within }}일 이내 · 소재 문턱 ${{ steps.cfg.outputs.min }}점"
            echo "- 결과: **${{ job.status == 'success' && '성공' || '실패' }}**"
            echo "- 커밋: \`${{ github.sha }}\`"
            echo
            echo '## 수집 로그'
            echo '```'
            cat /tmp/collect.log 2>/dev/null || echo "(수집 단계가 실행되지 못했습니다 — 키 확인 단계에서 멈췄을 수 있습니다)"
            echo '```'
            echo
            echo '## 소재 등록'
            echo '```'
            cat /tmp/register.log 2>/dev/null || echo "(등록 단계가 실행되지 못했습니다)"
            echo '```'
          } > data/applyhome-last.md

      - name: 커밋
        if: always()
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@github.com"
          # ⚠️ 폴더를 통째로 쓸어 담지 않는다 — confirm.mjs 가 워크플로의 git add 경로를 읽어
          #    '정기물'을 가르기 때문에, 넓게 적으면 손으로 만든 데이터셋까지 정기물로 오인한다
          #    (CARD_CHECKLIST §5 경고).
          git add -f data/applyhome-last.md
          git add data/datasets/applyhome-latest.json data/datasets/applyhome research/ideas.json 2>/dev/null || true
          # 진단 결과(--grep)도 담는다 — 세션이 이 파일을 읽고 원인을 판정한다
          [ -e data/datasets/applyhome-probe.json ] && git add -f data/datasets/applyhome-probe.json || true
          if git diff --cached --quiet; then
            echo "바뀐 것 없음 — 커밋 생략"
          else
            git commit -m "청약홈 수집 ${{ steps.cfg.outputs.today }}"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: 텔레그램 알림 (조용한 날도 한 줄은 보낸다)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            node scripts/notify-telegram.mjs "⚠️ 청약홈 수집 실패 (${{ steps.cfg.outputs.today }}) — data/applyhome-last.md 를 확인하세요"
            exit 0
          fi
          MSG=$(cat data/applyhome-alert.txt 2>/dev/null || true)
          if [ -n "$MSG" ]; then
            node scripts/notify-telegram.mjs "$MSG"
          else
            # ── 조용한 날도 보낸다 ──
            # 매일 도는 수집기의 침묵은 정상과 구분이 안 된다. 아침에 아무것도 안 오면
            # 공고가 없었던 건지, 수집기가 죽은 건지, 예약이 안 깨어난 건지 알 수가 없다.
            # (실제로 예약 7개가 기본 브랜치 문제로 몇 주째 안 돌았는데 아무도 몰랐다.)
            # 다만 빈 "0건" 은 며칠이면 안 읽게 되므로, 접수중·마감임박을 얹어 보낸다.
            HB=$(node scripts/applyhome-heartbeat.mjs --today "${{ steps.cfg.outputs.today }}" 2>/dev/null || true)
            if [ -n "$HB" ]; then
              node scripts/notify-telegram.mjs "$HB"
            else
              node scripts/notify-telegram.mjs "🏠 청약홈 확인 완료 (${{ steps.cfg.outputs.today }}) — 새 공고 0건"
            fi
          fi

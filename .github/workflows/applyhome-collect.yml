name: 청약홈 수집 (daily)

# ── 무엇을 하나 (2026-08-01 오너 "하루에 한 번 자동으로 줍줍·신규분양 뽑아줘")
# 매일 아침 청약홈(한국부동산원) 공공데이터를 불러
#   ① 신규 APT 분양공고  ② 무순위·잔여세대(줍줍)
# 를 받아 점수를 매기고, 문턱을 넘은 것만 소재 보드에 올린 뒤 텔레그램으로 알린다.
#
# ── 왜 여기(Actions)에서 도나
# 작업 세션은 외부망이 막혀 있다(2026-08-01 확인: apis.data.go.kr 로 HTTP 000).
# 게다가 세션은 창을 닫으면 사라진다 — "매일"은 달력이 지켜야지 사람이 지킬 일이 아니다.
#
# ── 안 하는 일
# 카드 제작·발행. 오너가 개입하는 지점은 셋뿐이다(CEO 07-26):
# ①소재 선택 ②기획 방향 ③발행 승인. 여기까지는 ①의 재료를 책상에 올려두는 데까지다.
on:
  schedule:
    # 08:00 KST (23:00 UTC 전날) — 무순위 접수는 당일 오전에 열리는 경우가 많아 일찍 본다
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      within:
        description: "며칠 이내 공고까지 볼지(기본 7)"
        required: false
        default: "7"
      min:
        description: "소재로 올릴 최소 점수(기본 45)"
        required: false
        default: "45"

permissions:
  contents: write

concurrency:
  group: applyhome-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/instagram-content-automation-roadmap-fxnb7p

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ⚠️ 키가 없으면 **여기서 멈춘다.** 조용히 건너뛰면 몇 주가 지나도 아무도 모른다
      #    (2026-07-31 알림 키 사고). 매일 도는 수집기의 침묵은 정상과 구분되지 않는다.
      - name: 키 확인
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_API_KEY" ]; then
            echo "::error::DATA_GO_KR_API_KEY 가 GitHub Secrets 에 없습니다."
            echo "공공데이터포털 → '한국부동산원_청약홈 분양정보 조회 서비스' 활용신청 →"
            echo "발급된 일반 인증키를 Settings → Secrets → Actions 에 DATA_GO_KR_API_KEY 로 등록하세요."
            exit 1
          fi

      - name: 오늘 날짜(KST)
        id: d
        run: echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      - name: 청약홈 수집
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: |
          pnpm --filter @wirit/collectors collect-applyhome -- \
            --today ${{ steps.d.outputs.today }} \
            --within ${{ github.event.inputs.within || '7' }}

      - name: 소재 보드 등록 + 알림 문구
        run: |
          node scripts/register-applyhome-ideas.mjs \
            --today ${{ steps.d.outputs.today }} \
            --min ${{ github.event.inputs.min || '45' }}

      # 파서 셀프테스트는 **수집 뒤에** 돌린다.
      # 2026-07-31 에 증시 수집이 셀프테스트 실패로 며칠간 죽어 있었다 — 테스트가 기능을 지키는
      # 대신 변경을 막는 자물쇠가 됐다. 검사는 하되, 검사가 데이터 수집을 막지는 않게 한다.
      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      - name: 커밋
        id: commit
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@github.com"
          # ⚠️ 폴더를 통째로 쓸어 담지 않는다 — confirm.mjs 가 워크플로의 git add 경로를 읽어
          #    '정기물'을 가르기 때문에, 넓게 적으면 손으로 만든 데이터셋까지 정기물로 오인한다
          #    (CARD_CHECKLIST §5 경고).
          git add data/datasets/applyhome-latest.json data/datasets/applyhome research/ideas.json
          if git diff --cached --quiet; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "바뀐 것 없음 — 커밋 생략"
          else
            git commit -m "청약홈 수집 ${{ steps.d.outputs.today }}"
            git push
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: 텔레그램 알림 (새 공고가 있을 때만)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(cat data/applyhome-alert.txt 2>/dev/null || true)
          if [ -n "$MSG" ]; then
            node scripts/notify-telegram.mjs "$MSG"
          else
            echo "새 공고 없음 — 알림 생략(조용한 날도 정상이다)"
          fi

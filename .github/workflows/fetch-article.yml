name: 기사 읽어오기

# 오너가 준 기사 링크를 **Actions 안에서** 열어 본문을 저장소에 남긴다.
#
# 왜: 작업 세션은 네이버·다음을 못 읽는다(차단). 그때마다 "못 읽습니다"라고 답하면
#     오너가 본문을 손으로 옮겨야 한다. 여기서 읽어 두면 다음 세션도 그 기사를 읽는다.
#
# ⚠️ 기사는 2차 출처다. 여기 저장된 숫자를 카드에 그대로 쓰지 않는다 —
#    시의성 훅으로 쓰거나, 1차 출처로 다시 확인한 뒤에만 쓴다(ARCHITECTURE.md §2).
#
# ── 대기열 방식 (2026-07-31 추가)
# 오너 지적: "직접 깃허브에 링크를 붙이고 액션을 누르면 의미가 없잖아."
# 맞다. 작업 세션은 GitHub **API** 가 막혀 워크플로를 직접 실행하지 못하지만
# **git push 는 된다.** 그래서 푸시를 방아쇠로 쓴다 —
# 세션이 `research/article-queue.txt` 에 URL 을 적어 푸시하면 이 워크플로가 깨어난다.
# 오너는 채팅에 링크만 주면 되고, 버튼을 누르러 갈 일이 없다.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "기사 URL (공백으로 여러 개). 비우면 대기열 파일을 읽는다"
        required: false
        default: ""
  push:
    branches:
      - claude/instagram-content-automation-roadmap-fxnb7p
    paths:
      # 세션이 URL 을 적어 푸시하는 파일 — 이게 이 워크플로의 진짜 입구다
      - "research/article-queue.txt"
      # ⚠️ 등록용 — 수동 실행 전용 워크플로는 한 번도 안 돌면 GitHub에 등록되지 않아
      #    dispatch 가 404를 받는다. 이 파일들이 바뀌면 한 번 돌아 자신을 등록한다.
      - ".github/workflows/fetch-article.yml"
      - "scripts/fetch-article.mjs"

permissions:
  contents: write

concurrency:
  group: fetch-article
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # 읽을 URL 정하기 — dispatch 입력이 있으면 그걸, 없으면 대기열 파일을 읽는다.
      # 대기열이 비어 있으면(워크플로 파일만 고친 등록용 실행) 조용히 끝낸다.
      - name: 읽을 URL 정하기
        id: pick
        env:
          # ⚠️ URL 을 ${{ }} 로 셸 명령줄에 직접 박지 않는다 —
          #    URL 안의 & ; $ 같은 문자가 명령으로 해석된다. env 로 넘겨 값으로만 다룬다.
          INPUT_URLS: ${{ github.event.inputs.urls }}
        run: |
          URLS="$INPUT_URLS"
          if [ -z "$URLS" ] && [ -f research/article-queue.txt ]; then
            # 주석(#)과 빈 줄을 걷어내고 한 줄로 모은다
            URLS=$(grep -vE '^\s*(#|$)' research/article-queue.txt | tr '\n' ' ')
          fi
          if [ -z "$(echo "$URLS" | tr -d ' ')" ]; then
            echo "읽을 URL 이 없습니다 — 대기열이 비었습니다(등록용 실행일 수 있음)"
            echo "urls=" >> "$GITHUB_OUTPUT"
          else
            echo "읽을 URL: $URLS"
            echo "urls=$URLS" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.pick.outputs.urls != ''
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.pick.outputs.urls != ''
        with:
          node-version: 22
          cache: pnpm
      - if: steps.pick.outputs.urls != ''
        run: pnpm install --frozen-lockfile

      # 네이버·다음은 JS로 본문을 채운다 → 실제 브라우저로 열어야 글이 보인다
      - name: Chromium 설치
        if: steps.pick.outputs.urls != ''
        run: pnpm --filter @wirit/renderer exec playwright-core install --with-deps chromium chromium-headless-shell

      # continue-on-error: 읽기에 실패해도 **아래 기록 단계까지 반드시 간다.**
      # 실패를 조용히 삼키는 게 아니라, 실패했다는 사실과 진단을 저장소에 남기기 위해서다.
      # (fetch-article.mjs 는 한 건도 못 읽으면 exit 1 로 끝난다 — 그러면 예전 구조에서는
      #  커밋 단계가 통째로 건너뛰어져 세션에 아무 흔적도 안 남았다. 2026-07-31 실제로 겪음)
      - name: 기사 읽기
        id: read
        if: steps.pick.outputs.urls != ''
        continue-on-error: true
        env:
          URLS: ${{ steps.pick.outputs.urls }}
        run: |
          # 따옴표 없이 $URLS 를 넘겨 공백으로 나뉜 여러 URL 이 각각의 인자가 되게 한다.
          # 값 자체는 env 를 거쳐 오므로 셸 확장 대상이 아니다.
          # shellcheck disable=SC2086
          set -o pipefail
          node scripts/fetch-article.mjs $URLS 2>&1 | tee /tmp/fetch-article.log

      # 항상 기록한다 — 세션은 Actions 로그를 볼 수 없으므로(GitHub API 차단)
      # 이 파일이 유일한 눈이다. 실패도 결과다.
      # 대기열을 비워 함께 커밋해도 재실행되지 않는다: 이 커밋은 봇이 하고,
      # GITHUB_TOKEN 으로 민 푸시는 워크플로를 다시 트리거하지 않는다(GitHub 기본 동작).
      - name: 결과 기록 + 커밋
        if: always() && steps.pick.outputs.urls != ''
        env:
          URLS: ${{ steps.pick.outputs.urls }}
          OUTCOME: ${{ steps.read.outcome }}
        run: |
          {
            echo "# 기사 읽어오기 — 마지막 실행 결과"
            echo
            echo "- 실행: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 결과: **${OUTCOME}**"
            echo "- 요청한 URL: ${URLS}"
            echo "- 실행 기록: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '> 워크플로가 매번 덮어씁니다. 작업 세션이 결과를 확인하는 통로입니다.'
            echo
            echo '## 로그'
            echo
            echo '```'
            if [ -f /tmp/fetch-article.log ]; then cat /tmp/fetch-article.log; else echo "(로그 없음 — 읽기 단계 전에 끝났습니다)"; fi
            echo '```'
          } > research/article-fetch-last.md

          # 대기열은 성공·실패와 무관하게 비운다. 남겨 두면 다음 푸시 때 같은 요청이 또 돈다.
          # 다시 시도할지는 로그를 본 세션이 판단한다.
          : > research/article-queue.txt

          git config user.name  "wirit-bot"
          git config user.email "noreply@github.com"
          git add -- research/articles research/article-queue.txt research/article-fetch-last.md
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
          else
            git commit -m "기사 읽어오기 결과(${OUTCOME}) — 대기열 처리"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

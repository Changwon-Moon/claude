name: 단지 가까운 역 (카드 뱃지용)

# ── 무엇을 하나 (2026-08-16 오너 "가까운 역을 뱃지로 추가해볼까?")
# 단지 주소를 좌표로 바꾸고, 그 좌표에서 **지하철역을 거리순으로 받아** 가장 가까운 역을 적는다.
#
# ── 왜 코드가 재나
# "광명한진타운 근처는 철산역" 은 아는 말이지 **잰 값이 아니다.** 카드에 적는 순간
# 검증되지 않은 수치가 된다(오보 0). 그래서 카카오 로컬이 재고, 거리도 같이 남긴다.
# 못 찾으면 파일을 안 만든다 — 카드는 그때 뱃지를 붙이지 않는다.
on:
  push:
    paths:
      - "data/apt-station-queue.txt"

  workflow_dispatch:
    inputs:
      kapt:
        description: "공동주택 대장 코드 (예: A42385801). 주소·이름을 대장에서 읽어 쓴다"
        required: false
        default: ""
      addr:
        description: "주소 직접 지정(대장에 없을 때). --key 도 함께 넣어야 한다"
        required: false
        default: ""
      key:
        description: "결과 파일 이름 (addr 로 넣을 때만)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: apt-station
  cancel-in-progress: false

jobs:
  station:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 실행 조건 정하기
        id: cfg
        shell: bash
        run: |
          KAPT="${{ github.event.inputs.kapt }}"
          ADDR="${{ github.event.inputs.addr }}"
          KEY="${{ github.event.inputs.key }}"
          Q=data/apt-station-queue.txt
          if [ -z "$KAPT$ADDR" ] && [ -f "$Q" ]; then
            LINE=$(grep -v '^[[:space:]]*#' "$Q" | grep -v '^[[:space:]]*$' | tail -1)
            echo "대기열 마지막 줄: ${LINE:-(비어 있음)}"
            KAPT=$(printf '%s' "$LINE" | sed -n 's/.*kapt=\([A-Za-z0-9]*\).*/\1/p')
            KEY=$(printf '%s' "$LINE" | sed -n 's/.*key=\([^ ]*\).*/\1/p')
            ADDR=$(printf '%s' "$LINE" | sed -n 's/.*addr="\([^"]*\)".*/\1/p')
          fi
          if [ -z "$KAPT" ] && [ -z "$ADDR" ]; then
            echo "::error::kapt 또는 addr 가 필요합니다."
            exit 1
          fi
          {
            echo "kapt=$KAPT"
            echo "addr=$ADDR"
            echo "key=$KEY"
          } >> "$GITHUB_OUTPUT"

      - name: 키 확인
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          if [ -z "$KAKAO_REST_KEY" ]; then
            echo "::error::KAKAO_REST_KEY 가 GitHub Secrets 에 없습니다."
            exit 1
          fi

      - name: 가까운 역 찾기
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          set -o pipefail
          pnpm --filter @wirit/collectors collect-apt-station -- \
            ${{ steps.cfg.outputs.kapt && format('--kapt {0}', steps.cfg.outputs.kapt) || '' }} \
            ${{ steps.cfg.outputs.addr && format('--addr "{0}"', steps.cfg.outputs.addr) || '' }} \
            ${{ steps.cfg.outputs.key && format('--key {0}', steps.cfg.outputs.key) || '' }} 2>&1 | tee /tmp/station.log

      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      - name: 실행 결과 기록
        if: always()
        run: |
          {
            echo "# 단지 가까운 역 — 마지막 실행"
            echo
            echo "- 대상: \`${{ steps.cfg.outputs.kapt }}${{ steps.cfg.outputs.addr }}\`"
            echo "- 결과: **${{ job.status == 'success' && '성공' || '실패' }}**"
            echo
            echo '```'
            cat /tmp/station.log 2>/dev/null || echo "(실행되지 못했습니다)"
            echo '```'
          } > data/apt-station-last.md

      - name: 커밋
        if: always()
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@github.com"
          git add -f data/apt-station-last.md
          [ -e data/datasets/apt-station ] && git add data/datasets/apt-station || true
          if git diff --cached --quiet; then
            echo "바뀐 것 없음 — 커밋 생략"
          else
            git commit -m "단지 가까운 역 — ${{ steps.cfg.outputs.kapt }}${{ steps.cfg.outputs.addr }}"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

name: 단지 가까운 역 (카드 뱃지용)

# ── 무엇을 하나 (2026-08-16 오너 "가까운 역을 뱃지로 추가해볼까?")
# 단지 주소를 좌표로 바꾸고, 그 좌표에서 **지하철역을 거리순으로 받아** 가장 가까운 역을 적는다.
#
# ── 왜 코드가 재나
# "광명한진타운 근처는 철산역" 은 아는 말이지 **잰 값이 아니다.** 카드에 적는 순간
# 검증되지 않은 수치가 된다(오보 0). 그래서 카카오 로컬이 재고, 거리도 같이 남긴다.
# 못 찾으면 파일을 안 만든다 — 카드는 그때 뱃지를 붙이지 않는다.
on:
  push:
    paths:
      - "data/apt-station-queue.txt"

  workflow_dispatch:
    inputs:
      kapt:
        description: "공동주택 대장 코드 (예: A42385801). 주소·이름을 대장에서 읽어 쓴다"
        required: false
        default: ""
      addr:
        description: "주소 직접 지정(대장에 없을 때). --key 도 함께 넣어야 한다"
        required: false
        default: ""
      key:
        description: "결과 파일 이름 (addr 로 넣을 때만)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: apt-station
  cancel-in-progress: false

jobs:
  station:
    # ⚠️ 러너를 저장소 변수로 고른다 (2026-08-16c)
    # Actions 무료 분(월 2,000분·비공개 저장소)을 다 쓰면 **실행은 생기는데 스텝이 0개로 죽는다.**
    # 그때 Settings → Secrets and variables → Actions → Variables 에 `RUNNER_LABEL=self-hosted`
    # 를 넣으면 이 워크플로가 오너 PC 러너로 넘어간다 — 셀프호스티드는 분을 **안 쓴다**.
    # 변수를 안 넣으면 지금까지처럼 ubuntu-latest 다(기본 동작 그대로).
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 대기열 읽기
        id: q
        shell: bash
        env:
          IN_KAPT: ${{ github.event.inputs.kapt }}
          IN_ADDR: ${{ github.event.inputs.addr }}
          IN_KEY: ${{ github.event.inputs.key }}
        run: |
          Q=data/apt-station-queue.txt
          : > "$RUNNER_TEMP/jobs.txt"
          if [ -n "$IN_KAPT$IN_ADDR" ]; then
            printf 'kapt=%s key=%s addr="%s"\n' "$IN_KAPT" "$IN_KEY" "$IN_ADDR" >> "$RUNNER_TEMP/jobs.txt"
          elif [ -f "$Q" ]; then
            grep -v '^[[:space:]]*#' "$Q" | grep -v '^[[:space:]]*$' > "$RUNNER_TEMP/jobs.txt" || true
          fi
          N=$(wc -l < "$RUNNER_TEMP/jobs.txt" | tr -d ' ')
          echo "대기열 $N 줄:"; cat "$RUNNER_TEMP/jobs.txt"
          if [ "$N" = "0" ]; then echo "::error::대기열이 비었습니다."; exit 1; fi
          echo "count=$N" >> "$GITHUB_OUTPUT"

      - name: 키 확인
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        shell: bash
        run: |
          if [ -z "$KAKAO_REST_KEY" ]; then
            echo "::error::KAKAO_REST_KEY 가 GitHub Secrets 에 없습니다."
            exit 1
          fi

      - name: 가까운 역 찾기 (대기열 전 줄)
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        shell: bash
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/station.log"
          FAILED=0
          while IFS= read -r LINE; do
            [ -z "$LINE" ] && continue
            KAPT=$(printf '%s' "$LINE" | sed -n 's/.*kapt=\([A-Za-z0-9]*\).*/\1/p')
            KEY=$(printf '%s' "$LINE" | sed -n 's/.*key=\([^ ]*\).*/\1/p')
            ADDR=$(printf '%s' "$LINE" | sed -n 's/.*addr="\([^"]*\)".*/\1/p')
            OUT="data/datasets/apt-station/${KAPT:-$KEY}.json"
            case "$LINE" in *force=1*) ;; *) if [ -n "${KAPT}${KEY}" ] && [ -f "$OUT" ]; then
                  echo "⏭ 이미 있음 — $OUT (다시 받으려면 force=1)" | tee -a "$RUNNER_TEMP/station.log"; continue; fi;; esac
            echo "" | tee -a "$RUNNER_TEMP/station.log"
            echo "── ${KAPT:-$ADDR}" | tee -a "$RUNNER_TEMP/station.log"
            # ⚠️ 한 줄이 실패해도 나머지는 계속 간다
            if ! pnpm --filter @wirit/collectors collect-apt-station -- \
                  ${KAPT:+--kapt "$KAPT"} ${ADDR:+--addr "$ADDR"} ${KEY:+--key "$KEY"} 2>&1 | tee -a "$RUNNER_TEMP/station.log"; then
              FAILED=1
            fi
          done < "$RUNNER_TEMP/jobs.txt"
          echo "" | tee -a "$RUNNER_TEMP/station.log"
          [ "$FAILED" = "0" ] && echo "✅ 대기열 전 줄 완료" | tee -a "$RUNNER_TEMP/station.log" || echo "⚠️ 일부 줄이 실패했습니다" | tee -a "$RUNNER_TEMP/station.log"
          exit $FAILED

      - name: 파서 셀프테스트
        shell: bash
        run: pnpm --filter @wirit/collectors selftest

      - name: 실행 결과 기록
        if: always()
        shell: bash
        run: |
          {
            echo "# 단지 가까운 역 — 마지막 실행"
            echo
            echo "- 대기열: ${{ steps.q.outputs.count }}줄"
            echo "- 결과: **${{ job.status == 'success' && '성공' || '실패' }}**"
            echo
            echo '```'
            cat "$RUNNER_TEMP/station.log" 2>/dev/null || echo "(실행되지 못했습니다)"
            echo '```'
          } > data/apt-station-last.md

      - name: 커밋
        if: always()
        shell: bash
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@github.com"
          git add -f data/apt-station-last.md
          [ -e data/datasets/apt-station ] && git add data/datasets/apt-station || true
          if git diff --cached --quiet; then
            echo "바뀐 것 없음 — 커밋 생략"
          else
            git commit -m "단지 가까운 역 — ${{ steps.q.outputs.count }}건"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

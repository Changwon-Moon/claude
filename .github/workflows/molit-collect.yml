name: 실거래 수집 (국토부)

# 국토교통부 아파트 매매 실거래(상세)를 구·월 단위로 수집해 캐시 데이터셋으로 커밋한다.
# 1차 출처(오보 0). MOLIT_API_KEY(공공·무료 인코딩 인증키) 필요 → GitHub Secrets.
# 대장 엔진·카드 빌더가 이 캐시(data/datasets/molit/*.json)를 재사용.
on:
  workflow_dispatch:
    inputs:
      gu:
        description: "구 목록(콤마) 또는 all (예: 강남구,서초구)"
        required: true
        default: "강남구"
      months:
        description: "수집 월(YYYYMM,콤마). 비우면 최근 6개월 자동"
        required: false
        default: ""
      force:
        description: "캐시 무시 재수집 (true/false)"
        required: false
        default: "false"
  schedule:
    # 매월 5일 03:20 UTC — 지난달 확정분 갱신(전월 실거래는 익월 초까지 신고됨)
    - cron: "20 3 5 * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      - name: 실거래 수집 → 캐시 데이터셋
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then echo "MOLIT_API_KEY 시크릿이 없습니다"; exit 1; fi
          GU="${{ github.event.inputs.gu }}"; GU="${GU:-강남구}"
          MONTHS="${{ github.event.inputs.months }}"
          if [ -z "$MONTHS" ]; then
            MONTHS=""
            for i in 1 2 3 4 5 6; do
              MONTHS="$MONTHS,$(date -u -d "$i month ago" +%Y%m)"
            done
            MONTHS="${MONTHS#,}"
          fi
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          echo "수집: 구=$GU · 월=$MONTHS $FORCE"
          pnpm --filter @wirit/collectors exec tsx src/molitCli.ts \
            --gu "$GU" --months "$MONTHS" \
            --out "$GITHUB_WORKSPACE/data/datasets/molit" $FORCE

      - name: 캐시 커밋
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/datasets/molit/*.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "실거래(국토부) 수집 ${{ github.event.inputs.gu }}"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

name: 실거래 수집 (국토부)

# 국토교통부 아파트 매매 실거래(상세)를 구·월 단위로 수집해 캐시 데이터셋으로 커밋한다.
# 1차 출처(오보 0). MOLIT_API_KEY(공공·무료 인코딩 인증키) 필요 → GitHub Secrets.
# 대장 엔진·카드 빌더가 이 캐시(data/datasets/molit/*.json)를 재사용.
on:
  # 대기열 파일이 바뀌면 실행한다 — kr-market·asset-fetch·geocode 와 같은 방식.
  # 작업 세션은 GitHub API 가 프록시에서 막혀 있어 workflow_dispatch 버튼을 누를 수 없다
  # (2026-07-31 확인: api.github.com 이 403 "GitHub access to this repository is not enabled").
  # 푸시는 되므로, 파일 한 줄을 밀어 넣는 것이 세션이 수집을 시작할 수 있는 **유일한 손잡이**다.
  # 한 줄 형식:  region=seoul gu=all months=202607 force=false
  push:
    paths:
      - "data/molit-queue.txt"
  workflow_dispatch:
    inputs:
      region:
        description: "지역 코드표 (seoul/gyeonggi/all)"
        required: false
        default: "seoul"
      gu:
        description: "구·시 목록(콤마) 또는 all (예: 강남구,서초구 / 구리시,용인시기흥구)"
        required: true
        default: "강남구"
      months:
        description: "수집 월(YYYYMM,콤마). 비우면 최근 6개월 자동"
        required: false
        default: ""
      force:
        description: "캐시 무시 재수집 (true/false)"
        required: false
        default: "false"
  schedule:
    # 매월 5일 03:20 UTC — 지난달 확정분 갱신(전월 실거래는 익월 초까지 신고됨)
    - cron: "20 3 5 * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      - name: 실거래 수집 → 캐시 데이터셋
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then echo "MOLIT_API_KEY 시크릿이 없습니다"; exit 1; fi
          GU="${{ github.event.inputs.gu }}"
          REGION="${{ github.event.inputs.region }}"
          MONTHS="${{ github.event.inputs.months }}"
          FORCE_IN="${{ github.event.inputs.force }}"
          # 대기열 푸시로 들어온 실행은 입력칸이 비어 있다 → 파일 마지막 줄에서 읽는다.
          # (주석 #·빈 줄 무시. 값이 없는 항목은 아래 기본값으로 떨어진다)
          if [ -f data/molit-queue.txt ]; then
            LINE=$(grep -v '^[[:space:]]*#' data/molit-queue.txt | grep -v '^[[:space:]]*$' | tail -1)
            echo "대기열 마지막 줄: $LINE"
            [ -z "$REGION" ] && REGION=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^region=//p')
            [ -z "$GU" ]     && GU=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^gu=//p')
            [ -z "$MONTHS" ] && MONTHS=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^months=//p')
            [ -z "$FORCE_IN" ] && FORCE_IN=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^force=//p')
          fi
          GU="${GU:-강남구}"; REGION="${REGION:-seoul}"
          if [ -z "$MONTHS" ]; then
            MONTHS=""
            for i in 1 2 3 4 5 6; do
              MONTHS="$MONTHS,$(date -u -d "$i month ago" +%Y%m)"
            done
            MONTHS="${MONTHS#,}"
          fi
          FORCE=""
          if [ "$FORCE_IN" = "true" ]; then FORCE="--force"; fi
          echo "수집: region=$REGION · 구=$GU · 월=$MONTHS $FORCE"
          pnpm --filter @wirit/collectors exec tsx src/molitCli.ts \
            --region "$REGION" --gu "$GU" --months "$MONTHS" \
            --out "$GITHUB_WORKSPACE/data/datasets/molit" $FORCE

      - name: 캐시 커밋
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/datasets/molit/*.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "실거래(국토부) 수집 — $REGION / $GU / $MONTHS"
            # --autostash: 수집기가 남긴 부산물(data/raw 등) 때문에 rebase가 거부되어
            # **커밋해 놓고 push를 못 한 채 죽는** 일이 있었다(2026-07-26 소재 발굴).
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

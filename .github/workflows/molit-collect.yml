name: 실거래 수집 (국토부)

# 국토교통부 아파트 매매 실거래(상세)를 구·월 단위로 수집해 캐시 데이터셋으로 커밋한다.
# 1차 출처(오보 0). MOLIT_API_KEY(공공·무료 인코딩 인증키) 필요 → GitHub Secrets.
# 대장 엔진·카드 빌더가 이 캐시(data/datasets/molit/*.json)를 재사용.
on:
  # 대기열 파일이 바뀌면 실행한다 — kr-market·asset-fetch·geocode 와 같은 방식.
  # 작업 세션은 GitHub API 가 프록시에서 막혀 있어 workflow_dispatch 버튼을 누를 수 없다
  # (2026-07-31 확인: api.github.com 이 403 "GitHub access to this repository is not enabled").
  # 푸시는 되므로, 파일 한 줄을 밀어 넣는 것이 세션이 수집을 시작할 수 있는 **유일한 손잡이**다.
  # 한 줄 형식:  region=seoul gu=all months=202607 force=false
  push:
    paths:
      - "data/molit-queue.txt"
  workflow_dispatch:
    inputs:
      region:
        description: "지역 코드표 (seoul/gyeonggi/all)"
        required: false
        default: "seoul"
      gu:
        description: "구·시 목록(콤마) 또는 all (예: 강남구,서초구 / 구리시,용인시기흥구)"
        required: true
        default: "강남구"
      months:
        description: "수집 월(YYYYMM,콤마). 비우면 최근 6개월 자동"
        required: false
        default: ""
      force:
        description: "캐시 무시 재수집 (true/false)"
        required: false
        default: "false"
  # schedule:  ← 2026-08-31 해제(아래 주석 참고)
    # 매월 5일·20일 03:20 UTC.
    # 왜 두 번인가: 실거래 **신고기한이 계약 후 30일**이다. 5일치만 받으면 지난달 거래의
    # 상당수가 아직 안 들어와 있고, 20일에 한 번 더 받아야 그달 숫자가 굳는다.
    # (2026-07-31 오너 "매번 눌러야 돼?" → 사람이 시점을 재는 대신 달력에 못박았다)
  #    - cron: "20 3 5,20 * *"
  # ── 2026-08-31 예약 해제 — 수동(workflow_dispatch)·푸시 방아쇠로만 돈다.
  #    30일 실측에서 예약이 몰린 시간대일수록 스케줄러가 건너뛰었다(파수꾼 7%).
  #    매일 도는 예약은 텔레그램 알림 2건과 그 재료 4개만 남긴다:
  #      applyhome-collect(10:00) · singo-daily(07:30) · molit-peak-backfill(11:00) · apt-universe(매달 1일)
  #    깨우는 법: 대기열 파일에 한 줄 쓰고 push (CLAUDE.md §6) 또는 Actions 에서 Run workflow.

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      - name: 실거래 수집 → 캐시 데이터셋
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then echo "MOLIT_API_KEY 시크릿이 없습니다"; exit 1; fi
          GU="${{ github.event.inputs.gu }}"
          REGION="${{ github.event.inputs.region }}"
          MONTHS="${{ github.event.inputs.months }}"
          FORCE_IN="${{ github.event.inputs.force }}"
          # ── ⛔ 예약 런은 대기열을 **읽지 않는다** (2026-08-27, 신고가와 같은 규칙)
          #
          # 대기열은 세션이 "지금 한 번 돌려 봐"라고 미는 **일회용 손잡이**다. 그런데
          # 예약 런까지 마지막 줄을 읽는 바람에 **상시 설정**이 되어 있었다.
          # 8/1 에 민 `months=202607` 한 줄이 그대로 굳어, 8/5·8/20 정기 수집이
          # **7월 한 달만** 보고 돌았다 — 원래 의도는 **최근 6개월**이다.
          # 실거래는 신고기한이 계약 후 30일이라, 5일·20일 **두 번** 도는 이유가
          # 바로 "늦게 들어온 신고를 잡으려고"인데 그게 통째로 무력해졌다.
          # 게다가 이 배관은 텔레그램이 없어 **틀린 범위로 도는 동안 아무도 몰랐다.**
          #
          # 신고가에서 08-24 에 똑같은 일이 있었고 같은 방식으로 막았다
          # (`singo-daily.yml` 의 같은 자리). 여기도 맞춘다:
          # **대기열은 사람이 민 런(push)과 손으로 누른 런(workflow_dispatch)에서만 읽는다.**
          EVT="${{ github.event_name }}"
          # 대기열 푸시로 들어온 실행은 입력칸이 비어 있다 → 파일 마지막 줄에서 읽는다.
          # (주석 #·빈 줄 무시. 값이 없는 항목은 아래 기본값으로 떨어진다)
          if [ "$EVT" != "push" ] && [ "$EVT" != "workflow_dispatch" ]; then
            echo "방아쇠 '$EVT' — 대기열을 읽지 않고 기본 기준(서울 25개구 · 최근 6개월)으로 돕니다"
          elif [ -f data/molit-queue.txt ]; then
            LINE=$(grep -v '^[[:space:]]*#' data/molit-queue.txt | grep -v '^[[:space:]]*$' | tail -1)
            echo "대기열 마지막 줄: $LINE"
            [ -z "$REGION" ] && REGION=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^region=//p')
            [ -z "$GU" ]     && GU=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^gu=//p')
            [ -z "$MONTHS" ] && MONTHS=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^months=//p')
            [ -z "$FORCE_IN" ] && FORCE_IN=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^force=//p')
            # ⚠️ 대기열은 **공백으로 토큰을 가른다.** 그래서 값 안에 공백이 있으면 그 자리에서 잘린다 —
            #    `gu=광주 남구` 는 GU="광주" 가 되어 「알 수 없는 구」로 조용히 넘어갔다(2026-09-01
            #    봉선 재수집이 실제로 그렇게 헛돌았다). 코드표 키에 공백이 있는 구가 여럿이라
            #    (광주 남구·대구 수성구·부산 해운대구…) 대기열에서는 **`+` 를 공백 대신** 쓴다.
            GU=$(echo "$GU" | tr '+' ' ')
          fi
          # 정기 실행은 입력칸이 없다 → 서울 25개구 전체가 기본. '강남구' 하나만 받으면
          # 대장 엔진이 25개 구를 못 채워 카드가 반쪽이 된다.
          if [ "${{ github.event_name }}" = "schedule" ]; then GU="${GU:-all}"; fi
          GU="${GU:-강남구}"; REGION="${REGION:-seoul}"
          if [ -z "$MONTHS" ]; then
            MONTHS=""
            for i in 1 2 3 4 5 6; do
              MONTHS="$MONTHS,$(date -u -d "$i month ago" +%Y%m)"
            done
            MONTHS="${MONTHS#,}"
          fi
          FORCE=""
          if [ "$FORCE_IN" = "true" ]; then FORCE="--force"; fi
          # ⚠️ 정기(schedule) 실행은 **항상 재수집**한다. 수집기는 캐시가 있으면 건너뛰므로
          #    force 없이 돌면 이미 받아둔 달은 영영 갱신되지 않는다 — 늦게 들어온 신고가
          #    반영이 안 되고, 그러면 5일·20일 두 번 도는 의미가 없다.
          if [ "${{ github.event_name }}" = "schedule" ]; then FORCE="--force"; fi
          echo "수집: region=$REGION · 구=$GU · 월=$MONTHS $FORCE"
          echo "REGION=$REGION" >> "$GITHUB_ENV"; echo "GU=$GU" >> "$GITHUB_ENV"; echo "MONTHS=$MONTHS" >> "$GITHUB_ENV"
          # ⚠️ 실행 로그를 파일로 남긴다 — 실패했을 때 **왜** 실패했는지가 기록에 안 남아
          #    세션이 진단을 못 했다(2026-09-01 인천 수집). 세션은 Actions 로그를 못 읽는다.
          #    인증키가 섞여 나올 수 있으므로 serviceKey 는 지우고 남긴다.
          set -o pipefail
          pnpm --filter @wirit/collectors exec tsx src/molitCli.ts \
            --region "$REGION" --gu "$GU" --months "$MONTHS" \
            --out "$GITHUB_WORKSPACE/data/datasets/molit" $FORCE 2>&1 \
            | sed -E 's/(serviceKey=)[^&[:space:]"]+/\1<hidden>/g' \
            | tee /tmp/molit-run.log

      - name: 캐시 커밋
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/datasets/molit/*.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "실거래(국토부) 수집 — $REGION / $GU / $MONTHS"
            # --autostash: 수집기가 남긴 부산물(data/raw 등) 때문에 rebase가 거부되어
            # **커밋해 놓고 push를 못 한 채 죽는** 일이 있었다(2026-07-26 소재 발굴).
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      # ── 실행 결과를 **저장소에 남긴다** (2026-08-27)
      #
      # 이 배관은 8/5·8/20 정기 실행이 **두 번 연속 실패했는데 아무도 몰랐다.**
      # 이유가 둘이었다: ① 텔레그램이 없다 ② `data/*-last.md` 기록이 없어서
      # 배관 상태 표(`scripts/pipeline-status.mjs`)가 볼 것이 없었다 —
      # '다 채우면 쉬는 배관'으로 분류돼 **실패해도 초록불**이었다.
      #
      # 다른 배관과 같은 형식으로 남긴다. 이 파일 하나로 표가 실패를 본다.
      - name: 실행 결과 기록
        if: always()
        run: |
          {
            echo "# 실거래 수집(국토부) — 마지막 실행"
            echo
            echo "- 실행: $(TZ=Asia/Seoul date +%F) (KST) · 방아쇠 \`${{ github.event_name }}\`"
            echo "- 기준: $REGION / $GU · 월 $MONTHS"
            echo "- 결과: **${{ job.status == 'success' && '성공' || '실패' }}**"
            echo "- 커밋: \`${{ github.sha }}\`"
            echo
            echo "> 예약 런은 대기열(data/molit-queue.txt)을 읽지 않습니다 — 기본 기준으로만 돕니다(2026-08-27)."
            if [ "${{ job.status }}" != "success" ] && [ -s /tmp/molit-run.log ]; then
              echo
              echo "## 실패 로그 (끝 25줄)"
              echo '```'
              tail -25 /tmp/molit-run.log
              echo '```'
            fi
          } > data/molit-last.md
          git config user.name "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/molit-last.md
          git diff --cached --quiet || {
            git commit -m "실거래 수집(국토부) 기록 — $(TZ=Asia/Seoul date +%F)"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          }

      - name: 실패하면 말한다
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # ⚠️ **성공은 말하지 않는다.** 월 2회짜리 배관이라 실패만 말해도 1년에 몇 통이다.
          #    맞는 것을 매번 알리면 알림을 안 읽게 되고, 그러면 진짜 실패도 안 읽힌다.
          MSG=$(printf '⛔ 실거래 수집(국토부) 실패\n\n· 범위: %s / %s\n· 월: %s\n\n자세한 것은 data/molit-last.md 를 보세요.' "$REGION" "$GU" "$MONTHS")
          node scripts/notify-telegram.mjs "$MSG"

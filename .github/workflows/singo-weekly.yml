name: 금주의 신고가 (weekly)

# ── 무엇을 하나 (2026-08-12 오너 "매주 발행 컨텐츠로 쓸거야. 금주의 신고가로 가자")
# 매주 금요일 아침, 지난 7일간 **새로 확인된** 신고가를 모아 두 가지 재료를 만든다:
#   컨셉 A — 금주의 돌파 단지 (10억·20억…100억 선을 넘은 단지 한 장에)
#   컨셉 B — 개별 카드 후보 (오너가 몇 개 골라 각각 1장)
#
# ── 주간을 '계약일'로 안 자르는 이유
# 실거래 신고기한이 계약 후 30일이다. 계약일로 자르면 지난주 계약분이 아직 안 들어와
# **주간이 텅 빈다.** `foundOn`(우리가 확인한 날)으로 자른다 — 그주에 새로 드러난 소식이
# 그주의 콘텐츠다. 계약일은 카드에 그대로 싣는다.
#
# ── 수집은 안 한다
# 일간(singo-daily)이 이미 매일 받아 `data/datasets/singo-log/` 에 쌓아 뒀다.
# 주간은 **읽어서 묶기만** 한다 — API 를 두 번 두드릴 이유가 없고, 두드리면 일간과
# 판정이 어긋날 수 있다(인덱스가 이미 갱신돼 있어서).
on:
  schedule:
    # 금요일 08:00 KST = 목요일 23:00 UTC
    - cron: "0 23 * * 4"

  # 대기열 푸시가 방아쇠 — 세션은 Actions 버튼을 못 누른다.
  # 한 줄 형식(전부 선택):  days=7 top=15
  push:
    paths:
      - "data/singo-weekly-queue.txt"

  workflow_dispatch:
    inputs:
      days:
        description: "며칠치를 묶을지 (기본 7)"
        required: false
        default: "7"
      top:
        description: "알림에 이름을 적을 컨셉B 후보 수 (기본 15)"
        required: false
        default: "15"

permissions:
  contents: write

concurrency:
  group: singo-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 실행 조건 정하기
        id: cfg
        run: |
          DAYS="${{ github.event.inputs.days }}"
          TOP="${{ github.event.inputs.top }}"
          Q=data/singo-weekly-queue.txt
          if [ -z "$DAYS$TOP" ] && [ -f "$Q" ]; then
            LINE=$(grep -v '^[[:space:]]*#' "$Q" | grep -v '^[[:space:]]*$' | tail -1)
            echo "대기열 마지막 줄: ${LINE:-(비어 있음)}"
            for kv in $LINE; do
              case "$kv" in
                days=*) DAYS="${kv#days=}" ;;
                top=*)  TOP="${kv#top=}" ;;
              esac
            done
          fi
          echo "days=${DAYS:-7}" >> "$GITHUB_OUTPUT"
          echo "top=${TOP:-15}" >> "$GITHUB_OUTPUT"
          echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      - name: 주간 묶기
        run: |
          set -o pipefail
          node scripts/singo-weekly.mjs \
            --today ${{ steps.cfg.outputs.today }} \
            --days ${{ steps.cfg.outputs.days }} \
            --top-b ${{ steps.cfg.outputs.top }} 2>&1 | tee /tmp/weekly.log

      - name: 실행 결과 기록
        if: always()
        run: |
          {
            echo "# 금주의 신고가 — 마지막 실행"
            echo
            echo "- 실행: ${{ steps.cfg.outputs.today }} (KST) · 방아쇠 \`${{ github.event_name }}\`"
            echo "- 기간: 최근 ${{ steps.cfg.outputs.days }}일 (확인한 날 기준)"
            echo "- 결과: **${{ job.status == 'success' && '성공' || '실패' }}**"
            echo
            echo '```'
            cat /tmp/weekly.log 2>/dev/null || echo "(실행되지 못했습니다)"
            echo '```'
          } > data/singo-weekly-last.md

      - name: 커밋
        if: always()
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@github.com"
          git add -f data/singo-weekly-last.md
          # ⚠️ 경로를 한 줄에 몰아 쓰지 않는다 — 하나라도 없으면 git add 가 통째로 실패한다
          for P in data/datasets/singo-weekly.json docs/weekly; do
            [ -e "$P" ] && git add "$P" || true
          done
          if git diff --cached --quiet; then
            echo "바뀐 것 없음 — 커밋 생략"
          else
            git commit -m "금주의 신고가 ${{ steps.cfg.outputs.today }}"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: 텔레그램 (돌파 0건인 주도 보낸다)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            node scripts/notify-telegram.mjs "⚠️ 금주의 신고가 묶기 실패 (${{ steps.cfg.outputs.today }}) — data/singo-weekly-last.md 확인"
            exit 0
          fi
          MSG=$(cat data/singo-weekly-alert.txt 2>/dev/null || true)
          if [ -n "$MSG" ]; then
            node scripts/notify-telegram.mjs "$MSG"
          else
            node scripts/notify-telegram.mjs "📅 금주의 신고가 (${{ steps.cfg.outputs.today }}) — 묶을 것이 없습니다"
          fi

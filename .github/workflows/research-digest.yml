name: 소재 보드 수집 (daily)

# 매일 아침 주제별 뉴스·트렌드 신호를 수집해 research/briefs/{날짜}-auto.md 로 커밋한다.
# 운영자는 GitHub 앱에서 보드를 열어 [x] 체크하거나, Claude 세션에 선택을 알려준다.
on:
  schedule:
        # ⚠️ **정각을 피한다** (2026-08-27). 8/26~27 GitHub Actions 장애 때
    #    21:00~22:10 UTC 창의 예약이 통째로 사라졌다 — 관제탑 배포(21:00)·데이터 수집(21:30)·
    #    파이프라인(22:00)·소재 보드(22:00)·신고가(22:00)가 한꺼번에 안 떴다.
    #    같은 시간대의 `17 */2`·`37 */2` 는 멀쩡히 돌았다. 정각은 전 세계가 몰리는 자리다.
    #    ↳ 파수꾼은 **안 뜬 것을 찾아낸다**. 이 줄은 **애초에 덜 몰리게 한다**. 둘 다 필요하다.
    - cron: "26 22 * * *" # 07:26 KST 매일
  workflow_dispatch: # 수동 실행 버튼 (관제탑 [새 소재 찾아줘]도 여기로 들어온다)
    inputs:
      query:
        description: "찾을 키워드 (비우면 고정 주제 전체 수집)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 파서 셀프테스트
        run: |
          pnpm --filter @wirit/collectors selftest
          pnpm --filter @wirit/dashboard-static selftest

      # ⚠️ 경고로만 둔다 — 막지 않는다.
      # 이 검사(사진 카탈로그·데이터셋 메타)는 소재 수집과 아무 상관이 없는데,
      # 실패하면서 **오너의 [새 소재 찾아줘]를 통째로 죽이고 있었다**(2026-07-26).
      # 관련 없는 위생 검사가 오너의 요청을 막게 두지 않는다.
      - name: 자산 허브 무결성 검사
        continue-on-error: true
        run: node scripts/validate-assets.mjs

      # 고정 주제 수집은 항상 돈다(매일의 기본 급식).
      - name: 소재 신호 수집 → 보드 생성
        run: pnpm --filter @wirit/collectors collect-signals

      # 오너가 관제탑에서 "OO 자료 찾아줘"라고 적으면 그 말이 여기 검색어로 들어온다.
      # 이게 없던 동안 지시는 접수만 되고 아무 일도 안 일어났다(2026-07-26 오너 보고).
      - name: 지시 키워드 수집
        if: inputs.query != ''
        run: pnpm --filter @wirit/collectors collect-signals -- --query "${{ inputs.query }}"

      # ⚠️ 여기가 빠져 있어서 [새 소재 발굴]이 "눌러도 안 먹는" 버튼이었다(2026-07-26).
      #    수집 결과는 research/briefs/*.md 로만 떨어졌고, 소재 보드는 ideas.json 을 본다.
      #    이 단계가 둘을 잇는다 — 관제탑에 실제로 새 소재가 뜬다.
      - name: 신호 → 소재 보드 반영
        run: node scripts/ingest-signals.mjs

      - name: 보드 커밋
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/briefs/*.md research/ideas.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "소재 보드 자동 수집 $(date -u +%Y-%m-%d)"
            # --autostash: 수집기가 남긴 부산물(data/raw 등) 때문에 rebase가 거부되어
            # **커밋해 놓고 push를 못 한 채 죽는** 일이 있었다(2026-07-26 소재 발굴).
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      # 관제탑 재생성 — 새 보드/결정/회사/자산을 반영한 정적 페이지.
      # data/content·data/out은 저장소에 없으므로(gitignore) CI 산출물엔 렌더 썸네일이 빠질 수 있다.
      # GitHub Pages 상시 배포는 다음 단계(토글)로 미루고, 지금은 워크플로 아티팩트로 내려받아 확인한다.
      - name: 관제탑 정적 생성
        run: pnpm --filter @wirit/dashboard-static all

      - name: 관제탑 미리보기 업로드
        uses: actions/upload-artifact@v4
        with:
          name: control-tower
          path: packages/dashboard/index.html
          if-no-files-found: warn

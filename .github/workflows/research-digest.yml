name: 소재 보드 수집 (daily)

# 매일 아침 주제별 뉴스·트렌드 신호를 수집해 research/briefs/{날짜}-auto.md 로 커밋한다.
# 운영자는 GitHub 앱에서 보드를 열어 [x] 체크하거나, Claude 세션에 선택을 알려준다.
on:
  schedule:
    - cron: "0 22 * * *" # 07:00 KST 매일
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      - name: 소재 신호 수집 → 보드 생성
        run: pnpm --filter @wirit/collectors collect-signals

      - name: 보드 커밋
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/briefs/*.md
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "소재 보드 자동 수집 $(date -u +%Y-%m-%d)"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

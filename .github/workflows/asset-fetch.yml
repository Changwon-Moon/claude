name: 로고 자동 취득 (Wikimedia)

# 데이터셋/콘텐츠의 회사명을 읽어 Wikimedia Commons에서 라이선스 명시 로고를 자동 취득 →
# templates/_shared/logos/ 에 저장하고 catalog.json에 출처·라이선스와 함께 등록·커밋한다.
# 키 불필요. 이 세션(코드 대화창)은 웹 이미지가 막혀 있으므로 자동 취득은 여기(Actions)에서 돈다.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "대상 파일(데이터셋 또는 콘텐츠 JSON) 경로"
        required: true
        default: "data/datasets/salary-freshman-2026-07.json"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      - name: 로고 취득
        run: pnpm --filter @wirit/collectors fetch-logos "${{ github.event.inputs.target }}"

      - name: 자산 허브 무결성 검사
        run: node scripts/validate-assets.mjs

      - name: 취득 로고 커밋
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add templates/_shared/logos/
          if git diff --cached --quiet; then
            echo "새 로고 없음 — 커밋 생략"
          else
            git commit -m "로고 자동 취득 (Wikimedia) $(date -u +%Y-%m-%d)"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

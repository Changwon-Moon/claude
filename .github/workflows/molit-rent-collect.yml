name: 전월세 실거래 수집 (국토부)

# 국토교통부 아파트 전월세 실거래를 구·월 단위로 받아 **전세/월세·신규/갱신 집계(건수·비중)**로 커밋한다.
# 1차 출처(오보 0). MOLIT_API_KEY(매매와 같은 키) 필요 → GitHub Secrets.
# '아파트 전월세 자료' 활용신청이 매매와 별도 승인 대상이다(403이면 승인/전파 확인).
# 계약 비중·현황 카드(월세화·전세월세 비중 등)의 재료.
on:
  # 대기열 파일 한 줄 푸시가 세션이 수집을 거는 유일한 손잡이(세션은 Run 버튼 못 누름).
  #   한 줄 형식:  region=seoul gu=all months=202606 force=false
  push:
    paths:
      - "data/molit-rent-queue.txt"
      - ".github/workflows/molit-rent-collect.yml"
      - "packages/collectors/src/molitRentCli.ts"
      - "packages/collectors/src/sources/molit.ts"
      - "packages/collectors/src/parse/molit.ts"
  workflow_dispatch:
    inputs:
      region:
        description: "지역 코드표 (seoul/gyeonggi/all)"
        required: false
        default: "seoul"
      gu:
        description: "구·시 목록(콤마) 또는 all"
        required: false
        default: "all"
      months:
        description: "수집 월(YYYYMM,콤마). 비우면 최근 6개월 자동"
        required: false
        default: ""
      force:
        description: "캐시 무시 재수집 (true/false)"
        required: false
        default: "false"
  # schedule:  ← 2026-08-31 해제(아래 주석 참고)
    # 전월세도 신고기한 30일 → 매월 5일·20일 03:40 UTC 두 번(그달 숫자가 굳게).
  #    - cron: "40 3 5,20 * *"
  # ── 2026-08-31 예약 해제 — 수동(workflow_dispatch)·푸시 방아쇠로만 돈다.
  #    30일 실측에서 예약이 몰린 시간대일수록 스케줄러가 건너뛰었다(파수꾼 7%).
  #    매일 도는 예약은 텔레그램 알림 2건과 그 재료 4개만 남긴다:
  #      applyhome-collect(10:00) · singo-daily(07:30) · molit-peak-backfill(11:00) · apt-universe(매달 1일)
  #    깨우는 법: 대기열 파일에 한 줄 쓰고 push (CLAUDE.md §6) 또는 Actions 에서 Run workflow.

permissions:
  contents: write

concurrency:
  group: molit-rent-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      - name: 전월세 실거래 수집 → 집계 데이터셋
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then echo "::error::MOLIT_API_KEY 시크릿이 없습니다"; exit 1; fi
          GU="${{ github.event.inputs.gu }}"
          REGION="${{ github.event.inputs.region }}"
          MONTHS="${{ github.event.inputs.months }}"
          FORCE_IN="${{ github.event.inputs.force }}"
          # ── ⛔ 예약 런은 대기열을 **읽지 않는다** (2026-08-27, 신고가와 같은 규칙)
          #
          # 대기열은 세션이 "지금 한 번 돌려 봐"라고 미는 **일회용 손잡이**다. 그런데
          # 예약 런까지 마지막 줄을 읽는 바람에 **상시 설정**이 되어 있었다.
          # 8/1 에 민 `region=gyeonggi gu=<경기 15곳> months=202607` 한 줄이 그대로 굳어,
          # 정기 수집이 **서울 25개구 최근 6개월**이 아니라 **경기 15곳 7월 한 달**만 받고 있었다.
          # 게다가 그건 **성공으로 끝난다** — 초록불인데 엉뚱한 것을 받아 온다.
          # 실거래는 신고기한이 계약 후 30일이라, 5일·20일 **두 번** 도는 이유가
          # 바로 "늦게 들어온 신고를 잡으려고"인데 그게 통째로 무력해졌다.
          # 게다가 이 배관은 텔레그램이 없어 **틀린 범위로 도는 동안 아무도 몰랐다.**
          #
          # 신고가에서 08-24 에 똑같은 일이 있었고 같은 방식으로 막았다
          # (`singo-daily.yml` 의 같은 자리). 여기도 맞춘다:
          # **대기열은 사람이 민 런(push)과 손으로 누른 런(workflow_dispatch)에서만 읽는다.**
          EVT="${{ github.event_name }}"
          # 대기열/소스 푸시로 들어온 실행은 입력칸이 비어 있다 → 큐 파일 마지막 줄에서 읽는다.
          if [ "$EVT" != "push" ] && [ "$EVT" != "workflow_dispatch" ]; then
            echo "방아쇠 '$EVT' — 대기열을 읽지 않고 기본 기준(서울 25개구 · 최근 6개월)으로 돕니다"
          elif [ -f data/molit-rent-queue.txt ]; then
            LINE=$(grep -v '^[[:space:]]*#' data/molit-rent-queue.txt | grep -v '^[[:space:]]*$' | tail -1)
            echo "대기열 마지막 줄: $LINE"
            [ -z "$REGION" ] && REGION=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^region=//p')
            [ -z "$GU" ]     && GU=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^gu=//p')
            [ -z "$MONTHS" ] && MONTHS=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^months=//p')
            [ -z "$FORCE_IN" ] && FORCE_IN=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^force=//p')
          fi
          # 정기 실행은 서울 25개구 전체·최근 6개월 기본(비중 추세용).
          if [ "${{ github.event_name }}" = "schedule" ]; then GU="${GU:-all}"; fi
          GU="${GU:-강남구}"; REGION="${REGION:-seoul}"
          if [ -z "$MONTHS" ]; then
            MONTHS=""
            for i in 1 2 3 4 5 6; do MONTHS="$MONTHS,$(date -u -d "$i month ago" +%Y%m)"; done
            MONTHS="${MONTHS#,}"
          fi
          FORCE=""
          if [ "$FORCE_IN" = "true" ]; then FORCE="--force"; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then FORCE="--force"; fi
          echo "수집: region=$REGION · 구=$GU · 월=$MONTHS $FORCE"
          echo "REGION=$REGION" >> "$GITHUB_ENV"; echo "GU=$GU" >> "$GITHUB_ENV"; echo "MONTHS=$MONTHS" >> "$GITHUB_ENV"
          pnpm --filter @wirit/collectors exec tsx src/molitRentCli.ts \
            --region "$REGION" --gu "$GU" --months "$MONTHS" \
            --out "$GITHUB_WORKSPACE/data/datasets/molit-rent" $FORCE

      - name: 집계 커밋
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/datasets/molit-rent/*.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "전월세 실거래(국토부) 집계 — ${REGION} / ${GU} / ${MONTHS}"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      # ── 실행 결과를 **저장소에 남긴다** (2026-08-27)
      #
      # 이 배관은 8/5·8/20 정기 실행이 **두 번 연속 실패했는데 아무도 몰랐다.**
      # 이유가 둘이었다: ① 텔레그램이 없다 ② `data/*-last.md` 기록이 없어서
      # 배관 상태 표(`scripts/pipeline-status.mjs`)가 볼 것이 없었다 —
      # '다 채우면 쉬는 배관'으로 분류돼 **실패해도 초록불**이었다.
      #
      # 다른 배관과 같은 형식으로 남긴다. 이 파일 하나로 표가 실패를 본다.
      - name: 실행 결과 기록
        if: always()
        run: |
          {
            echo "# 전월세 실거래 수집 — 마지막 실행"
            echo
            echo "- 실행: $(TZ=Asia/Seoul date +%F) (KST) · 방아쇠 \`${{ github.event_name }}\`"
            echo "- 기준: $REGION / $GU · 월 $MONTHS"
            echo "- 결과: **${{ job.status == 'success' && '성공' || '실패' }}**"
            echo "- 커밋: \`${{ github.sha }}\`"
            echo
            echo "> 예약 런은 대기열(data/molit-rent-queue.txt)을 읽지 않습니다 — 기본 기준으로만 돕니다(2026-08-27)."
          } > data/molit-rent-last.md
          git config user.name "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/molit-rent-last.md
          git diff --cached --quiet || {
            git commit -m "전월세 실거래 수집 기록 — $(TZ=Asia/Seoul date +%F)"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          }

      - name: 실패하면 말한다
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # ⚠️ **성공은 말하지 않는다.** 월 2회짜리 배관이라 실패만 말해도 1년에 몇 통이다.
          #    맞는 것을 매번 알리면 알림을 안 읽게 되고, 그러면 진짜 실패도 안 읽힌다.
          MSG=$(printf '⛔ 전월세 실거래 수집 실패\n\n· 범위: %s / %s\n· 월: %s\n\n자세한 것은 data/molit-rent-last.md 를 보세요.' "$REGION" "$GU" "$MONTHS")
          node scripts/notify-telegram.mjs "$MSG"

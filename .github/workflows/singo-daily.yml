name: 오늘의 신고가 (daily)

# ── 무엇을 하나 (2026-08-12 오너 "매일 아침 신고가 톡도 받게 해줘")
# 매일 아침, 최근 신고분 실거래를 받아 **단지+타입 역대 최고가를 넘어선 거래**만 골라
# 텔레그램으로 보낸다. 아침 7시 — 청약 알림(11시)보다 먼저 온다.
#
# ── 기준 (오너 결정)
#   · 역대 = 2006-01 부터 (실거래 공개 시작)
#   · 단위 = 단지 + **전용 59타입(25평) / 전용 84타입(34평)** — 이 둘만 본다
#   · 지역 = 서울 25개구 전역 + 경기 20개 시(오너가 고름)
#   · 단지 = **1000세대 이상 명부(apt-universe.json) 안에서만**
# 자세한 근거는 docs/guides/신고가-알림-기준.md
#
# ── 판정하지 않는 것
# 역대 인덱스가 아직 안 채워진 지역(molit-peak-backfill 진행 중)과 명부에 없는 단지는
# **건너뛴다.** 반쪽 기준으로 "역대 최고가"라 부르면 그게 곧 오보다.
on:
  schedule:
    # 07:00 KST (22:00 UTC 전날) — 2026-08-13 오너 "예약도 오전 7시에 해줘".
    # ⚠️ 깃허브 예약은 **늦게 뜬다**(전날 청약 알림이 37분 늦었다). 07:00 은 "이때 온다"가 아니라
    #    "이때부터 줄을 선다"는 뜻이다. 수집이 10분쯤 걸리니 대개 07:1x~07:4x 사이에 도착한다.
    - cron: "0 22 * * *"

  # 대기열 푸시가 방아쇠 — 세션은 Actions 버튼을 못 누른다.
  # 한 줄 형식(전부 선택):  months=2 top=0 sort=price   (top=0 이면 전부 나열)
  push:
    paths:
      - "data/singo-queue.txt"

  workflow_dispatch:
    inputs:
      months:
        description: "최근 몇 개월치 신고분을 볼지 (기본 2)"
        required: false
        default: "2"
      top:
        description: "알림에 이름을 적을 상위 건수 (기본 0 = 전부)"
        required: false
        default: "0"
      sort:
        description: "정렬 — price(거래가 큰 순, 기본) 또는 gain(갱신폭 큰 순)"
        required: false
        default: ""

  # ── 자동 재시도가 이 문으로 들어온다 (2026-08-24 오너 승인)
  #
  # 왜 필요한가: 실거래 API 는 **러너 출구 IP 에 따라** 열리기도 닫히기도 한다.
  # 08-24 아침 런은 18개 지역이 전부 `fetch failed`(HTTP 응답조차 없음) 로 접혔는데,
  # **같은 키·같은 인자로 1시간 17분 뒤 다른 러너에서 61/61 전부 성공**했다.
  # 수집기는 실행 안에서 5분(60초×5)을 기다리지만 **같은 실행 안에서는 IP 가 안 바뀌므로
  # 소용이 없다.** 필요한 것은 대기가 아니라 **새 러너**다.
  #
  # 왜 대기열 푸시가 아닌가: GITHUB_TOKEN 으로 민 커밋은 **워크플로를 트리거하지 않는다**
  # (2026-08-24 실측 — push 방아쇠 런 100건 중 봇이 민 것은 0건). 세션이 손으로 미는 것과
  # 다르다. 그래서 `workflow_run` → `workflow_call` 로 새 런을 띄운다(`singo-retry.yml`).
  #
  # ⚠️ 이 문을 늘리지 않는다. 재시도는 **예약 런이 죽었을 때 딱 1회**이고,
  #    재시도 런의 event 는 `workflow_run` 이라 스스로를 다시 부를 수 없다(구조적 무한루프 차단).
  workflow_call:
    inputs:
      months:
        type: string
        required: false
        default: ""
      top:
        type: string
        required: false
        default: ""
      sort:
        type: string
        required: false
        default: ""
      retry:
        description: "재시도 런인가 — 기록·알림 문구에만 쓴다"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# ⚠️ 재시도는 원 런이 **끝난 뒤에** 뜨므로 이 그룹에서 서로를 죽이지 않는다.
#    cancel-in-progress 를 켜지 않는 이유가 그것이다(켜면 재시도가 원 런을 자를 수 있다).
concurrency:
  group: singo-daily
  cancel-in-progress: false

jobs:
  singo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 실행 조건 정하기
        id: cfg
        run: |
          # ⚠️ `inputs` 는 workflow_dispatch 와 workflow_call 둘 다에서 채워진다.
          #    `github.event.inputs` 는 workflow_call 에서 **비어 있다** — 그래서 inputs 를 먼저 본다.
          MONTHS="${{ inputs.months || github.event.inputs.months }}"
          TOP="${{ inputs.top || github.event.inputs.top }}"
          SORT="${{ inputs.sort || github.event.inputs.sort }}"
          # ── ⛔ 예약 런은 대기열을 **읽지 않는다** (2026-08-24 오너 결정)
          #
          # 대기열은 세션이 "지금 한 번 돌려 봐"라고 미는 **일회용 손잡이**로 만든 것인데,
          # 예약 런까지 마지막 줄을 읽는 바람에 **상시 설정**이 되어 있었다.
          # 08-19 배관 점검 때 진단용으로 민 `months=1` 한 줄이 그대로 굳어,
          # **5일간 매일 아침 알림이 1개월치만 보고 있었다.**
          #
          # 결과가 실제로 갈렸다 — 계약월이 전월(7월)인 신고가 건수:
          #   08-13: 7건 · 08-14: 3건 · 08-16: 5건 → **08-19 이후 매일 0건**
          # 실거래 신고기한이 계약 후 30일이라, 8월 후반에 드러나는 7월 계약분이 통째로
          # 안 보였다. 게다가 그 거래들이 인덱스에 안 들어가므로 **더 낮은 8월 거래가
          # 신고가로 잘못 나갈 수 있었다** — 오보 0 이 걸린 문제다.
          #
          # 그래서 대기열은 **사람이 직접 민 런(push)과 손으로 누른 런(workflow_dispatch)** 에서만 읽는다.
          # 예약 런과 자동 재시도(workflow_call)는 **문서에 적힌 기본값**으로만 돈다.
          # ⚠️ 재시도가 대기열을 읽으면 예약 런과 조건이 갈린다 — 그래서 둘 다 안 읽는 쪽으로 맞췄다.
          EVT="${{ github.event_name }}"
          Q=data/singo-queue.txt
          if [ "$EVT" != "push" ] && [ "$EVT" != "workflow_dispatch" ]; then
            echo "방아쇠 '$EVT' — 대기열을 읽지 않고 기본 기준으로 돕니다 (예약·재시도의 기준은 문서가 정본)"
          elif [ -z "$MONTHS$TOP$SORT" ] && [ -f "$Q" ]; then
            LINE=$(grep -v '^[[:space:]]*#' "$Q" | grep -v '^[[:space:]]*$' | tail -1)
            echo "대기열 마지막 줄: ${LINE:-(비어 있음)}"
            for kv in $LINE; do
              case "$kv" in
                months=*) MONTHS="${kv#months=}" ;;
                top=*)    TOP="${kv#top=}" ;;
                sort=*)   SORT="${kv#sort=}" ;;
              esac
            done
          fi
          # 기본 2개월 — 신고기한 30일을 덮기 위해 **직전 달까지** 훑는다. 문서(신고가-알림-기준.md)의 정본값.
          echo "months=${MONTHS:-2}" >> "$GITHUB_OUTPUT"
          echo "top=${TOP:-0}" >> "$GITHUB_OUTPUT"
          echo "sort=${SORT:-price}" >> "$GITHUB_OUTPUT"
          echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      # ⚠️ 키가 없으면 여기서 멈춘다 — 조용한 실패는 몇 주가 지나도 안 보인다.
      - name: 키 확인
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then
            echo "::error::MOLIT_API_KEY 가 GitHub Secrets 에 없습니다."
            exit 1
          fi

      - name: 신고가 확인
        id: collect
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          set -o pipefail
          pnpm --filter @wirit/collectors collect-singo -- \
            --today ${{ steps.cfg.outputs.today }} \
            --months ${{ steps.cfg.outputs.months }} \
            --top ${{ steps.cfg.outputs.top }} \
            --sort ${{ steps.cfg.outputs.sort }} 2>&1 | tee /tmp/singo.log

      # ── 카드 재료 만들기 (2026-08-12 오너 "주간 하지말고 매일 보내줘")
      # 처음엔 주간으로 잡았다가, 돌파가 주 1~2건이라 카드가 빈다고 알리자 매일로 바꿨다.
      # 수집기가 쌓아 둔 누적 로그를 읽어 **컨셉 A(돌파 단지) · 컨셉 B(개별 카드 후보)** 로 묶는다.
      # ⚠️ 여기서 돌파를 **다시 판정하지 않는다** — 수집기가 판정 시점의 인덱스로 이미 쟀다.
      - name: 카드 재료 묶기
        if: success()
        run: |
          set -o pipefail
          node scripts/singo-digest.mjs --today ${{ steps.cfg.outputs.today }} --days 1 2>&1 | tee -a /tmp/singo.log

      # 파서 셀프테스트는 **수집 뒤에** 돌린다(2026-07-31: 테스트가 수집을 막았던 사고).
      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      - name: 실행 결과 기록
        if: always()
        run: |
          {
            echo "# 오늘의 신고가 — 마지막 실행"
            echo
            echo "- 실행: ${{ steps.cfg.outputs.today }} (KST) · 방아쇠 \`${{ github.event_name }}\`${{ inputs.retry && ' · **자동 재시도**' || '' }}"
            echo "- 기준: 1000세대 이상 명부 · 전용 59·84 타입 · 최근 ${{ steps.cfg.outputs.months }}개월 신고분"
            echo "- 결과: **${{ job.status == 'success' && '성공' || '실패' }}**"
            echo "- 커밋: \`${{ github.sha }}\`"
            echo
            echo '```'
            cat /tmp/singo.log 2>/dev/null || echo "(실행되지 못했습니다)"
            echo '```'
          } > data/singo-last.md

      - name: 커밋
        if: always()
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@github.com"
          git add -f data/singo-last.md
          # ⚠️ 경로를 한 줄에 몰아 쓰지 않는다. 하나라도 없으면 git add 가 통째로 실패해
          #    **아무것도 안 담긴다** (2026-08-12 첫 실행에서 singo-latest.json 이 이렇게 빠졌다).
          for P in data/datasets/singo-latest.json data/datasets/singo-log data/datasets/singo-digest.json data/datasets/molit-peak docs/daily; do
            [ -e "$P" ] && git add "$P" || true
          done
          if git diff --cached --quiet; then
            echo "바뀐 것 없음 — 커밋 생략"
          else
            git commit -m "오늘의 신고가 ${{ steps.cfg.outputs.today }}"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: 텔레그램 알림 (조용한 날도 한 줄은 보낸다)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # ⚠️ 실패한 날에도 **이유를 그대로 보낸다** (2026-08-19).
          #    수집 0건인 날을 빨간불로 만들면서(molitSingoCli) 이 가지를 안 고쳤다면,
          #    오너가 받던 "⛔ 실거래 API 가 계속 응답하지 않아 …" 상세 문구가 짧은
          #    "확인 실패"로 바뀌어 **원인이 사라졌을 것**이다. 수집기는 죽기 전에
          #    singo-alert.txt 를 이미 써 두므로, 있으면 그것을 보내고 없을 때만 한 줄로 알린다.
          if [ "${{ job.status }}" != "success" ]; then
            # ── 재시도가 따라붙는지를 **먼저 말해 준다** (2026-08-24)
            #    안 그러면 오너가 ⛔ 를 읽고 사람을 부르는데, 10분 뒤 조용히 정상 알림이 온다.
            #    "실패했다"만 있고 "그래서 뭐가 되나"가 없으면 알림은 걱정만 남긴다.
            TAIL=""
            if [ "${{ github.event_name }}" = "schedule" ]; then
              TAIL=$'\n\n↻ 새 러너로 자동 재시도합니다 — 10분쯤 뒤 결과가 한 번 더 옵니다. (실거래 API 는 러너 출구 IP 를 탑니다)'
            elif [ "${{ inputs.retry }}" = "true" ]; then
              TAIL=$'\n\n⛔ 재시도까지 실패했습니다 — 오늘은 여기까지입니다. 배관을 봐야 합니다.'
            fi
            MSG=$(cat data/singo-alert.txt 2>/dev/null || true)
            if [ -n "$MSG" ]; then
              node scripts/notify-telegram.mjs "${MSG}${TAIL}"
            else
              node scripts/notify-telegram.mjs "⚠️ 신고가 확인 실패 (${{ steps.cfg.outputs.today }}) — data/singo-last.md 를 확인하세요${TAIL}"
            fi
            exit 0
          fi
          MSG=$(cat data/singo-alert.txt 2>/dev/null || true)
          if [ -n "$MSG" ]; then
            # ⚠️ md 경로 줄을 붙이지 않는다 (2026-08-13 오너 "md로 보내지말고").
            #    톡 안에서 전체 목록이 다 보여야 한다. 길면 notify-telegram 이 나눠 보낸다.
            node scripts/notify-telegram.mjs "$MSG"
          else
            HB=$(node scripts/singo-heartbeat.mjs --today "${{ steps.cfg.outputs.today }}" 2>/dev/null || true)
            if [ -n "$HB" ]; then
              node scripts/notify-telegram.mjs "$HB"
            else
              node scripts/notify-telegram.mjs "🏙 신고가 확인 완료 (${{ steps.cfg.outputs.today }}) — 0건"
            fi
          fi

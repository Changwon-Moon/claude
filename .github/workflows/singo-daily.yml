name: 오늘의 신고가 (daily)

# ── 무엇을 하나 (2026-08-12 오너 "매일 아침 신고가 톡도 받게 해줘")
# 매일 아침, 최근 신고분 실거래를 받아 **단지+타입 역대 최고가를 넘어선 거래**만 골라
# 텔레그램으로 보낸다. 아침 7시 — 청약 알림(11시)보다 먼저 온다.
#
# ── 기준 (오너 결정)
#   · 역대 = 2006-01 부터 (실거래 공개 시작)
#   · 단위 = 단지 + **전용 59타입(25평) / 전용 84타입(34평)** — 이 둘만 본다
#   · 지역 = 서울 25개구 전역 + 경기 20개 시(오너가 고름)
#   · 단지 = **1000세대 이상 명부(apt-universe.json) 안에서만**
# 자세한 근거는 docs/guides/신고가-알림-기준.md
#
# ── 판정하지 않는 것
# 역대 인덱스가 아직 안 채워진 지역(molit-peak-backfill 진행 중)과 명부에 없는 단지는
# **건너뛴다.** 반쪽 기준으로 "역대 최고가"라 부르면 그게 곧 오보다.
on:
  schedule:
    # 04:55 KST (19:55 UTC 전날) — 2026-08-31 오너 지시로 07:30 → 04:55 로 당겼다.
    #
    # ⚠️ 깃허브 예약은 **이때 온다가 아니라 이때부터 줄을 선다**는 뜻이다.
    #    30일 실측(2026-08-31): 08-14~08-26 은 지연 중앙값 9분으로 멀쩡했는데,
    #    08-27 부터 114~477분으로 튀었다. 일찍 걸어야 늦어도 아침 안에 도착한다.
    #    청약 알림(10:00 KST)까지 5시간 여유가 생겨 순서도 안 뒤집힌다.
    #
    # ⚠️ **정각을 피한다** (2026-08-27). 8/26~27 GitHub Actions 장애 때
    #    21:00~22:10 UTC 창의 예약이 통째로 사라졌다 — 관제탑 배포(21:00)·데이터 수집(21:30)·
    #    파이프라인(22:00)·소재 보드(22:00)·신고가(22:00)가 한꺼번에 안 떴다.
    #    같은 시간대의 `17 */2`·`37 */2` 는 멀쩡히 돌았다. 정각은 전 세계가 몰리는 자리다.
    #    그래서 20:00 이 아니라 19:55 다. 그 창(21:00~22:10 UTC) 바깥이기도 하다.
    #
    # ⚠️ 안 뜬 것을 찾아 주던 `schedule-watchdog.yml` 은 2026-08-31 에 폐지했다
    #    (자신의 실행률이 7%였다 — 같은 배 안에서 배에 구멍 났는지 보는 구조).
    #    지금 자동 안전망은 `singo-retry.yml` 사다리 하나다.
    - cron: "55 19 * * *"
    # ── 예약을 넷으로 (2026-09-03) — **문이 열린 순간을 잡기 위해서다**
    #
    # 실측(09-02 UTC): 백필이 23:29 에 69회 **전부 실패**하고, **16분 뒤** 23:45 에
    # 1,200회를 **전부 성공**했다. 그 1분 뒤 신고가도 122/122 성공.
    # 08-31 엔 00:22 실패 → **1분 뒤** 00:23 성공.
    # → 막히는 것은 **실행 단위**다. 호출량도, 다른 예약과의 충돌도 아니다
    #   (1,200회를 연속으로 쏴도 전부 성공한 실행이 있다).
    #
    # 그러니 답은 「덜 부르기」가 아니라 **「다른 실행으로 다시 두드리기」**다.
    # 예약을 흩어 두면 지각(09-03 에 2시간 34분 늦게 떴다)의 영향도 같이 준다.
    #
    # ⚠️ 성공한 날 뒤 예약은 **호출 0회**로 끝난다 — 아래 「이미 성공했나」 가드가 막는다.
    #    그 가드가 없으면 예약을 늘리는 것이 그대로 호출 네 배가 된다.
    - cron: "40 20 * * *"   # 05:40 KST
    - cron: "25 21 * * *"   # 06:25 KST
    - cron: "10 22 * * *"   # 07:10 KST

  # 대기열 푸시가 방아쇠 — 세션은 Actions 버튼을 못 누른다.
  # 한 줄 형식(전부 선택):  months=2 top=0 sort=price   (top=0 이면 전부 나열)
  push:
    paths:
      - "data/singo-queue.txt"

  workflow_dispatch:
    inputs:
      months:
        description: "최근 몇 개월치 신고분을 볼지 (기본 2)"
        required: false
        default: "2"
      top:
        description: "알림에 이름을 적을 상위 건수 (기본 0 = 전부)"
        required: false
        default: "0"
      sort:
        description: "정렬 — price(거래가 큰 순, 기본) 또는 gain(갱신폭 큰 순)"
        required: false
        default: ""
      quiet:
        description: "실패해도 톡을 보내지 않는다 (성공하면 평소대로 보낸다)"
        type: boolean
        required: false
        default: false

  # ── 자동 재시도가 이 문으로 들어온다 (2026-08-24 오너 승인)
  #
  # 왜 필요한가: 실거래 API 는 **러너 출구 IP 에 따라** 열리기도 닫히기도 한다.
  # 08-24 아침 런은 18개 지역이 전부 `fetch failed`(HTTP 응답조차 없음) 로 접혔는데,
  # **같은 키·같은 인자로 1시간 17분 뒤 다른 러너에서 61/61 전부 성공**했다.
  # 수집기는 실행 안에서 5분(60초×5)을 기다리지만 **같은 실행 안에서는 IP 가 안 바뀌므로
  # 소용이 없다.** 필요한 것은 대기가 아니라 **새 러너**다.
  #
  # 왜 대기열 푸시가 아닌가: GITHUB_TOKEN 으로 민 커밋은 **워크플로를 트리거하지 않는다**
  # (2026-08-24 실측 — push 방아쇠 런 100건 중 봇이 민 것은 0건). 세션이 손으로 미는 것과
  # 다르다. 그래서 `workflow_run` → `workflow_call` 로 새 런을 띄운다(`singo-retry.yml`).
  #
  # ⚠️ 이 문을 늘리지 않는다. 재시도는 **예약 런이 죽었을 때 딱 1회**이고,
  #    재시도 런의 event 는 `workflow_run` 이라 스스로를 다시 부를 수 없다(구조적 무한루프 차단).
  workflow_call:
    inputs:
      months:
        type: string
        required: false
        default: ""
      top:
        type: string
        required: false
        default: ""
      sort:
        type: string
        required: false
        default: ""
      retry:
        description: "재시도 런인가 — 기록·알림 문구에만 쓴다"
        type: boolean
        required: false
        default: false
      quiet:
        description: "실패해도 톡을 보내지 않는다 — 사다리 중간 칸에서 쓴다"
        type: boolean
        required: false
        default: false
      rung:
        description: "사다리 몇 번째 칸인가 — 기록·알림 문구에만 쓴다 (예: 2/4)"
        type: string
        required: false
        default: ""
      watchdog:
        description: "파수꾼이 대신 띄운 런인가 — 예약이 아예 안 떴을 때 (기록·알림 문구에만 쓴다)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# ⚠️ 재시도는 원 런이 **끝난 뒤에** 뜨므로 이 그룹에서 서로를 죽이지 않는다.
#    cancel-in-progress 를 켜지 않는 이유가 그것이다(켜면 재시도가 원 런을 자를 수 있다).
concurrency:
  group: singo-daily
  cancel-in-progress: false

jobs:
  # ── 🔒 문지기 — 오늘 이미 성공했으면 **본 잡을 아예 안 띄운다** (2026-09-03)
  #
  # 예약이 넷·재시도가 넷이라 하루에 최대 여덟 번 들어올 수 있다. 성공한 날에도 전부 돌면
  # **호출이 여덟 배**가 되고, 그건 이 배관이 고치려던 문제를 새로 만드는 것이다.
  #
  # 스텝마다 `if:` 를 다는 대신 **잡을 나눈 이유**: 스텝이 스무 개가 넘어서 하나라도 빠뜨리면
  # 「건너뛴다면서 실제로는 도는」 상태가 된다. 잡 하나가 통째로 안 뜨는 편이 셀 수 있다.
  #
  # 판정 근거는 `data/singo-last.md` — 워크플로가 매 실행 끝에 커밋하는 그 파일이다.
  # 「실행: <오늘> (KST)」와 「결과: **성공**」이 같이 있으면 오늘 몫은 끝난 것이다.
  #
  # ⚠️ **checkout 판본은 낡을 수 있다.** 앞선 예약이 방금 커밋했으면 그 커밋은 원격에만 있다.
  #    그래서 파일을 보기 전에 원격을 당긴다 — 안 당기면 「아직 안 했다」로 읽고 여덟 번을 다 돈다.
  # ⚠️ 손으로 부른 실행(`workflow_dispatch`)과 대기열 푸시는 **막지 않는다.**
  #    사람이 「지금 다시 돌려라」라고 한 것을 코드가 거절하면 손잡이가 사라진다.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.done.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: 오늘 이미 성공했나
        id: done
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "손으로 부른 실행(${{ github.event_name }}) — 문지기를 지나갑니다"
            echo "skip=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --quiet origin ${{ github.ref_name }} || true
          # ⚠️ **머리 8줄만 본다.** 이 파일은 머리(실행·결과) 아래에 **수집기 로그를 통째로** 담는다.
          #    파일 전체에서 「결과: **성공**」을 찾으면 로그 안의 글자에 걸릴 수 있고,
          #    그러면 실패한 날을 성공으로 읽어 **그날 알림을 통째로 건너뛴다.**
          #    (2026-09-03 에 이 로직을 일부러 깨뜨려 보다가 찾았다 — 통과만 봤으면 못 봤다.)
          HEAD8=$(git show origin/${{ github.ref_name }}:data/singo-last.md 2>/dev/null || cat data/singo-last.md 2>/dev/null || true)
          HEAD8=$(printf '%s' "$HEAD8" | head -8)
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          # 그리고 **줄머리를 고정**해서 본다(`^- 실행:` · `^- 결과:`). 로그 줄은 그 모양이 아니다.
          # 머리 자르기와 줄머리 고정, **둘 다** 둔다 — 하나가 뚫려도 다른 하나가 받는다.
          if printf '%s' "$HEAD8" | grep -q "^- 실행: ${TODAY} (KST)" && printf '%s' "$HEAD8" | grep -q '^- 결과: \*\*성공\*\*'; then
            echo "✅ ${TODAY} 은 이미 성공했습니다 — 호출 0회로 끝냅니다"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "오늘(${TODAY}) 성공 기록이 없습니다 — 진행합니다"
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

  singo:
    needs: gate
    if: needs.gate.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 실행 조건 정하기
        id: cfg
        run: |
          # ⚠️ `inputs` 는 workflow_dispatch 와 workflow_call 둘 다에서 채워진다.
          #    `github.event.inputs` 는 workflow_call 에서 **비어 있다** — 그래서 inputs 를 먼저 본다.
          MONTHS="${{ inputs.months || github.event.inputs.months }}"
          TOP="${{ inputs.top || github.event.inputs.top }}"
          SORT="${{ inputs.sort || github.event.inputs.sort }}"
          # ── ⛔ 예약 런은 대기열을 **읽지 않는다** (2026-08-24 오너 결정)
          #
          # 대기열은 세션이 "지금 한 번 돌려 봐"라고 미는 **일회용 손잡이**로 만든 것인데,
          # 예약 런까지 마지막 줄을 읽는 바람에 **상시 설정**이 되어 있었다.
          # 08-19 배관 점검 때 진단용으로 민 `months=1` 한 줄이 그대로 굳어,
          # **5일간 매일 아침 알림이 1개월치만 보고 있었다.**
          #
          # 결과가 실제로 갈렸다 — 계약월이 전월(7월)인 신고가 건수:
          #   08-13: 7건 · 08-14: 3건 · 08-16: 5건 → **08-19 이후 매일 0건**
          # 실거래 신고기한이 계약 후 30일이라, 8월 후반에 드러나는 7월 계약분이 통째로
          # 안 보였다. 게다가 그 거래들이 인덱스에 안 들어가므로 **더 낮은 8월 거래가
          # 신고가로 잘못 나갈 수 있었다** — 오보 0 이 걸린 문제다.
          #
          # 그래서 대기열은 **사람이 직접 민 런(push)과 손으로 누른 런(workflow_dispatch)** 에서만 읽는다.
          # 예약 런과 자동 재시도(workflow_call)는 **문서에 적힌 기본값**으로만 돈다.
          # ⚠️ 재시도가 대기열을 읽으면 예약 런과 조건이 갈린다 — 그래서 둘 다 안 읽는 쪽으로 맞췄다.
          EVT="${{ github.event_name }}"
          Q=data/singo-queue.txt
          if [ "$EVT" != "push" ] && [ "$EVT" != "workflow_dispatch" ]; then
            echo "방아쇠 '$EVT' — 대기열을 읽지 않고 기본 기준으로 돕니다 (예약·재시도의 기준은 문서가 정본)"
          elif [ -z "$MONTHS$TOP$SORT" ] && [ -f "$Q" ]; then
            LINE=$(grep -v '^[[:space:]]*#' "$Q" | grep -v '^[[:space:]]*$' | tail -1)
            echo "대기열 마지막 줄: ${LINE:-(비어 있음)}"
            for kv in $LINE; do
              case "$kv" in
                months=*) MONTHS="${kv#months=}" ;;
                top=*)    TOP="${kv#top=}" ;;
                sort=*)   SORT="${kv#sort=}" ;;
              esac
            done
          fi
          # 기본 2개월 — 신고기한 30일을 덮기 위해 **직전 달까지** 훑는다. 문서(신고가-알림-기준.md)의 정본값.
          echo "months=${MONTHS:-2}" >> "$GITHUB_OUTPUT"
          echo "top=${TOP:-0}" >> "$GITHUB_OUTPUT"
          echo "sort=${SORT:-price}" >> "$GITHUB_OUTPUT"
          echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      # ⚠️ 키가 없으면 여기서 멈춘다 — 조용한 실패는 몇 주가 지나도 안 보인다.
      - name: 키 확인
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then
            echo "::error::MOLIT_API_KEY 가 GitHub Secrets 에 없습니다."
            exit 1
          fi

      - name: 신고가 확인
        id: collect
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          set -o pipefail
          pnpm --filter @wirit/collectors collect-singo -- \
            --today ${{ steps.cfg.outputs.today }} \
            --months ${{ steps.cfg.outputs.months }} \
            --top ${{ steps.cfg.outputs.top }} \
            --sort ${{ steps.cfg.outputs.sort }} 2>&1 | tee /tmp/singo.log

      # ── 카드 재료 만들기 (2026-08-12 오너 "주간 하지말고 매일 보내줘")
      # 처음엔 주간으로 잡았다가, 돌파가 주 1~2건이라 카드가 빈다고 알리자 매일로 바꿨다.
      # 수집기가 쌓아 둔 누적 로그를 읽어 **컨셉 A(돌파 단지) · 컨셉 B(개별 카드 후보)** 로 묶는다.
      # ⚠️ 여기서 돌파를 **다시 판정하지 않는다** — 수집기가 판정 시점의 인덱스로 이미 쟀다.
      - name: 카드 재료 묶기
        if: success()
        run: |
          set -o pipefail
          node scripts/singo-digest.mjs --today ${{ steps.cfg.outputs.today }} --days 1 2>&1 | tee -a /tmp/singo.log

      # 파서 셀프테스트는 **수집 뒤에** 돌린다(2026-07-31: 테스트가 수집을 막았던 사고).
      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      - name: 실행 결과 기록
        if: always()
        run: |
          {
            echo "# 오늘의 신고가 — 마지막 실행"
            echo
            echo "- 실행: ${{ steps.cfg.outputs.today }} (KST) · 방아쇠 \`${{ github.event_name }}\`${{ inputs.retry && ' · **자동 재시도**' || '' }}${{ inputs.rung && format(' {0}칸', inputs.rung) || '' }}${{ inputs.watchdog && ' · 🐕 파수꾼' || '' }}${{ (inputs.quiet == true) && ' · 🔇 조용' || '' }}"
            echo "- 기준: 1000세대 이상 명부 · 전용 59·84 타입 · 최근 ${{ steps.cfg.outputs.months }}개월 신고분"
            echo "- 결과: **${{ job.status == 'success' && '성공' || '실패' }}**"
            echo "- 커밋: \`${{ github.sha }}\`"
            echo
            echo '```'
            cat /tmp/singo.log 2>/dev/null || echo "(실행되지 못했습니다)"
            echo '```'
          } > data/singo-last.md

      - name: 커밋
        if: always()
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@github.com"
          git add -f data/singo-last.md
          # 자동으로 늘어나는 것은 자동으로 줄어야 한다(2026-08-30 신설, 08-31 여기로 이전).
          # 원래 research-digest.yml 에 붙어 있었는데 그쪽이 예약 해제되면서
          # **매일 도는 자리**가 아니게 됐다. 줄이는 장치는 도는 것에 붙어 있어야 한다.
          # 게다가 docs/daily/ 를 매일 만드는 게 바로 이 워크플로다 — 만드는 곳이 치운다.
          node scripts/prune-auto-docs.mjs --apply || true
          git add -A research/briefs docs/daily || true
          # ⚠️ 경로를 한 줄에 몰아 쓰지 않는다. 하나라도 없으면 git add 가 통째로 실패해
          #    **아무것도 안 담긴다** (2026-08-12 첫 실행에서 singo-latest.json 이 이렇게 빠졌다).
          for P in data/datasets/singo-latest.json data/datasets/singo-log data/datasets/singo-digest.json data/datasets/molit-peak docs/daily; do
            [ -e "$P" ] && git add "$P" || true
          done
          if git diff --cached --quiet; then
            echo "바뀐 것 없음 — 커밋 생략"
          else
            git commit -m "오늘의 신고가 ${{ steps.cfg.outputs.today }}"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      # ── 조용히 죽은 배관을 하루 한 번 모아서 알린다 (2026-08-31 신설) ──
      # KOSIS 키가 만료돼 인구 수집이 27일간 실패했는데 아무도 몰랐다 — 그 워크플로에
      # 텔레그램이 없어서다. 세어 보니 43개 중 25개가 실패해도 말할 입이 없다.
      # 25곳에 각각 붙이면 시끄러워져 안 읽힌다 → 계기판을 굽고 **문제가 있을 때만** 한 통.
      # 이 워크플로가 매일 확실히 도는 유일한 자리라 여기 붙인다.
      - name: 조용히 멈춘 배관 확인
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/collect-actions-health.mjs || true
          node scripts/silent-pipes.mjs --notify || true

      - name: 텔레그램 알림 (조용한 날도 한 줄은 보낸다)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # ⚠️ 실패한 날에도 **이유를 그대로 보낸다** (2026-08-19).
          #    수집 0건인 날을 빨간불로 만들면서(molitSingoCli) 이 가지를 안 고쳤다면,
          #    오너가 받던 "⛔ 실거래 API 가 계속 응답하지 않아 …" 상세 문구가 짧은
          #    "확인 실패"로 바뀌어 **원인이 사라졌을 것**이다. 수집기는 죽기 전에
          #    singo-alert.txt 를 이미 써 두므로, 있으면 그것을 보내고 없을 때만 한 줄로 알린다.
          if [ "${{ job.status }}" != "success" ]; then
            # ── ⑴ 조용한 칸이면 **아무것도 안 보낸다** (2026-08-26 오너 "조용히 계속 재시도")
            #
            # 재시도를 사다리로 늘리면(20분·60분·120분) 실패할 때마다 톡을 보낼 경우
            # 오너 휴대폰에 ⛔ 가 **다섯 통** 쌓인다. 그날 아침 실제로 그랬다 —
            # 예약·자동재시도에 더해 세션이 손으로 세 번 돌려 톡이 다섯 통 갔다.
            # 그래서 **첫 실패(예약)와 마지막 칸만** 말하고, 중간 칸은 조용히 다시 두드린다.
            #
            # ⚠️ 조용한 것은 **실패한 재시도**뿐이다. **성공하면 무조건 보낸다** —
            #    이 분기 아래로는 내려오지 않는다. 조용함이 성공까지 삼키면 안 된다.
            # ⚠️ 그리고 조용히 넘어간 것도 `data/singo-last.md` 에는 그대로 남는다.
            #    말을 안 하는 것과 기록을 안 남기는 것은 다르다.
            if [ "${{ inputs.quiet || github.event.inputs.quiet }}" = "true" ]; then
              echo "🔇 quiet — 실패했지만 톡을 보내지 않습니다 (사다리 중간 칸). 기록은 data/singo-last.md 에 남았습니다."
              exit 0
            fi

            # ── ⑵ 재시도가 따라붙는지를 **먼저 말해 준다** (2026-08-24)
            #    안 그러면 오너가 ⛔ 를 읽고 사람을 부르는데, 10분 뒤 조용히 정상 알림이 온다.
            #    "실패했다"만 있고 "그래서 뭐가 되나"가 없으면 알림은 걱정만 남긴다.
            TAIL=""
            if [ "${{ github.event_name }}" = "schedule" ]; then
              TAIL=$'\n\n↻ 자동 재시도가 따라붙습니다 — 20분 뒤, 1시간 뒤, 2시간 뒤 세 번 다시 두드립니다.\n   중간 실패는 조용히 넘어가고, 열리면 그때 목록이 옵니다.'
            elif [ "${{ inputs.retry }}" = "true" ]; then
              TAIL=$'\n\n⛔ 재시도 세 번(20분·1시간·2시간)까지 전부 실패했습니다 — 오늘은 여기까지입니다.\n   못 받은 신고가는 사라지지 않습니다(최근 2개월 신고분을 보므로 내일 잡힙니다).'
            elif [ "${{ inputs.watchdog }}" = "true" ]; then
              # ⚠️ 파수꾼이 띄운 런은 **재시도가 안 따라붙는다.** 재시도 사다리는
              #    「오늘의 신고가 (daily)」 워크플로의 실패를 보고 뜨는데, 파수꾼 런은
              #    파수꾼 워크플로의 런이라 그 눈에 안 보인다. 사실대로 적는다.
              TAIL=$'\n\n🐕 07시 예약이 아예 안 떠서 파수꾼이 대신 돌렸습니다(GitHub Actions 쪽 문제).\n   이 런에는 자동 재시도가 안 붙습니다 — 다음 시각에 파수꾼이 다시 봅니다.'
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              # ⚠️ 손으로 돌린 런은 **꼬리말이 없었다**(2026-08-26). 오너 입장에서는
              #    ⛔ 만 뜨고 누가 왜 돌렸는지 알 수 없다 — 그날 그런 톡을 세 통 받았다.
              TAIL=$'\n\n(자동 예약이 아니라 손으로 돌린 실행입니다 — 자동 재시도는 따라붙지 않습니다.)'
            fi
            MSG=$(cat data/singo-alert.txt 2>/dev/null || true)
            if [ -n "$MSG" ]; then
              node scripts/notify-telegram.mjs "${MSG}${TAIL}"
            else
              node scripts/notify-telegram.mjs "⚠️ 신고가 확인 실패 (${{ steps.cfg.outputs.today }}) — data/singo-last.md 를 확인하세요${TAIL}"
            fi
            exit 0
          fi
          MSG=$(cat data/singo-alert.txt 2>/dev/null || true)
          if [ -n "$MSG" ]; then
            # ⚠️ md 경로 줄을 붙이지 않는다 (2026-08-13 오너 "md로 보내지말고").
            #    톡 안에서 전체 목록이 다 보여야 한다. 길면 notify-telegram 이 나눠 보낸다.
            node scripts/notify-telegram.mjs "$MSG"
          else
            HB=$(node scripts/singo-heartbeat.mjs --today "${{ steps.cfg.outputs.today }}" 2>/dev/null || true)
            if [ -n "$HB" ]; then
              node scripts/notify-telegram.mjs "$HB"
            else
              node scripts/notify-telegram.mjs "🏙 신고가 확인 완료 (${{ steps.cfg.outputs.today }}) — 0건"
            fi
          fi

name: 오늘의 신고가 (daily)

# ── 무엇을 하나 (2026-08-12 오너 "매일 아침 신고가 톡도 받게 해줘")
# 매일 아침, 최근 신고분 실거래를 받아 **단지+평형대 역대 최고가를 넘어선 거래**만 골라
# 텔레그램으로 보낸다. 청약 알림과 같은 시간대에 나란히 온다.
#
# ── 기준 (오너 결정)
#   · 역대 = 2006-01 부터 (실거래 공개 시작)
#   · 단위 = 단지 + 평형대(20·30·40평대)
#   · 지역 = 서울 25개구 + 경기 주요시
#   · 단지 = **1000세대 이상만**
# 자세한 근거는 docs/guides/신고가-알림-기준.md
#
# ── 판정하지 않는 것
# 역대 인덱스가 아직 안 채워진 지역(molit-peak-backfill 진행 중)은 **조용히 건너뛴다.**
# 반쪽 기준으로 "역대 최고가"라 부르면 그게 곧 오보다.
on:
  schedule:
    # 08:05 KST (23:05 UTC 전날) — 청약 알림(08:00)이 먼저 오고 이어서 온다
    - cron: "5 23 * * *"

  # 대기열 푸시가 방아쇠 — 세션은 Actions 버튼을 못 누른다.
  # 한 줄 형식(전부 선택):  min=1000 months=2 top=10
  push:
    paths:
      - "data/singo-queue.txt"

  workflow_dispatch:
    inputs:
      min:
        description: "최소 세대수 (기본 1000)"
        required: false
        default: "1000"
      months:
        description: "최근 몇 개월치 신고분을 볼지 (기본 2)"
        required: false
        default: "2"
      top:
        description: "알림에 이름을 적을 상위 건수 (기본 10)"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: singo-daily
  cancel-in-progress: false

jobs:
  singo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 실행 조건 정하기
        id: cfg
        run: |
          MIN="${{ github.event.inputs.min }}"
          MONTHS="${{ github.event.inputs.months }}"
          TOP="${{ github.event.inputs.top }}"
          Q=data/singo-queue.txt
          if [ -z "$MIN$MONTHS$TOP" ] && [ -f "$Q" ]; then
            LINE=$(grep -v '^[[:space:]]*#' "$Q" | grep -v '^[[:space:]]*$' | tail -1)
            echo "대기열 마지막 줄: ${LINE:-(비어 있음)}"
            for kv in $LINE; do
              case "$kv" in
                min=*)    MIN="${kv#min=}" ;;
                months=*) MONTHS="${kv#months=}" ;;
                top=*)    TOP="${kv#top=}" ;;
              esac
            done
          fi
          echo "min=${MIN:-1000}" >> "$GITHUB_OUTPUT"
          echo "months=${MONTHS:-2}" >> "$GITHUB_OUTPUT"
          echo "top=${TOP:-10}" >> "$GITHUB_OUTPUT"
          echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      # ⚠️ 키가 없으면 여기서 멈춘다 — 조용한 실패는 몇 주가 지나도 안 보인다.
      - name: 키 확인
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then
            echo "::error::MOLIT_API_KEY 가 GitHub Secrets 에 없습니다."
            exit 1
          fi

      - name: 신고가 확인
        id: collect
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          set -o pipefail
          pnpm --filter @wirit/collectors collect-singo -- \
            --today ${{ steps.cfg.outputs.today }} \
            --min-hhld ${{ steps.cfg.outputs.min }} \
            --months ${{ steps.cfg.outputs.months }} \
            --top ${{ steps.cfg.outputs.top }} 2>&1 | tee /tmp/singo.log

      # 파서 셀프테스트는 **수집 뒤에** 돌린다(2026-07-31: 테스트가 수집을 막았던 사고).
      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      - name: 실행 결과 기록
        if: always()
        run: |
          {
            echo "# 오늘의 신고가 — 마지막 실행"
            echo
            echo "- 실행: ${{ steps.cfg.outputs.today }} (KST) · 방아쇠 \`${{ github.event_name }}\`"
            echo "- 기준: ${{ steps.cfg.outputs.min }}세대 이상 · 최근 ${{ steps.cfg.outputs.months }}개월 신고분"
            echo "- 결과: **${{ job.status == 'success' && '성공' || '실패' }}**"
            echo "- 커밋: \`${{ github.sha }}\`"
            echo
            echo '```'
            cat /tmp/singo.log 2>/dev/null || echo "(실행되지 못했습니다)"
            echo '```'
          } > data/singo-last.md

      - name: 커밋
        if: always()
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@github.com"
          git add -f data/singo-last.md
          git add data/datasets/singo-latest.json data/datasets/molit-peak data/datasets/apt-list data/datasets/apt-hhld.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "바뀐 것 없음 — 커밋 생략"
          else
            git commit -m "오늘의 신고가 ${{ steps.cfg.outputs.today }}"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: 텔레그램 알림 (조용한 날도 한 줄은 보낸다)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            node scripts/notify-telegram.mjs "⚠️ 신고가 확인 실패 (${{ steps.cfg.outputs.today }}) — data/singo-last.md 를 확인하세요"
            exit 0
          fi
          MSG=$(cat data/singo-alert.txt 2>/dev/null || true)
          if [ -n "$MSG" ]; then
            node scripts/notify-telegram.mjs "$MSG"
          else
            HB=$(node scripts/singo-heartbeat.mjs --today "${{ steps.cfg.outputs.today }}" 2>/dev/null || true)
            if [ -n "$HB" ]; then
              node scripts/notify-telegram.mjs "$HB"
            else
              node scripts/notify-telegram.mjs "🏙 신고가 확인 완료 (${{ steps.cfg.outputs.today }}) — 0건"
            fi
          fi

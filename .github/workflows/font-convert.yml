name: 폰트 변환 (OTF → WOFF2, OTS 통과용)

# 세션은 폰트 도구 설치가 막혀 있어 여기(Actions)에서 fontTools로 변환한다.
# templates/_shared/fonts/<name>.otf → <name>.woff2 (세로 메트릭 제거·재컴파일) 커밋.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "폰트 파일명(확장자 제외, 예: TAEBAEK)"
        required: true
        default: "TAEBAEK"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 도구 설치 (fontTools + OTS + otf2ttf)
        run: pip install "fonttools[woff]" brotli opentype-sanitizer otf2ttf

      - name: 변환 (OTS 진단·정화 → WOFF2)
        run: |
          set -x
          NAME="${{ github.event.inputs.name }}"
          OTF="templates/_shared/fonts/${NAME}.otf"
          echo "===== 1) OTS 원본 진단 ====="
          ots-sanitize "$OTF" "/tmp/${NAME}.ots.otf" || echo "(OTS가 원본을 정화 실패 — 아래 로그 참고)"
          echo "===== 2) CFF→TTF(glyf) 변환 후 OTS ====="
          otf2ttf -o "/tmp/${NAME}.ttf" "$OTF" || echo "(otf2ttf 실패)"
          ots-sanitize "/tmp/${NAME}.ttf" "/tmp/${NAME}.ots.ttf" || echo "(OTS가 TTF도 정화 실패)"
          echo "===== 3) 통과한 산출물 선택 → WOFF2 ====="
          SRC=""
          if [ -f "/tmp/${NAME}.ots.ttf" ]; then SRC="/tmp/${NAME}.ots.ttf";
          elif [ -f "/tmp/${NAME}.ots.otf" ]; then SRC="/tmp/${NAME}.ots.otf"; fi
          if [ -z "$SRC" ]; then echo "⛔ OTS를 통과하는 산출물이 없음"; exit 1; fi
          echo "선택: $SRC"
          python3 scripts/convert_font.py "$SRC" "templates/_shared/fonts/${NAME}.woff2"

      - name: 커밋
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add templates/_shared/fonts/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "폰트 변환 ${{ github.event.inputs.name }} OTF→WOFF2 (OTS 통과)"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

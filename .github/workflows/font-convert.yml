name: 폰트 변환 (OTF → WOFF2, OTS 통과용)

# 세션은 폰트 도구 설치가 막혀 있어 여기(Actions)에서 fontTools로 변환한다.
# templates/_shared/fonts/<name>.otf → <name>.woff2 (세로 메트릭 제거·재컴파일) 커밋.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "폰트 파일명(확장자 제외, 예: TAEBAEK)"
        required: true
        default: "TAEBAEK"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fontTools 설치
        run: pip install "fonttools[woff]" brotli

      - name: 변환
        run: |
          NAME="${{ github.event.inputs.name }}"
          python3 scripts/convert_font.py \
            "templates/_shared/fonts/${NAME}.otf" \
            "templates/_shared/fonts/${NAME}.woff2"

      - name: 커밋
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add templates/_shared/fonts/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "폰트 변환 ${{ github.event.inputs.name }} OTF→WOFF2 (OTS 통과)"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

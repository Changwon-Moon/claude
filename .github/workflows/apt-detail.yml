name: 단지 주차대수 (카드 제원용)

# ── 무엇을 하나 (2026-08-16 오너 "전용면적·층수 아래 주차대수 0.0대 추가")
# 단지코드 하나를 받아 **국토교통부 공동주택 상세정보**에서 주차대수를 받아 적는다.
#
# ── 왜 대장(apt-hhld.json)에 없나
# 세대수는 **기본정보**, 주차대수는 **상세정보** — 서로 다른 오퍼레이션이다.
# 대장 8,062건을 다시 훑을 이유가 없어 짚어 준 단지만 받는다.
#
# ── 못 받으면 안 쓴다
# 지상·지하가 둘 다 0이면 파일을 만들지 않는다. 0대인 아파트는 없다 —
# 그건 응답이 빈 것이고, 0으로 적으면 카드에 "주차 0.0대"가 그대로 나간다.
on:
  push:
    paths:
      - "data/apt-detail-queue.txt"

  # ── 스스로 다시 온다 (2026-08-16b)
  # 이 서비스는 **몇 시간 단위로 문이 닫힌다.** 실측: 그날 13:30 에 30초로 성공한 뒤
  # 15:07~15:18 에는 연결 자체가 안 열렸다(UND_ERR_CONNECT_TIMEOUT). 같은 시각 같은 호스트의
  # **실거래 API 는 멀쩡히 돌았다** — 서비스별로 닫힌다.
  # 그래서 사람이 다시 밀어 주기를 기다리지 않고 **두 시간마다 대기열을 훑는다.**
  # 이미 받은 건 건너뛰므로, 다 찼으면 이 실행은 몇 초 만에 끝난다.
  # schedule:  ← 2026-08-31 해제(아래 주석 참고)
  #    - cron: "17 */2 * * *"
  # ── 2026-08-31 예약 해제 — 수동(workflow_dispatch)·푸시 방아쇠로만 돈다.
  #    30일 실측에서 예약이 몰린 시간대일수록 스케줄러가 건너뛰었다(파수꾼 7%).
  #    매일 도는 예약은 텔레그램 알림 2건과 그 재료 4개만 남긴다:
  #      applyhome-collect(10:00) · singo-daily(07:30) · molit-peak-backfill(11:00) · apt-universe(매달 1일)
  #    깨우는 법: 대기열 파일에 한 줄 쓰고 push (CLAUDE.md §6) 또는 Actions 에서 Run workflow.

  workflow_dispatch:
    inputs:
      kapt:
        description: "공동주택 대장 코드 (예: A42385801)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: apt-detail
  cancel-in-progress: false

jobs:
  detail:
    # ⚠️ 러너를 저장소 변수로 고른다 (2026-08-16c)
    # Actions 무료 분(월 2,000분·비공개 저장소)을 다 쓰면 **실행은 생기는데 스텝이 0개로 죽는다.**
    # 그때 Settings → Secrets and variables → Actions → Variables 에 `RUNNER_LABEL=self-hosted`
    # 를 넣으면 이 워크플로가 오너 PC 러너로 넘어간다 — 셀프호스티드는 분을 **안 쓴다**.
    # 변수를 안 넣으면 지금까지처럼 ubuntu-latest 다(기본 동작 그대로).
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 대기열 읽기
        id: q
        shell: bash
        env:
          IN_KAPT: ${{ github.event.inputs.kapt }}
        run: |
          Q=data/apt-detail-queue.txt
          : > "$RUNNER_TEMP/jobs.txt"
          if [ -n "$IN_KAPT" ]; then
            printf 'kapt=%s\n' "$IN_KAPT" >> "$RUNNER_TEMP/jobs.txt"
          elif [ -f "$Q" ]; then
            grep -v '^[[:space:]]*#' "$Q" | grep -v '^[[:space:]]*$' > "$RUNNER_TEMP/jobs.txt" || true
          fi
          N=$(wc -l < "$RUNNER_TEMP/jobs.txt" | tr -d ' ')
          echo "대기열 $N 줄:"; cat "$RUNNER_TEMP/jobs.txt"
          # cron 으로 도는데 대기열이 비어 있는 건 정상이다(할 일이 없을 뿐) — 실패로 치지 않는다.
          if [ "$N" = "0" ]; then
            if [ "${{ github.event_name }}" = "schedule" ]; then echo "대기열이 비어 있습니다 — 할 일 없음"; exit 0; fi
            echo "::error::대기열이 비었습니다."; exit 1
          fi
          echo "count=$N" >> "$GITHUB_OUTPUT"

      - name: 키 확인
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        shell: bash
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then
            echo "::error::MOLIT_API_KEY 가 GitHub Secrets 에 없습니다."
            exit 1
          fi

      - name: 주차대수 받기 (대기열 전 줄)
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          # ⚠️ 문 앞에서 오래 버티지 않는다. 5분씩 버티면 단지 5곳에 25분을 태우고도 빈손이다.
          #    짧게 끊고 **두 시간 뒤 cron 이 다시 온다** — 문이 열리는 때를 기다리는 건 스케줄의 일이다.
          APT_NET_TRIES: "2"
          APT_NET_WAIT_MS: "20000"
        shell: bash
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/detail.log"
          FAILED=0
          while IFS= read -r LINE; do
            [ -z "$LINE" ] && continue
            KAPT=$(printf '%s' "$LINE" | sed -n 's/.*kapt=\([A-Za-z0-9]*\).*/\1/p')
            [ -z "$KAPT" ] && { echo "⛔ kapt 를 못 읽었습니다 — $LINE" | tee -a "$RUNNER_TEMP/detail.log"; FAILED=1; continue; }
            OUT="data/datasets/apt-detail/$KAPT.json"
            case "$LINE" in *force=1*) ;; *) if [ -f "$OUT" ]; then
                  echo "⏭ 이미 있음 — $OUT (다시 받으려면 force=1)" | tee -a "$RUNNER_TEMP/detail.log"; continue; fi;; esac
            echo "" | tee -a "$RUNNER_TEMP/detail.log"
            echo "── $KAPT" | tee -a "$RUNNER_TEMP/detail.log"
            if ! pnpm --filter @wirit/collectors collect-apt-detail -- --kapt "$KAPT" 2>&1 | tee -a "$RUNNER_TEMP/detail.log"; then
              FAILED=1
            fi
          done < "$RUNNER_TEMP/jobs.txt"
          echo "" | tee -a "$RUNNER_TEMP/detail.log"
          # ── ⚠️ **초록불이 「국토부에 붙어 봤다」를 뜻하지 않는다** (2026-08-26)
          #
          # 08-26 아침 이 워크플로는 "성공"으로 끝났는데 로그 25줄이 전부 `⏭ 이미 있음` —
          # **네트워크를 한 번도 안 탔다.** 같은 시각 신고가 수집은 실거래 API 가 안 열려
          # 무너지고 있었고, 사람이 "주차대수는 성공했으니 포털은 살아 있다"고 읽을 뻔했다.
          # 아무것도 안 한 초록불과 다 받아 온 초록불은 **다른 사실**이다. 그러니 세어서 적는다.
          #
          # (건너뛰는 것 자체는 정상이다 — 이미 받은 것을 또 받을 이유가 없다.
          #  고치는 것은 **동작**이 아니라 **기록**이다.)
          TRIED=$(grep -c '^── ' "$RUNNER_TEMP/detail.log" || true)
          SKIPPED=$(grep -c '^⏭ 이미 있음' "$RUNNER_TEMP/detail.log" || true)
          echo "실제로 받아 본 단지 ${TRIED}곳 · 이미 있어 건너뛴 것 ${SKIPPED}곳" | tee -a "$RUNNER_TEMP/detail.log"
          if [ "$TRIED" = "0" ]; then
            echo "ⓘ 이번 실행은 **국토부에 한 번도 붙지 않았습니다** — 이 초록불은 API 가 살아 있다는 증거가 아닙니다." | tee -a "$RUNNER_TEMP/detail.log"
          fi
          [ "$FAILED" = "0" ] && echo "✅ 대기열 전 줄 완료" | tee -a "$RUNNER_TEMP/detail.log" || echo "⚠️ 일부 줄이 실패했습니다" | tee -a "$RUNNER_TEMP/detail.log"
          exit $FAILED

      - name: 파서 셀프테스트
        shell: bash
        run: pnpm --filter @wirit/collectors selftest

      - name: 실행 결과 기록
        if: always()
        shell: bash
        run: |
          {
            echo "# 단지 주차대수 — 마지막 실행"
            echo
            echo "- 대기열: ${{ steps.q.outputs.count }}줄"
            echo "- 결과: **${{ job.status == 'success' && '성공' || '실패' }}**"
            # ⚠️ 초록불만 적으면 「아무것도 안 한 날」과 「다 받아 온 날」이 같아 보인다(2026-08-26).
            if grep -q '한 번도 붙지 않았습니다' "$RUNNER_TEMP/detail.log" 2>/dev/null; then
              echo "- ⚠️ 이번 실행은 **국토부에 붙지 않았습니다**(전부 이미 있음) — API 가 살아 있다는 증거로 쓰지 마세요"
            fi
            echo
            echo '```'
            cat "$RUNNER_TEMP/detail.log" 2>/dev/null || echo "(실행되지 못했습니다)"
            echo '```'
          } > data/apt-detail-last.md

      - name: 커밋
        if: always()
        shell: bash
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@github.com"
          git add -f data/apt-detail-last.md
          [ -e data/datasets/apt-detail ] && git add data/datasets/apt-detail || true
          if git diff --cached --quiet; then
            echo "바뀐 것 없음 — 커밋 생략"
          else
            git commit -m "단지 주차대수 — ${{ steps.q.outputs.count }}건"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

name: 단지 주차대수 (카드 제원용)

# ── 무엇을 하나 (2026-08-16 오너 "전용면적·층수 아래 주차대수 0.0대 추가")
# 단지코드 하나를 받아 **국토교통부 공동주택 상세정보**에서 주차대수를 받아 적는다.
#
# ── 왜 대장(apt-hhld.json)에 없나
# 세대수는 **기본정보**, 주차대수는 **상세정보** — 서로 다른 오퍼레이션이다.
# 대장 8,062건을 다시 훑을 이유가 없어 짚어 준 단지만 받는다.
#
# ── 못 받으면 안 쓴다
# 지상·지하가 둘 다 0이면 파일을 만들지 않는다. 0대인 아파트는 없다 —
# 그건 응답이 빈 것이고, 0으로 적으면 카드에 "주차 0.0대"가 그대로 나간다.
on:
  push:
    paths:
      - "data/apt-detail-queue.txt"

  workflow_dispatch:
    inputs:
      kapt:
        description: "공동주택 대장 코드 (예: A42385801)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: apt-detail
  cancel-in-progress: false

jobs:
  detail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 대기열 읽기
        id: q
        shell: bash
        env:
          IN_KAPT: ${{ github.event.inputs.kapt }}
        run: |
          Q=data/apt-detail-queue.txt
          : > /tmp/jobs.txt
          if [ -n "$IN_KAPT" ]; then
            printf 'kapt=%s\n' "$IN_KAPT" >> /tmp/jobs.txt
          elif [ -f "$Q" ]; then
            grep -v '^[[:space:]]*#' "$Q" | grep -v '^[[:space:]]*$' > /tmp/jobs.txt || true
          fi
          N=$(wc -l < /tmp/jobs.txt | tr -d ' ')
          echo "대기열 $N 줄:"; cat /tmp/jobs.txt
          if [ "$N" = "0" ]; then echo "::error::대기열이 비었습니다."; exit 1; fi
          echo "count=$N" >> "$GITHUB_OUTPUT"

      - name: 키 확인
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then
            echo "::error::MOLIT_API_KEY 가 GitHub Secrets 에 없습니다."
            exit 1
          fi

      - name: 주차대수 받기 (대기열 전 줄)
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/detail.log
          FAILED=0
          while IFS= read -r LINE; do
            [ -z "$LINE" ] && continue
            KAPT=$(printf '%s' "$LINE" | sed -n 's/.*kapt=\([A-Za-z0-9]*\).*/\1/p')
            [ -z "$KAPT" ] && { echo "⛔ kapt 를 못 읽었습니다 — $LINE" | tee -a /tmp/detail.log; FAILED=1; continue; }
            OUT="data/datasets/apt-detail/$KAPT.json"
            case "$LINE" in *force=1*) ;; *) if [ -f "$OUT" ]; then
                  echo "⏭ 이미 있음 — $OUT (다시 받으려면 force=1)" | tee -a /tmp/detail.log; continue; fi;; esac
            echo "" | tee -a /tmp/detail.log
            echo "── $KAPT" | tee -a /tmp/detail.log
            if ! pnpm --filter @wirit/collectors collect-apt-detail -- --kapt "$KAPT" 2>&1 | tee -a /tmp/detail.log; then
              FAILED=1
            fi
          done < /tmp/jobs.txt
          echo "" | tee -a /tmp/detail.log
          [ "$FAILED" = "0" ] && echo "✅ 대기열 전 줄 완료" | tee -a /tmp/detail.log || echo "⚠️ 일부 줄이 실패했습니다" | tee -a /tmp/detail.log
          exit $FAILED

      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      - name: 실행 결과 기록
        if: always()
        run: |
          {
            echo "# 단지 주차대수 — 마지막 실행"
            echo
            echo "- 대기열: ${{ steps.q.outputs.count }}줄"
            echo "- 결과: **${{ job.status == 'success' && '성공' || '실패' }}**"
            echo
            echo '```'
            cat /tmp/detail.log 2>/dev/null || echo "(실행되지 못했습니다)"
            echo '```'
          } > data/apt-detail-last.md

      - name: 커밋
        if: always()
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@github.com"
          git add -f data/apt-detail-last.md
          [ -e data/datasets/apt-detail ] && git add data/datasets/apt-detail || true
          if git diff --cached --quiet; then
            echo "바뀐 것 없음 — 커밋 생략"
          else
            git commit -m "단지 주차대수 — ${{ steps.q.outputs.count }}건"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

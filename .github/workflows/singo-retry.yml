name: 오늘의 신고가 — 자동 재시도

# ── 왜 있나 (2026-08-24 오너 승인)
#
# 실거래 API(공공데이터포털)는 **GitHub 러너의 출구 IP 대역에 따라** 열리기도 닫히기도 한다.
# 08-24 아침 예약 런은 18개 지역이 전부 `fetch failed` — HTTP 응답조차 없는, **연결 자체가
# 안 열린** 상태로 접혔다. 그런데 **같은 키·같은 인자로 1시간 17분 뒤 다른 러너에서
# 61/61 전부 성공**했다. 키 문제였다면 1시간 뒤에 성공할 수 없다.
#
# 수집기는 이미 실행 안에서 60초씩 5번을 기다린다. 그게 소용없는 이유는
# **같은 실행 안에서는 출구 IP 가 안 바뀌기 때문**이다. 필요한 것은 대기가 아니라 새 러너다.
#
# 최근 예약 런 11번 중 2번 실패(08-19·08-24) — 약 18%, 5~6일에 한 번.
# 한 번 다시 두드리면 두 러너가 **모두** 막힐 확률이라 3%대로 떨어진다.
#
# ── 왜 대기열 푸시가 아닌가 (2026-08-24 실측)
# 워크플로가 GITHUB_TOKEN 으로 민 커밋은 **다른 워크플로를 트리거하지 않는다**(GitHub 의
# 무한루프 방지 규칙). push 방아쇠로 뜬 런 100건을 훑어 보니 **봇이 민 것은 0건**이었다 —
# 전부 사람/세션이 민 것이다. 세션이 손으로 큐를 미는 것과 자동화는 다른 길이다.
# 그래서 `workflow_run`(이건 Actions 안에서도 뜬다) → `workflow_call` 로 간다.
#
# ── 무한루프가 **구조적으로** 불가능한 이유
#   ① 이 워크플로는 예약 런이 실패했을 때만 뜬다 (`workflow_run.event == 'schedule'`).
#   ② 재시도는 `workflow_call` 이라 **새 워크플로 런이 아니라 이 런 안의 잡**이다 —
#      "오늘의 신고가 (daily)" 런을 새로 만들지 않으므로 자기 자신을 다시 부를 수 없다.
#   ③ 설령 ②가 바뀌어도 ①이 막는다: 재시도의 event 는 `schedule` 이 아니다.
# 문을 하나 더 늘리고 싶으면 이 세 줄을 먼저 다시 읽는다.
#
# ── 실제로 도는지 **되돌려 확인했다** (2026-08-24)
# 재시도는 실패한 날에만 도는 장치라, 진짜 실패를 기다리면 5~6일 뒤에야 켜졌는지 알게 된다.
# 그래서 **조건만 뒤집어**(`success` + `workflow_dispatch`) 배선을 시험했다:
#   · 04:40 성공 런  → 04:52 재시도가 **떴고** singo-daily 를 호출해 61/61 수집까지 갔다.
#     `data/singo-last.md` 에 「방아쇠 workflow_run · **자동 재시도**」가 찍혔다.
#   · 04:39 실패 런  → 04:51 재시도가 **skipped**. 조건이 실제로 **거른다**는 증거다.
# 뜨는 것만 봐서는 조건이 켜졌는지 알 수 없다 — **안 뜨는 쪽도** 봐야 한다.
#
# ⚠️ 시험 도중 덤으로 잡힌 것: 04:39 와 04:40 은 **1분 차이 · 같은 키 · 같은 인자**인데
#    앞은 수집 실패, 뒤는 61/61 성공이었다. 이 워크플로가 왜 필요한지의 가장 짧은 증거다.

on:
  workflow_run:
    workflows: ["오늘의 신고가 (daily)"]
    types: [completed]

permissions:
  contents: write

jobs:
  retry:
    # ⚠️ 조건 셋 다 필요하다. 하나라도 빠지면 재시도가 엉뚱한 데서 돈다.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule'
    uses: ./.github/workflows/singo-daily.yml
    with:
      # ⚠️ months·top·sort 를 **여기에 적지 않는다.** 비워 두면 호출된 워크플로가
      #    예약 런과 똑같이 `data/singo-queue.txt` 의 마지막 줄을 읽는다 —
      #    값을 여기 박으면 예약 런이 쓴 조건과 조용히 갈라진다.
      retry: true
    secrets: inherit

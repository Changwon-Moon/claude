name: 사진 자동 취득 (Pexels/Pixabay/Wikimedia)

# 무료 사진 소스에서 라이선스 안전한 사진을 취득 → templates/_shared/photos/ 저장·커밋.
# 세션(코드 대화창)은 웹 이미지 다운로드가 막혀 있어 취득은 여기(Actions)에서 돈다.
# 키: PEXELS_API_KEY / PIXABAY_API_KEY (저장소 Secrets). source=auto면 가진 키로 자동 선택.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "소스 (auto/pexels/pixabay/wikimedia)"
        required: true
        default: "auto"
      query:
        description: "검색 키워드 (pexels/pixabay용)"
        required: false
        default: "seoul subway"
      slug:
        description: "저장 slug (예: subway-pexels)"
        required: true
      title:
        description: "Commons 파일 제목 (wikimedia용, File:...)"
        required: false
        default: ""
      count:
        description: "후보 장수 (>1이면 cand/<slug>-i.jpg 여러 장 취득 → 미리보기 후 승격)"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 사진 취득
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: >
          node scripts/fetch-photo.mjs
          --source "${{ github.event.inputs.source }}"
          --query "${{ github.event.inputs.query }}"
          --slug "${{ github.event.inputs.slug }}"
          --title "${{ github.event.inputs.title }}"
          --count "${{ github.event.inputs.count }}"

      - name: 취득 사진 커밋
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add templates/_shared/photos/
          if git diff --cached --quiet; then
            echo "새 사진 없음 — 커밋 생략"
          else
            git commit -m "사진 자동 취득 $(date -u +%Y-%m-%d)"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

name: 공급면적 탐침 (K-apt 전용률 · 건축물대장 실측)

# ── 왜 있나 (2026-08-16d 오너: "카드에는 실제 공급평수를 적어야지")
# 지금 카드의 `34평`·`25평` 은 전용 84/59 → **고정 환산표**다. 단지별 전용률이 달라
# 실제 공급평수와 ±1평 어긋난다. 바꾸려면 공급면적이 **원자료에 있어야** 한다.
# 이 워크플로는 국토교통부 공동주택 정보 응답을 **가공 없이 전부** 받아 적는다.
# 판단 근거를 만드는 것이 목적이라 수집물이 아니다 — 정하고 나면 지운다.

# ── 스스로 다시 온다 (2026-08-16d)
# 첫 실행(14:08 KST)은 12번 호출이 전부 `fetch failed` 였다 — 주차대수 때와 같은
# **서비스 단위 문 닫힘**이다. 사람이 다시 누르기를 기다리지 않고 30분마다 다시 온다.
# 이미 받았으면(`data/apt-area-probe.md` 에 표가 있으면) 몇 초 만에 끝난다.
on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:
    inputs:
      kapt:
        description: "단지코드 (공백으로 여러 개)"
        required: false
        default: "A44340013 A44033010 A13686302 A10028021 A10026600 A42385801"

permissions:
  contents: write

concurrency:
  group: apt-area-probe

jobs:
  probe:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 이미 받았으면 건너뛴다
        id: done
        run: |
          if [ -f data/apt-area-probe.md ] && grep -q "^| kaptCode" data/apt-area-probe.md; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "이미 받았습니다 — 건너뜁니다"
          else echo "skip=0" >> "$GITHUB_OUTPUT"; fi

      - name: 탐침
        if: steps.done.outputs.skip == '0'
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          KAPT: ${{ github.event.inputs.kapt || 'A44340013 A44033010 A13686302 A10028021 A10026600 A42385801' }}
        run: node scripts/probe-apt-area.mjs $KAPT

      # ── 🏗️ 본선 — 건축물대장 전유공용면적(호별 실측)
      # 위의 K-apt 탐침은 "전용률을 잴 수 있나"를 본다(차선). 이쪽은 **환산 없이 공급면적을
      # 그대로 읽을 수 있나**를 본다. 이게 되면 위는 필요 없다.
      - name: 건축물대장 이미 받았나
        id: brdone
        run: |
          if [ -f data/bldrgst-probe.md ] && grep -q "^#### 후보 셈법" data/bldrgst-probe.md; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "이미 받았습니다"
          else echo "skip=0" >> "$GITHUB_OUTPUT"; fi

      - name: 건축물대장 탐침
        if: steps.brdone.outputs.skip == '0'
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          # bjdCode:지번 — data/datasets/apt-list/*.json 의 bjdCode 와 실거래 지번에서 왔다
          T: >-
            4111710700:488:84.92 4111113300:333:59.98 1129013500:80:84.95
            1165010900:143:84.48 4136011200:5869-2:84.99 4121010100:200-6:84.95
        run: node scripts/probe-bldrgst.mjs $T

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/apt-area-probe.md data/bldrgst-probe.md 2>/dev/null || true
          git diff --cached --quiet || git commit -m "공급면적 탐침 — 응답 필드 전수"
          git pull --rebase --autostash || true
          git push

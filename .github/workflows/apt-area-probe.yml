name: 공급면적 탐침 (1회성 조사)

# ── 왜 있나 (2026-08-16d 오너: "카드에는 실제 공급평수를 적어야지")
# 지금 카드의 `34평`·`25평` 은 전용 84/59 → **고정 환산표**다. 단지별 전용률이 달라
# 실제 공급평수와 ±1평 어긋난다. 바꾸려면 공급면적이 **원자료에 있어야** 한다.
# 이 워크플로는 국토교통부 공동주택 정보 응답을 **가공 없이 전부** 받아 적는다.
# 판단 근거를 만드는 것이 목적이라 수집물이 아니다 — 정하고 나면 지운다.

on:
  workflow_dispatch:
    inputs:
      kapt:
        description: "단지코드 (공백으로 여러 개)"
        required: false
        default: "A44340013 A44033010 A13686302 A10028021 A10026600 A42385801"

permissions:
  contents: write

concurrency:
  group: apt-area-probe

jobs:
  probe:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 탐침
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: node scripts/probe-apt-area.mjs ${{ github.event.inputs.kapt }}

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/apt-area-probe.md
          git diff --cached --quiet || git commit -m "공급면적 탐침 — 응답 필드 전수"
          git pull --rebase --autostash || true
          git push

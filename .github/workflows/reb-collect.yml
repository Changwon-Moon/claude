name: 전세·월세 지수 수집 (한국부동산원)

# 한국부동산원 R-ONE 에서 **전세가격지수·월세가격지수** 월별 계열을 통째로 받아 커밋한다.
# 지수를 만드는 기관이 부동산원 자신이라 1차 출처다(오보 0 — ARCHITECTURE.md §2).
# RONE_API_KEY(무료) 필요 → GitHub Secrets. 발급 안내: docs/guides/reb-key.md
#
# 매월 재발행하는 정기물의 재료다 → 부동산원 공표 다음 날(매월 16일)에 자동으로 돈다.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "collect(수집) · discover(통계표 찾기) · probe(조회 형태 실측)"
        required: true
        default: "collect"
      keyword:
        description: "discover 일 때 찾을 이름 (예: 전세)"
        required: false
        default: "전세"
      from:
        description: "시작 연도 (2003 = 통계 시작부터)"
        required: false
        default: "2003"
  schedule:
    # 부동산원 월간 주택가격동향은 매월 중순 공표 → 16일 02:00 UTC(11:00 KST)
        # ⚠️ **정각을 피한다** (2026-08-27). 8/26~27 GitHub Actions 장애 때
    #    21:00~22:10 UTC 창의 예약이 통째로 사라졌다 — 관제탑 배포(21:00)·데이터 수집(21:30)·
    #    파이프라인(22:00)·소재 보드(22:00)·신고가(22:00)가 한꺼번에 안 떴다.
    #    같은 시간대의 `17 */2`·`37 */2` 는 멀쩡히 돌았다. 정각은 전 세계가 몰리는 자리다.
    #    ↳ 파수꾼은 **안 뜬 것을 찾아낸다**. 이 줄은 **애초에 덜 몰리게 한다**. 둘 다 필요하다.
    - cron: "9 2 16 * *"
  # ⚠️ 등록용 — 수동 실행 전용 워크플로는 한 번도 안 돌면 GitHub에 등록되지 않아
  #    관제탑 버튼(dispatch)이 404를 받는다. 이 파일이 바뀌면 한 번 돌아 자신을 등록한다.
  push:
    branches:
      - claude/instagram-content-automation-roadmap-fxnb7p
    paths:
      - ".github/workflows/reb-collect.yml"
      - "packages/collectors/src/sources/rebIndex.ts"
      - "packages/collectors/src/rebCli.ts"

permissions:
  contents: write

concurrency:
  group: reb-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      # 키가 없으면 여기서 분명히 말하고 멈춘다 — 조용히 빈 파일을 만들면 그게 더 나쁘다
      - name: 키 확인
        env:
          RONE_API_KEY: ${{ secrets.RONE_API_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
        run: |
          # 이름이 두 가지로 쓰여 왔다(RONE_API_KEY 가 실제 등록된 이름). 둘 중 하나면 된다.
          if [ -z "$RONE_API_KEY" ] && [ -z "$REB_API_KEY" ]; then
            echo "::error::RONE_API_KEY 시크릿이 없습니다 — 발급 안내: docs/guides/reb-key.md"
            exit 1
          fi
          echo "키 확인됨 (RONE_API_KEY=${RONE_API_KEY:+있음}${RONE_API_KEY:-없음} · REB_API_KEY=${REB_API_KEY:+있음}${REB_API_KEY:-없음})"

      - name: 통계표 찾기 (discover)
        if: github.event.inputs.mode == 'discover'
        env:
          RONE_API_KEY: ${{ secrets.RONE_API_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
        run: |
          pnpm --filter @wirit/collectors exec tsx src/rebCli.ts \
            --discover "${{ github.event.inputs.keyword }}"

      # 표 ID는 맞는데 데이터가 0건일 때 — 여러 조회 형태를 한 번에 던져 응답을 그대로 본다.
      # 짐작을 고쳐 다시 던지길 반복하면 CI 왕복만 늘어난다(2026-07-29).
      - name: 조회 형태 실측 (probe)
        if: github.event.inputs.mode == 'probe'
        env:
          RONE_API_KEY: ${{ secrets.RONE_API_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
        run: |
          pnpm --filter @wirit/collectors exec tsx src/rebCli.ts --probe A_2024_00050

      - name: 전세·월세 지수 수집
        if: github.event.inputs.mode != 'discover' && github.event.inputs.mode != 'probe'
        env:
          RONE_API_KEY: ${{ secrets.RONE_API_KEY }}
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
        run: |
          pnpm --filter @wirit/collectors exec tsx src/rebCli.ts --collect \
            --from "${{ github.event.inputs.from || '2003' }}" \
            --out "$GITHUB_WORKSPACE/data/datasets/reb-rent-index.json"

      # 수집 직후 기사 수치와 기계 대조 → meta.verified 를 여기서 다시 세운다.
      # 왜: 확인 기록을 사람이 손으로만 올리면, 다음 수집이 그 한 줄을 지운 뒤
      #     복구할 사람이 없다(2026-07-30 실제로 그렇게 verified 가 사라졌다).
      #     대조는 코드가 하는 일이니 판정도 코드가 남긴다.
      # ⚠️ 새 달이 들어오면 verified 는 내려간다(그 달은 아직 대조 대상이 없다) — 정상이다.
      - name: 기사 수치와 교차 확인
        if: github.event.inputs.mode != 'discover' && github.event.inputs.mode != 'probe'
        run: node scripts/article-crosscheck.mjs

      - name: 데이터셋 커밋
        if: github.event.inputs.mode != 'discover' && github.event.inputs.mode != 'probe'
        run: |
          git config user.name "wirit-bot"
          git config user.email "noreply@github.com"
          git add -- data/datasets/reb-rent-index.json data/review/article-crosscheck.md
          if git diff --cached --quiet; then
            echo "변경 없음 — 이번 달 공표분이 아직 반영되지 않았을 수 있습니다"
          else
            git commit -m "전세·월세 지수 수집(부동산원)"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

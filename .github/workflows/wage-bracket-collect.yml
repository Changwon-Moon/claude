name: 억대 연봉 근로소득자 수집 (국세청·연간)

# 국세청 국세통계(KOSIS orgId 133)에서 **총급여 규모별 연말정산 신고인원**을 연도 시계열로 받고,
# 같은 해 주민등록 총인구(101/DT_1B040A3 연간·전국)를 붙여 커밋한다.
# 「연봉 1억 넘는 근로자가 몇 명인가」 카드의 재료다.
#
# ⚠️ 1억 초과는 **한 칸이 아니다** — 2억·3억·5억·10억 이하 + 10억 초과 다섯 칸의 합이다.
#    수집기가 그 합을 만들고, 소계 검산과 보도값 대조(2023·2024)를 함께 돌린다.
#    어긋나면 던지고 커밋하지 않는다.
#
# 공표 주기: 연 1회(국세통계연보). 억대 연봉자 통계는 대체로 이듬해 말에 갱신된다.
on:
  workflow_dispatch:
  schedule:
    # 매년 1·7월 17일 02:37 UTC(11:37 KST). 늦게 공표돼도 반년 안에 잡힌다.
    - cron: "37 2 17 1,7 *"
  # 대기열 한 줄 push 또는 소스 변경으로도 즉시 돈다(세션은 Run 버튼을 못 눌러 push 가 손잡이).
  push:
    branches:
      - claude/instagram-content-automation-roadmap-fxnb7p
    paths:
      - ".github/workflows/wage-bracket-collect.yml"
      - "packages/collectors/src/wageBracketCli.ts"
      - "data/wage-bracket-queue.txt"

permissions:
  contents: write

concurrency:
  group: wage-bracket-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # kosis.kr 이 러너를 거부하는 창을 분 단위로 기다려 넘는다(수집기 안의 withPatience).
    # 기본 360분에 기대지 않고 상한을 적어 둔다 — 닫힌 창이 길어도 여기서 끝난다.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 키 확인
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          if [ -z "$KOSIS_API_KEY" ]; then
            echo "::error::KOSIS_API_KEY 시크릿이 없습니다"
            exit 1
          fi
          echo "키 확인됨"

      # 대기열 마지막 줄에서 연도 범위를 읽는다. 없으면 기본(2009~작년-1).
      - name: 연도 범위 읽기
        id: range
        run: |
          LINE=$(tail -n 1 data/wage-bracket-queue.txt 2>/dev/null || true)
          FROM=$(echo "$LINE" | grep -oE 'from=[0-9]{4}' | cut -d= -f2)
          TO=$(echo "$LINE" | grep -oE 'to=[0-9]{4}' | cut -d= -f2)
          echo "from=${FROM:-2009}" >> "$GITHUB_OUTPUT"
          echo "to=${TO:-2024}" >> "$GITHUB_OUTPUT"
          echo "범위: ${FROM:-2009} ~ ${TO:-2024}"

      # ⚠️ 세션은 Actions 로그를 못 읽는다. 성공이든 실패든 **결과를 저장소 파일에 적는다**.
      - name: 총급여 규모별 인원 수집
        id: collect
        continue-on-error: true
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          set -o pipefail
          pnpm --filter @wirit/collectors exec tsx src/wageBracketCli.ts \
            --from "${{ steps.range.outputs.from }}" \
            --to "${{ steps.range.outputs.to }}" \
            --out "$GITHUB_WORKSPACE/data/datasets/wage-100m.json" 2>&1 | tee /tmp/wb.log

      - name: 결과 기록
        run: |
          {
            echo "# 억대 연봉 근로소득자 수집 — 마지막 실행"
            echo
            echo "- 실행(UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ) · run ${{ github.run_id }}"
            echo "- 범위: ${{ steps.range.outputs.from }} ~ ${{ steps.range.outputs.to }}"
            echo "- 결과: ${{ steps.collect.outcome }}"
            echo
            echo '```'
            tail -c 8000 /tmp/wb.log 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } > data/wage-bracket-last.md

      - name: 데이터셋 커밋
        run: |
          git config user.name "wirit-bot"
          git config user.email "noreply@github.com"
          # 수집이 실패하면 데이터셋 파일이 없다. `git add -- <없는 경로>` 는 128 로 죽어
          # 실패 기록조차 커밋되지 않는다 — 있는 것만 담는다.
          git add -- data/wage-bracket-last.md
          [ -f data/datasets/wage-100m.json ] && git add -- data/datasets/wage-100m.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "억대 연봉 근로소득자 수집(국세청 총급여 규모별 + 주민등록 총인구)"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: 수집이 실패했으면 여기서 빨간불
        if: steps.collect.outcome != 'success'
        run: |
          echo "::error::수집 실패 — 원인은 data/wage-bracket-last.md 에 적혀 있습니다"
          exit 1

      - name: 실패하면 말한다
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(printf '⛔ 억대 연봉 근로소득자 수집 실패\n\n원인은 data/wage-bracket-last.md 에 적혀 있습니다.\n구간 합이 소계와 어긋나거나 보도값과 2%% 넘게 벌어지면 여기서 멈춥니다.')
          node scripts/notify-telegram.mjs "$MSG"

name: 데이터 바뀌면 카드 자동 재생산

# ── 왜 이 워크플로가 있나 (2026-07-31 오너 "매번 눌러야 돼? 알아서 해줘")
# 수집기가 새 데이터를 커밋해도 **그 데이터로 만든 카드는 아무도 다시 만들지 않았다.**
# 오너가 관제탑에서 [제작 실행]을 눌러야 반영됐다.
# 데이터가 바뀌면 카드도 바뀐다 — 이건 판단이 아니라 사실이다. 사람이 누를 일이 아니다.
#
# 하는 일: 바뀐 데이터 파일 → 영향받는 발행 세트(scripts/affected-sets.mjs) → 재생산·검수
#          → 카드 JSON·검수 리포트 커밋 → 관제탑 배포 → 알림.
# 안 하는 일: **발행**. 인스타 업로드는 오너가 직접 한다(2026-07-27 결정).
#          여기까지는 "결재 대기에 올려두는" 데까지다.
#
# 무한 루프 걱정: 이 워크플로는 data/content·data/review 만 커밋하고
# data/datasets 는 건드리지 않는다 → 자기 자신을 다시 깨우지 않는다.
on:
  push:
    branches:
      - claude/instagram-content-automation-roadmap-fxnb7p
    paths:
      - "data/datasets/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # 끝나고 관제탑 배포를 이어서 건다

concurrency:
  group: auto-produce
  cancel-in-progress: false # 재생산을 중간에 끊으면 반쪽 산출물이 남는다

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2 # 직전 커밋과 비교해 무엇이 바뀌었는지 본다

      - name: 바뀐 데이터 → 영향받는 세트
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 손으로 돌릴 때는 데이터셋 전체가 바뀐 셈 치고 전 세트를 본다
            CHANGED=$(git ls-files data/datasets | tr '\n' ' ')
          else
            CHANGED=$(git diff --name-only HEAD^ HEAD -- data/datasets | tr '\n' ' ')
          fi
          echo "바뀐 파일: ${CHANGED:-(없음)}"
          if [ -z "$CHANGED" ]; then
            echo "labels=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          LABELS=$(node scripts/affected-sets.mjs $CHANGED | tr '\n' ' ')
          echo "영향받는 세트: ${LABELS:-(없음)}"
          echo "labels=$LABELS" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.pick.outputs.labels != ''
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.pick.outputs.labels != ''
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.pick.outputs.labels != ''

      - name: Chromium 설치(렌더용)
        if: steps.pick.outputs.labels != ''
        run: pnpm --filter @wirit/renderer exec playwright-core install --with-deps chromium chromium-headless-shell

      - name: 세트별 재생산 (데이터 → 카드 → 검수)
        if: steps.pick.outputs.labels != ''
        run: |
          FAIL=0
          for L in ${{ steps.pick.outputs.labels }}; do
            echo "::group::재생산 $L"
            # 한 세트가 실패해도 나머지는 계속 만든다 — 실패는 아래에서 모아 보고한다
            node scripts/produce-card.mjs "$L" || { echo "::warning::$L 재생산 실패"; FAIL=1; }
            echo "::endgroup::"
          done
          echo "PRODUCE_FAIL=$FAIL" >> "$GITHUB_ENV"

      - name: 머리 규격 전수 점검
        if: steps.pick.outputs.labels != ''
        run: pnpm --filter @wirit/renderer audit-head

      - name: 커밋
        if: steps.pick.outputs.labels != ''
        run: |
          git config user.name  "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          # ⚠️ `data/content` 를 여기 적으면 **매번 exit 1 로 죽는다** (2026-08-17 실측)
          # `.gitignore` 에 `data/content/` 가 있어서, git add 에 무시 대상 경로를 **이름으로**
          # 주면 "The following paths are ignored…" 를 내고 **종료코드 1** 이다. 그래서 이
          # 워크플로는 만들어진 이래 **커밋 단계에서 늘 실패**했고, "데이터가 바뀌면 카드도
          # 자동으로 다시 만들어진다"는 약속이 한 번도 끝까지 간 적이 없다.
          #
          # `-f` 로 강제하지 않는다. 카드 JSON 은 **데이터셋에서 결정적으로 다시 만들어지는
          # 산출물**이라 저장소에 둘 이유가 없고(그래서 무시 대상이다), 배포 워크플로도
          # 제 손으로 `rebuild-cards` 를 돌려 다시 만든다. 남길 것은 **검수 리포트**뿐이다.
          git add -- data/review
          if git diff --cached --quiet; then
            echo "변경 없음 — 같은 데이터에서 같은 픽셀이 나왔다는 뜻(결정적 렌더)"
          else
            git commit -m "자동 재생산: ${{ steps.pick.outputs.labels }} (데이터 갱신 반영)"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: 관제탑 배포 깨우기
        if: steps.pick.outputs.labels != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tower-deploy.yml --ref "${GITHUB_REF_NAME}" || echo "이미 배포가 도는 중일 수 있음"

      - name: 알림
        if: steps.pick.outputs.labels != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(printf '🔄 데이터가 갱신돼 카드를 다시 만들었습니다: %s\n관제탑 결재 대기에서 확인해주세요.' "${{ steps.pick.outputs.labels }}")
          node scripts/notify-telegram.mjs "$MSG" || echo "알림 시크릿이 없어 건너뜁니다"

      - name: 실패한 세트가 있으면 빨간불
        if: steps.pick.outputs.labels != '' && env.PRODUCE_FAIL == '1'
        run: |
          echo "::error::일부 세트 재생산이 실패했습니다 — 위 로그의 ::warning:: 을 확인하세요"
          exit 1

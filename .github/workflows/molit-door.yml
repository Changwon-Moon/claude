name: 실거래 문 열렸나 (한 번 두드려 본다)

# ── 무엇을 하나 (2026-08-26 오너 "실거래 api 확인 가능한 방법 알려주면, 내가 할게")
#
# 국토교통부 실거래 API 를 **한 번만** 두드리고 결과를 텔레그램으로 보낸다.
# Actions 탭에서 [Run workflow] 한 번이면 끝난다 — 30초 안에 답이 온다.
#
# ── 왜 「휴대폰으로 열어 보기」와 따로 필요한가
# 둘은 **다른 것을 묻는다.**
#   · 휴대폰 브라우저 → "국토부가 죽었나, 아니면 우리 러너만 막혔나"
#   · 이 버튼        → "지금 다시 돌리면 될까"  ← 배관이 실제로 쓰는 그 길이다
# 08-26 에 두 번 필요했다. 아침엔 러너에서만 막힌 줄 알았고(아니었다),
# 낮엔 같은 시각 건축물대장은 되는데 실거래만 안 됐다.
#
# ⚠️ 한 번만 두드린다. 재시도도, 기다림도 없다 — **지금 열렸나**를 묻는 자리다.
#    받아 온 것을 저장하지도 않는다(수집은 수집기의 일이다).
on:
  workflow_dispatch:
  # ── 세션도 두드릴 수 있게 (2026-09-02)
  # 이 워크플로는 오너가 누르는 버튼이었다. 그런데 세션은 GitHub API 가 막혀 버튼을 못 누른다.
  # 「광주 남구(29155)가 7개월 내내 0건」 같은 물음은 **수집이 아니라 두드림**으로 답해야 하는데
  # 세션에겐 그 손잡이가 없어서, 수집을 한 번 더 돌리고도 같은 답만 받았다(2026-09-01).
  # 대기열 한 줄:  lawd=29155 months=202601,202604,202607   (없으면 종로구·이번 달)
  push:
    paths:
      - "data/molit-door-queue.txt"

# 답을 `data/molit-door-last.md` 로 커밋하므로 쓰기 권한이 필요하다
permissions:
  contents: write

jobs:
  knock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 두드린다
        id: knock
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        shell: bash
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then
            echo "MSG=⛔ MOLIT_API_KEY 가 Secrets 에 없습니다" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # ── 키를 **수집기와 똑같이 다듬는다** (2026-09-02)
          # 이 버튼은 여태 `serviceKey=${MOLIT_API_KEY}` 로 **날것 그대로** 실었다. 수집기는
          # `encKey()`(디코드→인코드)로 정규화해 쓴다 — 두 길이 다르면 **버튼과 수집기가 서로 다른
          # 것을 묻는 셈**이라 이 워크플로가 존재하는 이유가 사라진다. 실제로 09-02 두드림이
          # 전부 403 "등록되지 않은 서비스키" 였는데 같은 키로 수집기는 전날 정상이었다.
          # 그래서 **정규화·날것 둘 다** 두드려 어느 쪽이 문제인지 한 번에 가른다.
          KEY_ENC=$(node -e 'const k=process.env.MOLIT_API_KEY;let d;try{d=decodeURIComponent(k)}catch{d=k};process.stdout.write(encodeURIComponent(d))')
          # ── 키의 **모양**을 남긴다 (2026-09-02). 값은 절대 찍지 않는다.
          # 403 "등록되지 않은 서비스키" 는 (a) 만료 (b) **다른 키가 덮어써짐** 을 구별해 주지 않는다.
          # 공공데이터포털 키는 80자 넘는 Base64 인데 NEIS 키는 32자 hex 다 — 길이만 봐도 갈린다.
          # (오너가 같은 날 NEIS 키를 갈아 끼웠으므로 덮어쓰기를 반드시 배제해야 한다.)
          KEYSHAPE=$(node -e 'const c=require("crypto");const k=(process.env.MOLIT_API_KEY||"").trim();process.stdout.write(`${k.length}자 · 지문 ${k?c.createHash("sha256").update(k).digest("hex").slice(0,8):"(빈값)"} · ${/%[0-9A-Fa-f]{2}/.test(k)?"%XX 인코딩됨":"인코딩 안 됨"}`)')
          echo "MOLIT_API_KEY 모양: $KEYSHAPE"
          # 대기열이 있으면 그 줄이 무엇을 두드릴지 정한다(세션이 미는 손잡이).
          LAWD=11110; MONTHS=$(TZ=Asia/Seoul date +%Y%m); WHO="종로구"
          if [ -f data/molit-door-queue.txt ]; then
            LINE=$(grep -v '^[[:space:]]*#' data/molit-door-queue.txt | grep -v '^[[:space:]]*$' | tail -1 || true)
            echo "대기열 마지막 줄: $LINE"
            L=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^lawd=//p'); [ -n "$L" ] && { LAWD="$L"; WHO="LAWD $L"; }
            M2=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^months=//p'); [ -n "$M2" ] && MONTHS="$M2"
          fi
          # ⚠️ 여러 달을 두드릴 수 있다. 「어느 달은 되고 어느 달은 0」인지가 곧 진단이다 —
          #    전 기간 0 이면 코드/구역 문제, 특정 달만 0 이면 그 달에 거래가 없던 것이다.
          # lawd 도 여럿 둘 수 있다. **이웃 구를 같이 두드리는 것**이 핵심 진단이다 —
          # 옆 구는 나오는데 이 구만 0 이면 코드나 구역 문제, 둘 다 0 이면 키·기간 문제다.
          : > /tmp/knock.txt; ANYROW=0; ANYHTTP=""
          for LC in $(echo "$LAWD" | tr ',' ' '); do
          for YM in $(echo "$MONTHS" | tr ',' ' '); do
            BASEQ="https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev?LAWD_CD=${LC}&DEAL_YMD=${YM}&pageNo=1&numOfRows=5"
            # 정규화한 키로 먼저 묻는다(수집기가 쓰는 그 길).
            URL="${BASEQ}&serviceKey=${KEY_ENC}"
            # ⚠️ 키가 로그에 찍히지 않게 -o 로 본문만 파일에 담는다
            CODE=$(curl -sS --max-time 20 -o /tmp/body.xml -w '%{http_code}' "$URL" 2>/tmp/err.txt || echo "000")
            # ⚠️ `|| true` 가 꼭 있어야 한다. Actions 의 bash 는 `set -eo pipefail` 로 돌아서
            #    **grep 이 못 찾으면 종료코드 1 → 스텝이 그대로 죽는다.** 여기서 "못 찾음"은
            #    오류가 아니라 **답**이다(문이 닫히면 본문이 비어 있다). 2026-08-26 첫 실행이 이렇게 죽었다.
            RESULT=$(grep -o '<resultCode>[^<]*</resultCode>' /tmp/body.xml 2>/dev/null | head -1 | sed 's/<[^>]*>//g' || true)
            MSGX=$(grep -o '<resultMsg>[^<]*</resultMsg>' /tmp/body.xml 2>/dev/null | head -1 | sed 's/<[^>]*>//g' || true)
            TOTAL=$(grep -o '<totalCount>[^<]*</totalCount>' /tmp/body.xml 2>/dev/null | head -1 | sed 's/<[^>]*>//g' || true)
            ROWS=$(grep -c '<item>' /tmp/body.xml 2>/dev/null || true); ROWS=${ROWS:-0}
            HOW="정규화"
            if [ "${ROWS:-0}" -eq 0 ]; then
              CODE2=$(curl -sS --max-time 20 -o /tmp/body2.xml -w '%{http_code}' "${BASEQ}&serviceKey=${MOLIT_API_KEY}" 2>/dev/null || echo "000")
              ROWS2=$(grep -c '<item>' /tmp/body2.xml 2>/dev/null || true); ROWS2=${ROWS2:-0}
              if [ "${ROWS2:-0}" -gt 0 ]; then
                cp /tmp/body2.xml /tmp/body.xml; CODE="$CODE2"; ROWS="$ROWS2"; HOW="날것"
                RESULT=$(grep -o '<resultCode>[^<]*</resultCode>' /tmp/body.xml 2>/dev/null | head -1 | sed 's/<[^>]*>//g' || true)
                TOTAL=$(grep -o '<totalCount>[^<]*</totalCount>' /tmp/body.xml 2>/dev/null | head -1 | sed 's/<[^>]*>//g' || true)
                MSGX=$(grep -o '<resultMsg>[^<]*</resultMsg>' /tmp/body.xml 2>/dev/null | head -1 | sed 's/<[^>]*>//g' || true)
              else
                HOW="정규화·날것 모두 0(날것 HTTP ${CODE2})"
              fi
            fi
            # 0건일 때가 진짜 궁금한 자리다 — 본문 앞머리를 남겨 「정상인데 0」인지
            # 「우리가 못 읽은 오류」인지 눈으로 가른다. 키가 섞여 나올 수 있어 지운다.
            HEAD=""
            if [ "${ROWS:-0}" -eq 0 ]; then
              HEAD=$(tr -d '\n' < /tmp/body.xml | sed -E 's/(serviceKey=)[^&"<]*/\1<hidden>/g' | head -c 200)
            fi
            printf '\n· %s %s [%s] — HTTP %s · resultCode %s %s · totalCount %s · item %s건' \
              "$LC" "$YM" "$HOW" "$CODE" "${RESULT:-?}" "${MSGX:-}" "${TOTAL:-?}" "$ROWS" >> /tmp/knock.txt
            [ -n "$HEAD" ] && printf '\n    본문: %s' "$HEAD" >> /tmp/knock.txt
            [ "${ROWS:-0}" -gt 0 ] && ANYROW=1
            ANYHTTP="$CODE"
          done
          done
          SUM=$(printf '\n🔑 MOLIT_API_KEY 모양: %s' "$KEYSHAPE"; cat /tmp/knock.txt)
          echo "lawd=$LAWD months=$MONTHS anyRow=$ANYROW"
          if [ "$ANYHTTP" = "000" ]; then
            M="🚪 실거래 API — ❌ **연결 자체가 안 열립니다**"$'\n'"   ($(head -c 120 /tmp/err.txt))"$'\n\n'"수집을 돌려도 지금은 0건입니다. 20~30분 뒤 다시 눌러 보세요."
          elif [ "$ANYROW" = "1" ]; then
            M="🚪 실거래 API — ✅ **열려 있습니다** (${WHO})${SUM}"$'\n\n'"지금 수집을 돌리면 됩니다."
          else
            M="🚪 실거래 API — ⚠️ 응답은 왔는데 **${WHO} 는 전 기간 0건**입니다${SUM}"$'\n\n'"resultCode 가 00 인데 0건이면 그 구역·기간에 신고된 거래가 없다는 뜻입니다."
          fi
          {
            echo "MSG<<EOF"
            echo "$M"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ── 답을 **파일로도 남긴다** (2026-08-28)
      # 톡만 보내면 오너는 보는데 **세션은 못 본다** — 세션은 Actions 로그를 못 읽는다.
      # 실제로 08-28 에 이 버튼을 눌러 놓고 답을 못 읽어서 다시 두드려야 했다.
      # 다른 배관이 전부 `data/*-last.md` 로 답하는 것과 같은 자리다.
      - name: 답을 파일로 남긴다
        if: always()
        shell: bash
        run: |
          {
            echo "# 실거래 문 — 마지막 두드림"
            echo
            echo "- 시각(UTC): $(date -u +%FT%TZ)"
            echo "- 실행: \`${{ github.run_id }}\`"
            echo
            echo '```'
            echo "${{ steps.knock.outputs.MSG }}"
            echo '```'
          } > data/molit-door-last.md
          git config user.name "wirit-bot"
          git config user.email "actions@github.com"
          git add -f data/molit-door-last.md
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
          else
            git commit -m "실거래 문 두드림 결과 [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: 텔레그램으로 알린다
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notify-telegram.mjs "${{ steps.knock.outputs.MSG }}"

name: 실거래 문 열렸나 (한 번 두드려 본다)

# ── 무엇을 하나 (2026-08-26 오너 "실거래 api 확인 가능한 방법 알려주면, 내가 할게")
#
# 국토교통부 실거래 API 를 **한 번만** 두드리고 결과를 텔레그램으로 보낸다.
# Actions 탭에서 [Run workflow] 한 번이면 끝난다 — 30초 안에 답이 온다.
#
# ── 왜 「휴대폰으로 열어 보기」와 따로 필요한가
# 둘은 **다른 것을 묻는다.**
#   · 휴대폰 브라우저 → "국토부가 죽었나, 아니면 우리 러너만 막혔나"
#   · 이 버튼        → "지금 다시 돌리면 될까"  ← 배관이 실제로 쓰는 그 길이다
# 08-26 에 두 번 필요했다. 아침엔 러너에서만 막힌 줄 알았고(아니었다),
# 낮엔 같은 시각 건축물대장은 되는데 실거래만 안 됐다.
#
# ⚠️ 한 번만 두드린다. 재시도도, 기다림도 없다 — **지금 열렸나**를 묻는 자리다.
#    받아 온 것을 저장하지도 않는다(수집은 수집기의 일이다).
on:
  workflow_dispatch:

jobs:
  knock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 두드린다
        id: knock
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        shell: bash
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then
            echo "MSG=⛔ MOLIT_API_KEY 가 Secrets 에 없습니다" >> "$GITHUB_OUTPUT"; exit 0
          fi
          YM=$(TZ=Asia/Seoul date +%Y%m)
          URL="https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev?serviceKey=${MOLIT_API_KEY}&LAWD_CD=11110&DEAL_YMD=${YM}&pageNo=1&numOfRows=5"
          # ⚠️ 키가 로그에 찍히지 않게 -o 로 본문만 파일에 담는다
          CODE=$(curl -sS --max-time 20 -o /tmp/body.xml -w '%{http_code}' "$URL" 2>/tmp/err.txt || echo "000")
          RESULT=$(grep -o '<resultCode>[^<]*</resultCode>' /tmp/body.xml 2>/dev/null | head -1 | sed 's/<[^>]*>//g')
          ROWS=$(grep -c '<item>' /tmp/body.xml 2>/dev/null || echo 0)
          echo "http=$CODE resultCode=$RESULT items=$ROWS"
          if [ "$CODE" = "000" ]; then
            M="🚪 실거래 API — ❌ **연결 자체가 안 열립니다**"$'\n'"   ($(head -c 120 /tmp/err.txt))"$'\n\n'"수집을 돌려도 지금은 0건입니다. 20~30분 뒤 다시 눌러 보세요."
          elif [ "$CODE" = "200" ] && [ "${ROWS:-0}" -gt 0 ]; then
            M="🚪 실거래 API — ✅ **열려 있습니다**"$'\n'"   종로구 ${YM} 표본 ${ROWS}건 정상 수신"$'\n\n'"지금 수집을 돌리면 됩니다."
          elif [ "$CODE" = "200" ]; then
            M="🚪 실거래 API — ⚠️ 응답은 왔는데 자료가 없습니다 (resultCode=${RESULT:-?})"$'\n\n'"키 승인 상태를 확인해 주세요(공공데이터포털 마이페이지)."
          else
            M="🚪 실거래 API — ⚠️ HTTP ${CODE} (resultCode=${RESULT:-?})"$'\n\n'"401·403 이면 키 문제입니다. 그 밖이면 포털 쪽 오류입니다."
          fi
          {
            echo "MSG<<EOF"
            echo "$M"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 텔레그램으로 알린다
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/notify-telegram.mjs "${{ steps.knock.outputs.MSG }}"

name: 신고가 재료 미리 걸기 (아침 판정 직후)

# ── 무엇을 하나 (2026-09-04 오너 "매일 너무 늦게 진행되는데, 오전 중에 제작 완료하도록")
#
# 아침 판정이 끝나면 **그날 카드에 필요한 재료를 바로 대기열에 건다.**
# 대기열이 커밋되면 수집기 넷(공급면적·곡선·역·주차)이 그 자리에서 움직인다.
#
# ── 왜 필요한가 — 09-04 아침이 이렇게 흘렀다
#   07:10  신고가 판정 끝
#   07:40  세션 시작                    ← 30분을 그냥 빈 채로 보냈다
#   07:43  세션이 재료 부족을 발견하고 **그제야** 대기열을 밀었다
#   08:45  공급면적 완충
#   10:55  곡선 완충
#   12:00  카드 완성
#
# 재료 수집이 **사람(세션)을 기다렸다.** 재료는 사람을 기다릴 이유가 없다 —
# 무엇이 필요한지는 판정이 끝난 순간 이미 정해져 있다.
# 이 워크플로가 그 30분을 없애고, 세션은 재료가 다 찬 뒤에 와서 **만들기만** 한다.
#
# ── ⚠️ 카드를 만들지 않는다
# `--enqueue-only` 는 대기열까지만 채우고 멈춘다. 카드 제작·확정은 그대로 세션과 오너의 일이다
# (확정은 오너가 그림을 보고 하는 판단이다 — 2026-09-03).
#
# ── ⛔⛔ 2026-09-05 — **이 워크플로는 첫날부터 아무것도 못 깨우고 있었다**
#
# 위 머리말이 *"대기열이 커밋되면 수집기 넷이 그 자리에서 움직인다"* 고 적었는데 **안 움직였다.**
# 깃허브에는 **기본 `GITHUB_TOKEN` 으로 민 push 는 새 워크플로 실행을 만들지 않는다**는 규칙이
# 있다(무한 반복 방지). 이 워크플로는 `wirit-bot` 으로 커밋·푸시하므로 그 규칙에 정확히 걸린다.
#
# 09-05 아침 실측: 06:54 에 대기열을 걸었는데 **40분 동안 수집기 넷이 하나도 안 돌았다.**
# 09-04 에 안 드러난 이유는 그 뒤에 **세션이 손으로 밀었기** 때문이다 —
# 「미리 걸어서 빨라졌다」로 보였지만 실제로 일한 것은 사람의 푸시였다.
# **초록불이 「일했다」를 뜻하지 않은 또 한 자리다**(08-19 신고가·09-03 공급면적과 같은 계열).
#
# → 고침: 커밋으로 깨우려 하지 않고 **수집기를 직접 부른다**(`workflow_call`).
#   같은 실행 안에서 도니 방아쇠 규칙에 걸릴 것이 없다. 커밋은 그대로 남긴다 —
#   대기열은 기록이기도 하고, 수집기가 그 파일을 읽기 때문이다.

on:
  workflow_run:
    # ── ⚠️ **사다리도 듣는다** (2026-09-09)
    #
    # 09-09 아침, 예약 판정(07:02 KST)이 「신고가 확인」에서 실패했다. 그런데 **사다리 1칸이
    # 곧바로 성공해** 알림도 나갔고 판정 로그도 15건으로 멀쩡히 남았다.
    # 그런데 이 워크플로는 **실패한 그 런**만 보고 `skipped` 로 끝났고,
    # 그 결과 **오늘 재료가 하나도 안 걸렸다**(공급면적 11 · 곡선 12 · 주차 11).
    # 카드는 3장밖에 못 만들 뻔했고, 사람이 07:45 에 손으로 밀어 겨우 시작했다.
    #
    # 사다리의 성공은 `workflow_call` 이라 「오늘의 신고가 (daily)」 이름으로
    # **workflow_run 을 새로 띄우지 않는다.** 그래서 사다리 워크플로 자체를 함께 듣는다.
    # ⚠️ 그것만으로는 부족하다 — 사다리는 「할 일이 없어서」 성공하기도 한다.
    #    그래서 아래 「판정이 오늘 것인지 잰다」 단계가 **로그를 직접 보고** 정한다.
    workflows: ["오늘의 신고가 (daily)", "오늘의 신고가 — 자동 재시도"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: singo-prep
  cancel-in-progress: false

jobs:
  prep:
    # ⚠️ 여기서 앞 런의 conclusion 을 보지 않는다 — 09-09 에 그것 때문에 하루가 통째로 막혔다.
    #    「판정이 실제로 오늘 것을 남겼는가」는 아래에서 **로그를 보고** 잰다.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      go: ${{ steps.judged.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      # ── 🔍 **판정이 오늘 것을 남겼는지 잰다** (2026-09-09)
      #
      # 예전엔 「앞 워크플로가 success 였나」로 정했다. 그건 **누가 이겼는지**를 묻는 것이고,
      # 우리가 알아야 할 것은 **판정 결과가 오늘 것인가**다. 둘은 09-09 에 갈라졌다:
      # 예약 판정은 실패했는데 사다리가 성공해 로그는 멀쩡했고, 이 문지기만 그걸 몰랐다.
      #
      # `data/singo-last.md` 머리 6줄이 「실행 날짜(KST)」와 「결과」를 적어 둔다. 그것을 본다.
      # ⚠️ 사람이 손으로 부른 경우(workflow_dispatch)는 그냥 통과시킨다 — 사람이 이미 판단했다.
      - name: 판정이 오늘 것인지 잰다
        id: judged
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "사람이 손으로 불렀습니다 — 그대로 진행합니다"; echo "go=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(TZ=Asia/Seoul date +%F)
          HEAD6=$(head -6 data/singo-last.md 2>/dev/null || true)
          if printf '%s' "$HEAD6" | grep -q "실행: ${TODAY}" && printf '%s' "$HEAD6" | grep -q "결과: \*\*성공\*\*"; then
            echo "✅ 오늘(${TODAY}) 판정이 성공으로 남아 있습니다 — 재료를 겁니다"
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "⏭ 오늘(${TODAY}) 판정 기록이 없거나 실패입니다 — 재료를 걸지 않습니다"
            printf '%s\n' "$HEAD6"
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 재료 걸기
        if: steps.judged.outputs.go == '1'
        shell: bash
        run: |
          # ⚠️ 종료코드 2 는 「재료가 덜 왔다」는 **정상 신호**다 — 여기서는 실패가 아니다.
          #    3 은 「이미 확정된 날」이라 역시 정상이다.
          set +e
          node scripts/singo-daily-build.mjs --enqueue-only | tee /tmp/prep.log
          C=${PIPESTATUS[0]}
          set -e
          echo "종료코드 $C"
          [ "$C" = "0" ] || [ "$C" = "2" ] || [ "$C" = "3" ] || exit "$C"

      - name: 대기열 커밋 (수집기의 방아쇠다)
        if: steps.judged.outputs.go == '1'
        shell: bash
        run: |
          git config user.name  "wirit-bot"
          git config user.email "actions@github.com"
          git add data/apt-supply-queue.txt data/singo-history-queue.txt \
                  data/apt-station-queue.txt data/apt-detail-queue.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ⓘ 새로 걸 재료가 없습니다 — 오늘 신고가에 필요한 것이 이미 다 있습니다"
            exit 0
          fi
          git commit -m "신고가 재료 미리 걸기 $(TZ=Asia/Seoul date +%F) (아침 판정 직후)"
          git push origin HEAD:${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: 무엇을 걸었나
        if: always() && steps.judged.outputs.go == '1'
        shell: bash
        run: |
          { echo "### 신고가 재료 미리 걸기"; echo; sed -n '1,40p' /tmp/prep.log; } >> "$GITHUB_STEP_SUMMARY"

  # ── 수집기 넷을 **직접 부른다** (2026-09-05)
  #
  # ⚠️ `needs: prep` — 대기열 커밋이 **먼저** 저장소에 닿아야 한다. 수집기는 그 파일을 읽는다.
  # ⚠️ `if: always()` 를 쓰지 않는다 — 대기열을 못 걸었으면 부를 이유가 없다.
  # ⚠️ 넷을 **나란히** 부른다. 서로 다른 API 라 줄 세울 이유가 없고,
  #    하나가 죽어도 나머지는 받아 온다(공급면적은 자기 재시도 사다리가 따로 받는다).
  supply:
    # 판정이 오늘 것이 아니면 수집기도 부르지 않는다 — 어제 대기열을 다시 훑을 이유가 없다
    if: needs.prep.outputs.go == '1'
    name: 공급면적
    needs: prep
    uses: ./.github/workflows/apt-supply-area.yml
    secrets: inherit
  history:
    # 판정이 오늘 것이 아니면 수집기도 부르지 않는다 — 어제 대기열을 다시 훑을 이유가 없다
    if: needs.prep.outputs.go == '1'
    name: 곡선
    needs: prep
    uses: ./.github/workflows/singo-history.yml
    secrets: inherit
  station:
    # 판정이 오늘 것이 아니면 수집기도 부르지 않는다 — 어제 대기열을 다시 훑을 이유가 없다
    if: needs.prep.outputs.go == '1'
    name: 가까운 역
    needs: prep
    uses: ./.github/workflows/apt-station.yml
    secrets: inherit
  detail:
    # 판정이 오늘 것이 아니면 수집기도 부르지 않는다 — 어제 대기열을 다시 훑을 이유가 없다
    if: needs.prep.outputs.go == '1'
    name: 주차
    needs: prep
    uses: ./.github/workflows/apt-detail.yml
    secrets: inherit

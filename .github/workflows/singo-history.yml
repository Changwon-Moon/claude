name: 신고가 단지 이력 (한 단지 곡선)

# ── 무엇을 하나 (2026-08-13 오너 "가격 곡선을 위해 재수집한다")
# 카드 한 장에 쓸 **한 단지·한 타입의 월별 최고가 곡선**을 받아 온다.
# 매일 도는 인덱스(molit-peak)는 최고가 한 줄만 남겨서 곡선을 못 그린다 — 그래서 따로 훑는다.
# 한 구 × 79개월 ≈ 80회 호출, 3~5분.
#
# ── 방아쇠
# 세션은 Actions 버튼을 못 누른다. `data/singo-history-queue.txt` 에 줄을 쓰고 푸시하면 돈다.
#   lawd=41135 umd=정자동 type=84 apt="상록마을(라이프2차)"
#
# ── ⚠️ 대기열의 **모든 줄**을 처리한다 (2026-08-16 변경)
# 예전엔 마지막 줄만 읽었다. 카드를 여러 장 만들 때 5장이면 5번을 **순차로** 밀어야 했고
# (동시성 그룹 때문에 겹치지도 않는다), 그게 하루 작업을 반나절로 만들었다.
# 이미 받아 둔 곡선은 건너뛴다 — 다시 받으려면 그 줄에 `force=1` 을 붙인다.
# (apt 는 공백을 담을 수 있으므로 **줄의 마지막**에 쓰고 apt="..." 로 감싼다.)
on:
  push:
    paths:
      - "data/singo-history-queue.txt"

  workflow_dispatch:
    inputs:
      lawd:
        description: "지역코드 5자리 (예: 41135 성남시분당구)"
        required: true
      apt:
        description: "단지명 — 실거래 신고 표기 그대로 (예: 상록마을(라이프2차))"
        required: true
      umd:
        description: "법정동 (예: 정자동). 비우면 구 전체에서 이름으로만 찾는다"
        required: false
        default: ""
      type:
        description: "전용 타입 — 59 또는 84"
        required: true
        default: "84"
      from:
        description: "시작월 YYYYMM (기본 202001)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: singo-history
  cancel-in-progress: false

jobs:
  history:
    # ⚠️ 러너를 저장소 변수로 고른다 (2026-08-16c)
    # Actions 무료 분(월 2,000분·비공개 저장소)을 다 쓰면 **실행은 생기는데 스텝이 0개로 죽는다.**
    # 그때 Settings → Secrets and variables → Actions → Variables 에 `RUNNER_LABEL=self-hosted`
    # 를 넣으면 이 워크플로가 오너 PC 러너로 넘어간다 — 셀프호스티드는 분을 **안 쓴다**.
    # 변수를 안 넣으면 지금까지처럼 ubuntu-latest 다(기본 동작 그대로).
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # ⚠️ 60분으로는 모자란다 (2026-08-26 · 08-28 두 번 잘렸다).
    #    대기열은 **줄어들지 않는다** — 날마다 새 단지가 쌓이고, 이미 받은 줄은 빠르게
    #    건너뛰지만 **새 줄 하나가 80개월치 요청**이다. 9~15단지면 720~1,200회다.
    #    거기에 실거래 API 가 느린 날이면 한 요청이 몇 초씩 걸린다.
    #    잘리면 그날 수집은 **통째로 0건**이 되므로(커밋 전에 죽는다) 넉넉히 준다.
    #    공개 저장소라 러너 시간은 무료다 — 아낄 이유가 없다.
    #    ⓘ 문이 닫힌 날은 수집기가 5분 만에 스스로 접는다(molitHistoryCli). 이 값이
    #      길다고 죽은 API 앞에서 세 시간을 태우지는 않는다.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 대기열 읽기
        id: q
        shell: bash
        env:
          IN_LAWD: ${{ github.event.inputs.lawd }}
          IN_APT: ${{ github.event.inputs.apt }}
          IN_UMD: ${{ github.event.inputs.umd }}
          IN_TYPE: ${{ github.event.inputs.type }}
          IN_FROM: ${{ github.event.inputs.from }}
        run: |
          Q=data/singo-history-queue.txt
          : > "$RUNNER_TEMP/jobs.txt"
          if [ -n "$IN_LAWD$IN_APT" ]; then
            # 버튼으로 부른 경우 — 한 줄짜리 대기열을 만들어 아래 루프가 똑같이 돌게 한다
            printf 'lawd=%s umd=%s type=%s from=%s apt="%s"\n' \
              "$IN_LAWD" "$IN_UMD" "${IN_TYPE:-84}" "$IN_FROM" "$IN_APT" >> "$RUNNER_TEMP/jobs.txt"
          elif [ -f "$Q" ]; then
            grep -v '^[[:space:]]*#' "$Q" | grep -v '^[[:space:]]*$' > "$RUNNER_TEMP/jobs.txt" || true
          fi
          N=$(wc -l < "$RUNNER_TEMP/jobs.txt" | tr -d ' ')
          echo "대기열 $N 줄:"
          cat "$RUNNER_TEMP/jobs.txt"
          if [ "$N" = "0" ]; then
            echo "::error::대기열이 비었습니다."
            exit 1
          fi
          echo "count=$N" >> "$GITHUB_OUTPUT"

      - name: 키 확인
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        shell: bash
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then
            echo "::error::MOLIT_API_KEY 가 GitHub Secrets 에 없습니다."
            exit 1
          fi

      - name: 이력 수집 (대기열 전 줄)
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/hist.log"
          FAILED=0
          while IFS= read -r LINE; do
            [ -z "$LINE" ] && continue
            LAWD=$(printf '%s' "$LINE" | sed -n 's/.*lawd=\([0-9]\{5\}\).*/\1/p')
            TYPE=$(printf '%s' "$LINE" | sed -n 's/.*type=\([0-9]\{2\}\).*/\1/p')
            FROM=$(printf '%s' "$LINE" | sed -n 's/.*from=\([0-9]\{6\}\).*/\1/p')
            UMD=$(printf '%s' "$LINE" | sed -n 's/.*umd=\([^ ]*\).*/\1/p')
            APT=$(printf '%s' "$LINE" | sed -n 's/.*apt="\([^"]*\)".*/\1/p')
            [ -z "$APT" ] && APT=$(printf '%s' "$LINE" | sed -n 's/.*apt=\([^ ]*\).*/\1/p')
            if [ -z "$LAWD" ] || [ -z "$APT" ] || [ -z "$TYPE" ]; then
              echo "⛔ 줄을 못 읽었습니다 — $LINE" | tee -a "$RUNNER_TEMP/hist.log"
              FAILED=1; continue
            fi
            FORCE=""
            case "$LINE" in *force=1*) FORCE="--force";; esac
            echo "" | tee -a "$RUNNER_TEMP/hist.log"
            echo "── $APT 전용 ${TYPE}타입 ($LAWD)" | tee -a "$RUNNER_TEMP/hist.log"
            # ⚠️ 한 줄이 실패해도 나머지는 계속 간다 — 5장 중 1장 때문에 4장을 잃지 않는다
            if ! pnpm --filter @wirit/collectors collect-singo-history -- \
                  --lawd "$LAWD" --apt "$APT" ${UMD:+--umd "$UMD"} \
                  --type "$TYPE" --from "${FROM:-202001}" $FORCE 2>&1 | tee -a "$RUNNER_TEMP/hist.log"; then
              FAILED=1
            fi
          done < "$RUNNER_TEMP/jobs.txt"
          echo "" | tee -a "$RUNNER_TEMP/hist.log"
          [ "$FAILED" = "0" ] && echo "✅ 대기열 전 줄 완료" | tee -a "$RUNNER_TEMP/hist.log" || echo "⚠️ 일부 줄이 실패했습니다 — 위 로그 확인" | tee -a "$RUNNER_TEMP/hist.log"
          exit $FAILED

      - name: 파서 셀프테스트
        shell: bash
        run: pnpm --filter @wirit/collectors selftest

      - name: 실행 결과 기록
        if: always()
        shell: bash
        run: |
          {
            echo "# 신고가 단지 이력 — 마지막 실행"
            echo
            echo "- 대기열: ${{ steps.q.outputs.count }}줄"
            echo "- 결과: **${{ job.status == 'success' && '성공' || '실패' }}**"
            echo
            echo '```'
            cat "$RUNNER_TEMP/hist.log" 2>/dev/null || echo "(실행되지 못했습니다)"
            echo '```'
          } > data/singo-history-last.md

      - name: 커밋
        if: always()
        shell: bash
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@github.com"
          git add -f data/singo-history-last.md
          # ⚠️ 경로를 한 줄에 몰아 쓰지 않는다 — 하나라도 없으면 통째로 실패해 아무것도 안 담긴다.
          for P in data/datasets/singo-history; do
            [ -e "$P" ] && git add "$P" || true
          done
          if git diff --cached --quiet; then
            echo "바뀐 것 없음 — 커밋 생략"
          else
            git commit -m "신고가 단지 이력 — ${{ steps.q.outputs.count }}건"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: 텔레그램 알림
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            node scripts/notify-telegram.mjs "📈 단지 이력 수집 완료 — ${{ steps.q.outputs.count }}건"
          else
            node scripts/notify-telegram.mjs "⚠️ 단지 이력 수집 실패 — data/singo-history-last.md 확인"
          fi

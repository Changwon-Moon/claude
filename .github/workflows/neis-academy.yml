name: 학원 수집 (나이스)

# 나이스(NEIS) 학원교습소정보를 시도교육청 단위로 받아 **법정동 집계**로 커밋한다.
# 1차 출처(오보 0). NEIS_API_KEY(무료·즉시 발급) 필요 → GitHub Secrets.
# 산출: data/datasets/neis-academy/{교육청코드}.json — 카드 빌더가 이 캐시를 읽는다.
on:
  # 세션은 GitHub API 가 프록시에서 막혀 있어 Run workflow 버튼을 누를 수 없다.
  # 대기열 파일 한 줄을 미는 것이 세션이 수집을 시작하는 **유일한 손잡이**다(CLAUDE.md §6).
  # 한 줄 형식:  sido=B10,J10,E10 force=false
  push:
    paths:
      - "data/neis-queue.txt"
  workflow_dispatch:
    inputs:
      sido:
        description: "시도교육청 코드(콤마). 비우면 학군지 카드가 쓰는 11곳 전부"
        required: false
        default: ""
      force:
        description: "캐시 무시 재수집 (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 학원 수집 → 법정동 집계
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: |
          if [ -z "$NEIS_API_KEY" ]; then echo "NEIS_API_KEY 시크릿이 없습니다"; exit 1; fi
          SIDO="${{ github.event.inputs.sido }}"
          FORCE_IN="${{ github.event.inputs.force }}"
          if [ -f data/neis-queue.txt ]; then
            LINE=$(grep -v '^[[:space:]]*#' data/neis-queue.txt | grep -v '^[[:space:]]*$' | tail -1)
            echo "대기열 마지막 줄: $LINE"
            [ -z "$SIDO" ]     && SIDO=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^sido=//p')
            [ -z "$FORCE_IN" ] && FORCE_IN=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^force=//p')
          fi
          FORCE=""; [ "$FORCE_IN" = "true" ] && FORCE="--force"
          ARGS=""; [ -n "$SIDO" ] && ARGS="--sido $SIDO"
          echo "수집: 시도=${SIDO:-전체} $FORCE"
          echo "SIDO=${SIDO:-전체}" >> "$GITHUB_ENV"
          # ⚠️ 실행 로그를 파일로 남긴다 — 세션은 Actions 로그를 못 읽는다. 실패 이유가
          #    저장소에 안 남으면 진단을 못 한다(2026-09-01 인천 수집에서 실제로 겪었다).
          #    인증키가 섞여 나올 수 있으므로 KEY= 는 지우고 남긴다.
          set -o pipefail
          pnpm --filter @wirit/collectors exec tsx src/neisAcademyCli.ts \
            $ARGS --out "$GITHUB_WORKSPACE/data/datasets/neis-academy" $FORCE 2>&1 \
            | sed -E 's/(KEY=)[^&[:space:]"]+/\1<hidden>/g' \
            | tee /tmp/neis-run.log

      - name: 캐시 커밋
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/datasets/neis-academy/*.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "학원(나이스) 수집 — $SIDO"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: 실행 결과 기록
        if: always()
        run: |
          {
            echo "# 학원 수집(나이스) — 마지막 실행"
            echo
            echo "- 실행: $(TZ=Asia/Seoul date +%F) (KST) · 방아쇠 \`${{ github.event_name }}\`"
            echo "- 기준: 시도 $SIDO"
            echo "- 결과: **${{ job.status == 'success' && '성공' || '실패' }}**"
            echo "- 커밋: \`${{ github.sha }}\`"
            if [ -s /tmp/neis-run.log ]; then
              echo
              echo "## 실행 로그 (끝 40줄)"
              echo '```'
              tail -40 /tmp/neis-run.log
              echo '```'
            fi
          } > data/neis-last.md
          git config user.name "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/neis-last.md
          git diff --cached --quiet || {
            git commit -m "학원 수집(나이스) 기록 — $(TZ=Asia/Seoul date +%F)"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          }

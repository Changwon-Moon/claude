name: 경계 데이터 취득 (GeoJSON)

# 공개 행정경계 GeoJSON(서울 25개 자치구)을 받아 data/geo/에 커밋한다.
# 코로플레스(색칠 지도) 카드 제작용 재사용 자산. 세션은 다운로드 차단 → Actions 전용.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "GeoJSON URL"
        required: true
        default: "https://raw.githubusercontent.com/southkorea/seoul-maps/master/kostat/2013/json/seoul_municipalities_geo_simple.json"
      out:
        description: "저장 경로"
        required: true
        default: "data/geo/seoul-districts.geojson"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 다운로드 + 검증(JSON 파싱)
        run: |
          mkdir -p "$(dirname "${{ github.event.inputs.out }}")"
          curl -sSL "${{ github.event.inputs.url }}" -o "${{ github.event.inputs.out }}"
          node -e "const d=require('./${{ github.event.inputs.out }}'); const n=(d.features||[]).length; if(!n){console.error('features 없음');process.exit(1);} console.log('features', n, '· 예:', d.features[0].properties);"
      - name: 커밋
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ github.event.inputs.out }}"
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "경계 GeoJSON 취득: ${{ github.event.inputs.out }}"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

name: 인구 수집 (monthly)

# ── 무엇을 하나 (2026-08-03 오너 "지역별 인구 통계 소재를 자동으로 뽑아줘")
# 매달 KOSIS 국가통계포털에서 시군구 주민등록 인구 시계열을 받아
#   ① 인구 문턱 돌파·붕괴(10만·50만·100만…)  ② N개월 연속 증감  ③ 1년 증감률 전국 상·하위
# 를 코드가 계산해 점수를 매기고, 문턱을 넘은 것만 소재 보드에 올린 뒤 텔레그램으로 알린다.
#
# ── 왜 KOSIS 인가 (행안부 주민등록 오픈API 가 아니라)
# 2026-08-03 에 두 가지를 실측하고 골랐다.
#   ① **코드 체계**: 우리 지도는 통계청 행정구역코드다(동작구 11200). 행안부 주민등록은
#      법정동코드라 동작구가 11590 이다. 그대로 조인하면 엉뚱한 구에 색이 칠해진다.
#   ② **규격 검증**: data.go.kr 상세 화면이 세션에서 안 열려 행안부 API 의 필드를 한 글자도
#      확인하지 못했다. KOSIS 는 엔드포인트·파라미터·응답 필드가 공개 문서로 확인된다.
#
# ── 왜 여기(Actions)에서 도나
# 작업 세션은 외부망이 막혀 있고, 창을 닫으면 사라진다 — "매달"은 달력이 지킬 일이다.
#
# ── 안 하는 일
# 카드 제작·발행. 오너가 개입하는 지점은 셋뿐이다(CEO 07-26): ①소재 선택 ②기획 방향 ③발행 승인.
on:
  # ── ⏸ 자동 예약을 **껐다** (2026-08-27 오너 "인구수집은 자동 안할래. 없애줘")
  #
  # 이 수집기는 2026-08-08 부터 매달 실패해 왔다
  # (「인구 시계열이 비었다 — 표 ID·기간·인증키를 확인해야 한다」).
  # 고치지 않은 채 예약만 살려 두면 **매달 실패 톡이 한 통씩** 오고,
  # 그 톡을 안 읽게 되면 **진짜 고장난 배관의 톡도 같이 안 읽힌다.**
  # 맞는 것을 매번 지적하지 않는 것과 같은 이유로, 안 고칠 것은 안 도는 편이 낫다.
  #
  # **워크플로를 지우지는 않았다.** 수집기 코드·소재 규칙·문서가 다 붙어 있고,
  # 나중에 표 ID 를 고치면 그대로 살아난다. 지우면 그걸 다시 만들어야 한다.
  # 손잡이는 아래 둘이 그대로 살아 있다 — 필요할 때 한 번씩 돌리면 된다:
  #   · `data/population-queue.txt` 에 한 줄 밀기 (세션이 쓰는 길)
  #   · Actions 화면의 [Run workflow] (오너가 쓰는 길)
  #
  # 다시 켜려면 아래 두 줄의 주석을 푼다(매달 3일 09:08 KST).
  # ⚠️ 켜기 전에 **먼저 고친다.** 실패하는 배관을 예약에 올려 두는 것이 지금 끈 이유다.
  #
  # schedule:
  #   # 매달 3일 09:08 KST (00:08 UTC) — 주민등록 인구는 전월분이 매월 1일 이후 공표된다.
  #   # KOSIS 반영에 하루이틀 여유를 두고 3일에 본다. 정각(00:00)은 붐벼서 피한다.
  #   - cron: "8 0 3 * *"

  # ── 대기열 푸시가 방아쇠 ──
  # 세션은 api.github.com 이 프록시에서 막혀(403) [Run workflow] 버튼을 못 누른다.
  # 하지만 **푸시는 된다.** 파일 한 줄이 세션이 수집을 시작하는 유일한 손잡이다.
  # 한 줄 형식(전부 선택):  months=25 min=45 top=8 digest=1
  push:
    paths:
      - "data/population-queue.txt"

  workflow_dispatch:
    inputs:
      months:
        description: "몇 개월치를 받을지(기본 25 — 1년 증감률을 보려면 최소 13)"
        required: false
        default: "25"
      min:
        description: "소재로 올릴 최소 점수(기본 45)"
        required: false
        default: "45"
      top:
        description: "알림에 넣을 상위 건수(기본 8)"
        required: false
        default: "8"
      register:
        description: "1 이면 신호를 소재 보드에 자동 등록한다(기본: 안 한다 — 오너가 직접 고른다)"
        required: false
        default: ""
      digest:
        description: "1 이면 새것만이 아니라 지금 살아 있는 소재 전체를 알림으로 보낸다"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: population-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 실행 조건 정하기
        id: cfg
        run: |
          MONTHS="${{ github.event.inputs.months }}"
          MIN="${{ github.event.inputs.min }}"
          TOP="${{ github.event.inputs.top }}"
          DIGEST="${{ github.event.inputs.digest }}"
          REGISTER="${{ github.event.inputs.register }}"
          # 대기열 푸시로 들어온 실행은 입력칸이 비어 있다 → 파일 마지막 줄에서 읽는다
          # (주석 #·빈 줄 무시. 없는 값은 기본값으로 떨어진다)
          Q=data/population-queue.txt
          if [ -z "$MONTHS$MIN$TOP$DIGEST$REGISTER" ] && [ -f "$Q" ]; then
            LINE=$(grep -v '^\s*#' "$Q" | grep -v '^\s*$' | tail -1)
            echo "대기열 마지막 줄: ${LINE:-(비어 있음)}"
            for kv in $LINE; do
              case "$kv" in
                months=*) MONTHS="${kv#months=}" ;;
                min=*)    MIN="${kv#min=}" ;;
                top=*)    TOP="${kv#top=}" ;;
                digest=*) DIGEST="${kv#digest=}" ;;
                register=*) REGISTER="${kv#register=}" ;;
              esac
            done
          fi
          [ "$DIGEST" = "1" ] && echo "digest=--digest" >> "$GITHUB_OUTPUT" || echo "digest=" >> "$GITHUB_OUTPUT"
          # ⚠️ 기본은 **보드에 안 올린다** — 오너 결정(2026-08-03): "데이터만 자동, 소재는 내가 고른다"
          [ "$REGISTER" = "1" ] && echo "register=--register" >> "$GITHUB_OUTPUT" || echo "register=" >> "$GITHUB_OUTPUT"
          echo "months=${MONTHS:-25}" >> "$GITHUB_OUTPUT"
          echo "min=${MIN:-45}" >> "$GITHUB_OUTPUT"
          echo "top=${TOP:-8}" >> "$GITHUB_OUTPUT"
          echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      # ⚠️ 키가 없으면 **여기서 멈춘다.** 조용히 건너뛰면 몇 달이 지나도 아무도 모른다
      #    (2026-07-31 알림 키 사고). 정기 수집기의 침묵은 정상과 구분되지 않는다.
      - name: 키 확인
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          if [ -z "$KOSIS_API_KEY" ]; then
            echo "::error::KOSIS_API_KEY 가 GitHub Secrets 에 없습니다."
            echo "kosis.kr → 오픈API → 활용신청(즉시 발급) → 발급된 인증키를"
            echo "Settings → Secrets and variables → Actions 에 KOSIS_API_KEY 로 등록하세요."
            exit 1
          fi

      - name: 인구 수집
        id: collect
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: |
          set -o pipefail
          pnpm --filter @wirit/collectors collect-population -- \
            --today ${{ steps.cfg.outputs.today }} \
            --months ${{ steps.cfg.outputs.months }} \
            --min ${{ steps.cfg.outputs.min }} 2>&1 | tee /tmp/collect.log

      - name: 신호 정리 + 알림 문구
        id: register
        run: |
          set -o pipefail
          node scripts/register-population-ideas.mjs \
            --min ${{ steps.cfg.outputs.min }} \
            --top ${{ steps.cfg.outputs.top }} \
            ${{ steps.cfg.outputs.digest }} ${{ steps.cfg.outputs.register }} 2>&1 | tee /tmp/register.log

      # 파서 셀프테스트는 **수집 뒤에** 돌린다.
      # 2026-07-31 에 증시 수집이 셀프테스트 실패로 며칠간 죽어 있었다 — 검사는 하되,
      # 검사가 데이터 수집을 막지는 않게 한다.
      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      # ── 세션의 유일한 눈 ──
      # 작업 세션은 GitHub API 가 막혀 Actions 로그를 못 본다. 성공이든 실패든 파일에 적어 커밋한다.
      - name: 실행 결과 기록
        if: always()
        run: |
          {
            echo "# 인구 수집 마지막 실행"
            echo
            echo "- 실행: ${{ steps.cfg.outputs.today }} (KST) · 방아쇠 \`${{ github.event_name }}\`"
            echo "- 조건: 최근 ${{ steps.cfg.outputs.months }}개월 · 신호 문턱 ${{ steps.cfg.outputs.min }}점 · 상위 ${{ steps.cfg.outputs.top }}건"
            echo "- 보드 자동 등록: ${{ steps.cfg.outputs.register && '켬' || '끔(오너가 직접 고릅니다)' }}"
            echo "- 결과: **${{ job.status == 'success' && '성공' || '실패' }}**"
            echo "- 커밋: \`${{ github.sha }}\`"
            echo
            echo '## 수집 로그'
            echo '```'
            cat /tmp/collect.log 2>/dev/null || echo "(수집 단계가 실행되지 못했습니다 — 키 확인 단계에서 멈췄을 수 있습니다)"
            echo '```'
            echo
            echo '## 신호 정리'
            echo '```'
            cat /tmp/register.log 2>/dev/null || echo "(등록 단계가 실행되지 못했습니다)"
            echo '```'
            echo
            echo '> 지도 조인에 "지도에 없는 시군구" 가 뜨면 행정구역이 바뀐 것입니다 —'
            echo '> `scripts/build-sgg-geo.mjs` 로 경계를 다시 만들어야 합니다.'
          } > data/population-last.md

      - name: 커밋
        if: always()
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@github.com"
          # ⚠️ 폴더를 통째로 쓸어 담지 않는다 — confirm.mjs 가 워크플로의 git add 경로를 읽어
          #    '정기물'을 가르기 때문에, 넓게 적으면 손으로 만든 데이터셋까지 정기물로 오인한다.
          git add -f data/population-last.md
          git add data/population-signals.md 2>/dev/null || true
          git add data/datasets/population-latest.json data/datasets/population research/ideas.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "바뀐 것 없음 — 커밋 생략"
          else
            git commit -m "인구 수집 ${{ steps.cfg.outputs.today }}"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: 텔레그램 알림 (신호가 있을 때만)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            node scripts/notify-telegram.mjs "⚠️ 인구 수집 실패 (${{ steps.cfg.outputs.today }}) — data/population-last.md 를 확인하세요"
            exit 0
          fi
          MSG=$(cat data/population-alert.txt 2>/dev/null || true)
          if [ -n "$MSG" ]; then
            node scripts/notify-telegram.mjs "$MSG"
          else
            echo "새 소재 없음 — 알림 생략(조용한 달도 정상이다)"
          fi

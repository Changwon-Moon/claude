name: 국내 증시 수집 (코스피·코스닥)

# 코스피·코스닥 일간 시세(Stooq)를 받아 연중 고점·고점대비 하락률 데이터셋을 커밋한다.
# 세션은 외부망 차단 → Actions 전용. 카드 빌더(build-index-2026.mjs)가 이 캐시를 소비.
on:
  # 대기열 파일이 바뀌면 실행한다 — 이 저장소의 다른 수집기(asset-fetch·geocode)와 같은 방식.
  # 작업 세션은 GitHub API 가 막혀 있어 workflow_dispatch 버튼을 누를 수 없다.
  # 푸시는 되므로, 파일 한 줄을 밀어 넣는 것이 세션이 수집을 시작할 수 있는 유일한 손잡이다.
  push:
    paths:
      - "data/market-queue.txt"
  workflow_dispatch:
    inputs:
      year:
        description: "대상 연도"
        required: true
        default: "2026"
  # ⛔ 자동 실행을 껐다 — 오너 지시 2026-08-17 "증시수집기를 멈춰줘"
  #
  # 왜: 이 수집기가 **지난 거래일을 지웠다.** 야후의 `range=2y` 창은 고정이 아니라서
  # 어떤 날은 지난 날을 빼고 주는데, 수집기가 받은 것을 series 에 그대로 덮어썼다.
  # 2026-08-16 22:34 실행이 kospi 의 07-21·07-22·07-31 과 kosdaq 의 07-31 을 없앴고,
  # 그 07-31 을 마지막 점으로 쓰던 **오너 확정 카드(`kospi-record`)의 근거가 사라졌다.**
  # doctor 가 픽셀로 잡아 준 게 다행이었을 뿐, 카드를 안 만들었으면 몰랐을 일이다.
  #
  # 코드는 그날 고쳤다 — 이제 **합친다**(안 온 날은 지키고, 빠질 뻔한 날을 로그로 말한다).
  # 그래도 **자동으로 도는 것은 멈춘다.** 고친 코드가 실제로 지켜 내는지 사람이 한 번
  # 눈으로 본 뒤에 다시 켠다. 조용히 도는 수집기가 조용히 지운 것이 이번 사고다.
  #
  # 손잡이는 살아 있다 — `data/market-queue.txt` 에 한 줄 밀거나 workflow_dispatch.
  # 다시 켜려면 아래 두 줄의 주석을 푼다(평일 07:10 KST · 국내장 마감 후 확정치).
  #
  # schedule:
  #   - cron: "10 22 * * 0-4"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      - name: 수집 → 데이터셋
        run: |
          YEAR="${{ github.event.inputs.year }}"
          YEAR="${YEAR:-2026}"
          pnpm --filter @wirit/collectors collect-kr-market -- \
            --year "$YEAR" --out "$GITHUB_WORKSPACE/data/datasets/kr-market-$YEAR.json"

      - name: 커밋
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/datasets/kr-market-*.json
          if git diff --cached --quiet; then echo "변경 없음"; else
            git commit -m "국내 증시(코스피·코스닥) 수집"
            # --autostash: 수집기가 남긴 부산물(data/raw 등) 때문에 rebase가 거부되어
            # **커밋해 놓고 push를 못 한 채 죽는** 일이 있었다(2026-07-26 소재 발굴).
            git pull --rebase --autostash origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

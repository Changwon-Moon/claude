name: 단지 공급면적 (카드 평 표기용)

# ── 무엇을 하나 (2026-08-16d 오너 "카드를 만들때에는 실제 공급평수를 적어줘야지")
# 건축물대장 전유공용면적에서 **호별 실측**으로 공급면적을 받아 적는다.
#   공급면적 = 전유 + 「주건축물」 공용
# 셈법과 근거는 packages/collectors/src/sources/supplyArea.ts 머리말에 있다
# (네이버부동산 표기 109.94㎡(84.92) 와 소수점까지 대조 완료).
#
# ── 왜 대장(apt-hhld.json)에 없나
# 대장에는 전용면적만 있다. 공급면적은 **건축물대장**에 있고 오퍼레이션이 다르다.
# 그래서 짚어 준 단지·타입만 받는다.
#
# ── 못 받으면 안 쓴다
# 전용면적이 맞는 아파트 호를 못 찾으면 **파일을 만들지 않는다.** 지어내지 않는다.
# 파일이 없으면 카드는 평 표기를 붙이지 못하고 빌더가 멈춘다 — 그게 맞다.
#
# ── 키
# DATA_GO_KR_API_KEY 다. MOLIT_API_KEY 가 **아니다**(2026-08-16d 실측 — 건축물대장은 이쪽으로 열린다).

on:
  push:
    paths:
      - "data/apt-supply-queue.txt"
      # 미리 채우기는 **다른 대기열**이다 — 이쪽에만 하루 상한이 걸린다 (2026-09-07).
      # 왜 갈랐는지는 data/apt-supply-bulk-queue.txt 머리말에 있다.
      - "data/apt-supply-bulk-queue.txt"

  # 이 서비스도 국토부라 몇 시간 단위로 문이 닫힌다(주차대수와 같은 현상).
  # 사람이 다시 밀기를 기다리지 않고 두 시간마다 대기열을 훑는다. 다 찼으면 몇 초에 끝난다.
  # schedule:  ← 2026-08-31 해제(아래 주석 참고)
  #    - cron: "37 */2 * * *"
  # ── 2026-08-31 예약 해제 — 수동(workflow_dispatch)·푸시 방아쇠로만 돈다.
  #    30일 실측에서 예약이 몰린 시간대일수록 스케줄러가 건너뛰었다(파수꾼 7%).
  #    매일 도는 예약은 텔레그램 알림 2건과 그 재료 4개만 남긴다:
  #      applyhome-collect(10:00) · singo-daily(07:30) · molit-peak-backfill(11:00) · apt-universe(매달 1일)
  #    깨우는 법: 대기열 파일에 한 줄 쓰고 push (CLAUDE.md §6) 또는 Actions 에서 Run workflow.

  workflow_dispatch:

  # ── 자동 재시도가 이 문으로 들어온다 (2026-09-03)
  #
  # 왜: 건축물대장도 실거래와 똑같이 **실행(러너) 단위**로 갈린다.
  # 09-03 09:08 런은 33건이 **전부** `fetch failed`(응답 자체 없음)였고 한도 문구는 0건이었다.
  # 09-01·09-02·09-03 **사흘 연속** 이 배관이 카드를 막았고, 매번 사람이 손으로 다시 밀었다.
  # 신고가에는 08-24 에 사다리를 달아 뒀는데 여기엔 없었다 —
  # **같은 고장에 같은 처방을 한쪽에만 단 것**이다(09-02 명부 잇기와 같은 실수).
  workflow_call:

permissions:
  contents: write

concurrency:
  group: apt-supply-area
  cancel-in-progress: false

jobs:
  supply:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # ⏱️ **제한 시간은 그물이고, 실제로 멈추는 것은 아래의 시간 예산이다** (2026-09-07)
    #
    # 예전엔 30분이었다. 그런데 대기열이 1,300줄이 되는 「미리 채우기」 같은 날에는
    # 한 판이 20분에서 접히고, 재시도 사다리 세 칸을 다 써도 네 판(≈360건)이 끝이라
    # 그 뒤로는 사람이 계속 밀어야 했다(09-07 에 50분 동안 한 건도 안 늘었다).
    #
    # 예산(BUDGET)이 루프를 **스스로** 끝내므로 평소 실행은 여전히 20분에 끝난다.
    # 제한 시간을 늘리는 것은 예산이 커진 날에만 의미가 있고, 예산 로직이 깨졌을 때를
    # 대비한 그물로 남는다. ⚠️ 제한에 걸려 죽으면 기록·커밋이 안 돌아 **받아 둔 것이
    # 통째로 날아간다**(09-02 곡선 사고) — 그래서 예산은 언제나 제한보다 5분 짧게 깎는다.
    timeout-minutes: ${{ vars.SUPPLY_TIMEOUT_MIN || 120 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      - name: 대기열 처리
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        shell: bash
        run: |
          set +e
          Q=data/apt-supply-queue.txt          # 카드가 오늘 기다리는 줄 — **상한 없음**
          QB=data/apt-supply-bulk-queue.txt    # 미리 채우기 — **하루 상한이 걸린 쪽**
          [ -f "$Q" ] || [ -f "$QB" ] || { echo "대기열 없음 — 건너뜀"; exit 0; }
          OKN=0; NGN=0; SKIPN=0; CAPN=0; TRIED=0; CAPPED=0; QUOTA=0
          # 연달아 이만큼 연결이 안 열리면 문이 닫힌 것으로 본다. 한두 건은 그 단지 사정일 수 있다.
          DEAD=0; DEAD_MAX=6; CLOSED=0
          : > "$RUNNER_TEMP/supply.log"

          # ── 🧾 **하루 상한** — 판이 아니라 **날짜**로 센다 (2026-09-07 오너 "하루 상한 잘 정해서")
          #
          # 왜 판 기준이면 안 되나: 재시도 사다리가 같은 날 네 판을 돌린다.
          # 판마다 250이면 하루 1,000이 되어 상한이 상한이 아니게 된다.
          # 그래서 `data/apt-supply-day.txt` 장부에 **날짜별 시도 건수**를 적고 거기서 뺀다.
          #
          # 왜 250인가 (09-07 실측): 그날 338건을 받고 나서 공공데이터포털이 닫혔다.
          # 한 건이 페이지를 여러 번 부르므로 건수가 곧 호출수는 아니지만, 닫힌 지점이
          # 400건 안쪽인 것은 재 봤다. 250이면 **아침 카드 몫(하루 스무 건 남짓)을 남긴다.**
          # 저장소 변수 SUPPLY_DAILY_MAX 로 바꾼다.
          #
          # ⚠️ 상한은 **미리 채우기 대기열에만** 건다. 카드가 기다리는 줄까지 막으면
          #    상한이 그날 카드를 못 만들게 하는 문지기가 된다 — 그건 정반대다.
          # ⚠️ 성공만이 아니라 **시도**를 센다(실패한 호출도 한도를 태운다).
          #    「이미 있음」으로 건너뛴 줄은 안 센다 — 호출을 안 했다.
          LEDGER=data/apt-supply-day.txt
          TODAY=$(TZ=Asia/Seoul date +%F)
          CAP=${{ vars.SUPPLY_DAILY_MAX || 250 }}
          USED=0
          if [ -f "$LEDGER" ]; then
            L=$(grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]+[0-9]+' "$LEDGER" | tail -1)
            if [ "$(echo "$L" | awk '{print $1}')" = "$TODAY" ]; then USED=$(echo "$L" | awk '{print $2}'); fi
          fi
          USED=${USED:-0}
          ALLOW=$(( CAP - USED )); [ "$ALLOW" -lt 0 ] && ALLOW=0
          echo "🧾 오늘(${TODAY}) 미리 채우기 ${USED}/${CAP}건 — 이 판에서 최대 ${ALLOW}건"
          # ⚠️ **시간 예산 20분** (2026-09-03)
          #    재시도 사다리(3번·지수 대기)를 붙인 뒤로 「전부 실패」하는 날에는 한 줄에 수십 초가 든다.
          #    대기열이 184줄이라 30분 제한에 걸려 잡이 **죽었고**, 죽으면 `if: always()` 기록·커밋
          #    단계가 아예 안 돈다(09-02 곡선에서 똑같이 두 시간을 통째로 날렸다).
          #    그래서 20분에서 스스로 접는다 — 접어야 「실패 N건」이 기록되고, 그래야 사다리가 이어받는다.
          # ── ⏱️ 시간 예산 — 기본 20분, 대기열이 요청하면 더 길게 (2026-09-07)
          #
          # 왜: 09-07 에 1,182건을 미리 채우는데 한 판이 90건에서 접혔다. 재시도 사다리는
          # 세 칸이라 한 번 밀면 네 판(≈360건)이 끝이고, 그 뒤로는 **사람이 계속 밀어야** 했다.
          # 실제로 50분 동안 한 건도 안 늘었다 — 사다리가 다 소진된 채 아무도 안 밀었기 때문이다.
          #
          # 그래서 대기열이 예산을 말할 수 있게 한다. 다른 워크플로(molit-peak-backfill·
          # month-backfill)가 이미 쓰는 방식 그대로다.
          #
          # ⚠️ **예약 런은 대기열을 읽지 않는다.** 한 번 민 쪽지가 상시 설정이 되면 안 된다
          #    (2026-08-19 months=1 사고 · 09-03 에 두 워크플로에 같은 가드를 달았다).
          # ⚠️ 잡 제한 시간보다 **짧게** 잡는다 — 예산이 제한을 넘으면 잡이 죽고,
          #    죽으면 기록·커밋이 안 돌아 받아 둔 것이 통째로 날아간다(09-02 곡선 사고).
          BUDGET=1200
          EVT="${{ github.event_name }}"
          if { [ "$EVT" = "push" ] || [ "$EVT" = "workflow_dispatch" ]; }; then
            B=$(cat "$Q" "$QB" 2>/dev/null | grep -oE '^[[:space:]]*budget=[0-9]+' | tail -1 | grep -oE '[0-9]+' || true)
            if [ -n "$B" ]; then
              LIMIT=$(( ${{ vars.SUPPLY_TIMEOUT_MIN || 120 }} * 60 - 300 ))
              [ "$B" -gt "$LIMIT" ] && B=$LIMIT
              BUDGET=$B
              echo "⏱️ 대기열이 예산 ${BUDGET}초를 요청했습니다(잡 제한 안에서만 듣습니다)"
            fi
          fi
          # ⚠️ **새 줄부터** 훑는다(tac). 대기열은 아래로 쌓이고, 오늘 카드가 기다리는 것은 **맨 아래 묶음**이다.
          #    위에서부터 훑으면 예산이 옛 줄에 다 타고 오늘 것은 손도 못 댄다.
          #
          # ── 대기열 하나를 훑는다. 두 번째 인자가 1 이면 **하루 상한을 받는 쪽**이다.
          #
          # ⚠️ 「이미 있음」을 **맨 앞에서** 거른다 (2026-09-07 에 순서를 바꿨다).
          #    예전엔 예산 검사가 먼저라, 예산이 끝난 뒤엔 **이미 받아 둔 줄까지 「미룸」으로 셌다.**
          #    미리 채우기로 대기열이 1,300줄이 된 뒤로 그 숫자가 실제로 남은 일과 딴판이 됐다.
          #    이제 「미룸」은 **정말 아직 못 받은 줄**만 센다.
          # ⚠️ 문이 닫혔거나 예산이 끝나도 `break` 하지 않고 **끝까지 세기만 한다.**
          #    남은 줄이 몇인지 알아야 사다리가 이어받을지 판단할 수 있다(호출은 안 한다).
          run_queue() {
            local F="$1" LIMITED="$2" LINE KAPT AREA FORCE AI TYPE OUT
            [ -f "$F" ] || return 0
            while read -r LINE; do
              case "$LINE" in ''|'#'*) continue;; esac
              KAPT=$(echo "$LINE" | grep -oE 'kapt=A[0-9]+' | cut -d= -f2)
              AREA=$(echo "$LINE" | grep -oE 'area=[0-9.]+'  | cut -d= -f2)
              FORCE=$(echo "$LINE" | grep -oE 'force=1')
              [ -n "$KAPT" ] && [ -n "$AREA" ] || continue
              # 수집기(`supplyAreaCli.ts`)가 파일 이름을 짓는 규칙과 **같아야 한다** — 84 / 59 / 그 외 반올림
              AI=${AREA%%.*}
              if   [ "$AI" -ge 82 ]; then TYPE=84
              elif [ "$AI" -ge 56 ]; then TYPE=59
              else TYPE=$(awk -v a="$AREA" 'BEGIN{printf "%d", a+0.5}'); fi
              OUT="data/datasets/apt-supply/$KAPT-$TYPE.json"
              [ -f "$OUT" ] && [ -z "$FORCE" ] && continue
              # ── 여기부터는 **아직 못 받은 줄**이다
              # ── 🚫 **한도가 닫힌 날은 그날 안에 다시 열리지 않는다** (2026-09-07)
              #    `fetch failed`(문이 잠깐 닫힘)와 다르다 — **일일** 한도라 새 러너로 바꿔도 그대로다.
              #    그런데 예전엔 이것도 「실패」로 세어 빨간불을 켰고, 재시도 사다리가 세 칸을
              #    더 돌며 같은 벽을 두드렸다. 상한과 같은 취급을 한다: **세되 초록불로 끝낸다.**
              if [ "$QUOTA" = "1" ]; then CAPN=$((CAPN+1)); CAPPED=1; continue; fi
              if [ "$LIMITED" = "1" ] && [ "$TRIED" -ge "$ALLOW" ]; then CAPN=$((CAPN+1)); CAPPED=1; continue; fi
              if [ "$CLOSED" = "1" ] || [ "$SECONDS" -ge "$BUDGET" ]; then SKIPN=$((SKIPN+1)); continue; fi
              echo "── $KAPT 전용 $AREA" | tee -a "$RUNNER_TEMP/supply.log"
              : > "$RUNNER_TEMP/one.log"
              [ "$LIMITED" = "1" ] && TRIED=$((TRIED+1))
              if pnpm --filter @wirit/collectors collect-supply-area -- --kapt "$KAPT" --area "$AREA" 2>&1 | tee "$RUNNER_TEMP/one.log"; then
                OKN=$((OKN+1)); DEAD=0
              else
                NGN=$((NGN+1))
              # ── ⛔ **문이 닫힌 것을 알면 그만 두드린다** (2026-09-07)
              #
              # `fetch failed` 는 **연결 자체가 안 열린다**는 뜻이다(응답이 늦은 게 아니다).
              # 이건 이 단지의 문제가 아니라 **서비스 전체가 닫힌 것**이라, 다음 줄도 똑같이 실패한다.
              #
              # 09-07 실측: 「미리 채우기」로 예산을 110분으로 늘린 판이 **197건을 시도해
              # 성공 0건**으로 끝났다. 전부 fetch failed 였다 — 닫힌 문을 두 시간 두드린 셈이다.
              # 20분 판이었으면 일찍 접고 새 러너에서 다시 두드렸을 것이다.
              # **예산을 늘린 것이 오히려 손해가 되는 자리**가 여기였다.
              #
              # ⚠️ 「줄 0개」·「찾지 못했다」는 **세지 않는다.** 그건 그 단지만의 사정이고
              #    다음 줄은 멀쩡히 될 수 있다. 연결이 안 열리는 것만 문 닫힘으로 본다.
              # ⚠️ 접어도 **여기까지 받은 것은 그대로 커밋된다**(아래 기록·커밋 단계).
              #    남은 줄은 「미룸」으로 세어 재시도 사다리가 이어받는다.
                if grep -q "fetch failed" "$RUNNER_TEMP/one.log"; then
                  DEAD=$((DEAD+1))
                else
                  DEAD=0
                fi
                # 🚫 일일 호출 한도 — 이 줄부터는 오늘 아무것도 안 된다. 방금 것은 실패에서 뺀다.
                if grep -q "일일 호출 한도" "$RUNNER_TEMP/one.log"; then
                  QUOTA=1; NGN=$((NGN-1)); CAPN=$((CAPN+1)); CAPPED=1
                  echo "🚫 공공데이터포털 **일일 호출 한도**입니다 — 오늘은 여기까지. 내일 이어서 받습니다." | tee -a "$RUNNER_TEMP/supply.log"
                fi
              fi
              cat "$RUNNER_TEMP/one.log" >> "$RUNNER_TEMP/supply.log"
              if [ "$DEAD" -ge "$DEAD_MAX" ]; then
                echo "⛔ 연결이 ${DEAD}번 연달아 안 열렸습니다 — 문이 닫혔습니다. 남은 줄은 새 러너에 넘깁니다." | tee -a "$RUNNER_TEMP/supply.log"
                CLOSED=1
              fi
            done < <(tac "$F")
          }

          # ⚠️ **카드가 먼저다.** 미리 채우기가 예산과 상한을 먼저 먹으면 오늘 카드가 못 나온다.
          run_queue "$Q"  0
          run_queue "$QB" 1

          [ "${CLOSED:-0}" = "1" ] && echo "⏳ 문이 닫혀 접었습니다 — 남은 ${SKIPN}줄은 다음 칸으로 미룹니다" | tee -a "$RUNNER_TEMP/supply.log"
          [ "$SKIPN" -gt 0 ] && [ "${CLOSED:-0}" != "1" ] && echo "⏳ 시간 예산(${BUDGET}초)에 닿아 ${SKIPN}줄은 다음 칸으로 미룹니다" | tee -a "$RUNNER_TEMP/supply.log"

          # ── 🧾 장부에 오늘 몫을 적는다 (시도 기준)
          NOW=$(( USED + TRIED ))
          # 🚫 한도에 걸린 날은 **오늘 몫을 다 쓴 것으로 적는다.** 그래야 13시 예약이
          #    같은 벽을 한 번 더 두드리러 오지 않는다(열쇠를 다른 것이 먼저 태운 날도 있다).
          if [ "$QUOTA" = "1" ] && [ "$NOW" -lt "$CAP" ]; then NOW=$CAP; TRIED=1; fi
          if [ "$TRIED" -gt 0 ]; then
            grep -vE "^${TODAY}[[:space:]]" "$LEDGER" > "$RUNNER_TEMP/led" 2>/dev/null || true
            { cat "$RUNNER_TEMP/led"; echo "$TODAY $NOW"; } > "$LEDGER"
          fi
          if [ "$CAPPED" = "1" ]; then
            echo "🧾 오늘 몫(${CAP}건)을 다 썼습니다 — 미리 채우기 ${CAPN}줄은 **내일** 이어서 받습니다." | tee -a "$RUNNER_TEMP/supply.log"
            echo "   (실패가 아닙니다. 여기서 빨간불을 켜면 재시도 사다리가 상한을 우회합니다.)" | tee -a "$RUNNER_TEMP/supply.log"
          fi
          {
            echo "OKN=$OKN"; echo "NGN=$NGN"; echo "SKIPN=$SKIPN"
            echo "CAPN=$CAPN"; echo "DAYUSED=$NOW"; echo "DAYCAP=$CAP"
          } >> "$GITHUB_ENV"
          exit 0

      - name: 실행 결과 기록
        if: always()
        shell: bash
        run: |
          {
            echo "# 단지 공급면적 — 마지막 실행"
            echo
            echo "- 성공 ${OKN:-0}건 · 실패 ${NGN:-0}건 · 미룸 ${SKIPN:-0}줄"
            echo "- 결과는 Actions 로그가 아니라 이 파일과 data/datasets/apt-supply/ 에서 본다"
            # ⚠️ **머리 4줄 안에 넣지 않는다.** 재시도 사다리의 문지기가 머리 4줄에서
            #    「실패 N건」·「미룸 N줄」을 찾는다. 상한 줄이 그 안에 있으면 헛짚을 수 있다.
            echo "- 미리 채우기 오늘 몫 ${DAYUSED:-0}/${DAYCAP:-0}건 · 내일로 미룬 ${CAPN:-0}줄 (상한은 실패가 아니다)"
            echo
            echo '```'
            tail -c 60000 "$RUNNER_TEMP/supply.log" 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } > data/apt-supply-last.md

      - name: 커밋
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/apt-supply-last.md
          # 🧾 하루 장부 — 이것이 저장소에 도달해야 다음 판이 오늘 몫을 안다.
          #    빠뜨리면 판마다 상한이 처음부터라 상한이 없는 것과 같아진다.
          [ -e data/apt-supply-day.txt ] && git add -f data/apt-supply-day.txt || true
          [ -e data/datasets/apt-supply ] && git add data/datasets/apt-supply || true
          git diff --cached --quiet || git commit -m "공급면적 수집 (실측 · 전유+주건축물공용)"
          git pull --rebase --autostash || true
          git push

      # ── ⛔ **실패했으면 빨간불로 끝낸다** (2026-09-03)
      #
      # 예전엔 33건이 전부 실패해도 워크플로는 **초록불**이었다(`set +e` · `exit 0`).
      # 그래서 「돌지만 계속 실패」를 잡는 침묵 감시(`silent-pipes.mjs` — Actions 의
      # **conclusion** 을 본다)가 이 배관을 **영원히 못 잡았다.**
      # 09-01·09-02·09-03 **사흘 연속** 실패가 조용했던 구조적 이유가 이것이다.
      #
      # 08-19 에 신고가에서 배운 것과 같은 자리다:
      # **종료코드 0 이 「일했다」를 뜻하지 않으면 그 배관은 며칠이고 조용히 멈춰 있을 수 있다.**
      #
      # ⚠️ 기록·커밋보다 **뒤에** 둔다. 앞에 두면 결과 파일이 저장소에 도달하지 못하고,
      #    그러면 재시도 사다리의 문지기가 읽을 것이 없어진다(09-02 곡선 사고와 같은 모양).
      # ⚠️ 사다리는 이 잡이 실패해도 이어진다 — `apt-supply-retry.yml` 의 문지기들이
      #    `if: always()` 로 서 있다. 그쪽을 함께 고쳤다.
      - name: 실패했으면 빨간불
        if: always()
        shell: bash
        run: |
          # ⚠️ **하루 상한(CAPN)은 여기 안 더한다** (2026-09-07)
          #    상한에 닿은 것은 실패가 아니라 「오늘 몫을 다 썼다」이다.
          #    여기서 빨간불을 켜면 재시도 사다리가 이어받아 **상한을 우회한다** —
          #    그러면 상한이 상한이 아니게 되고, 09-07 처럼 한도를 태워 다음 날 아침 카드까지 막는다.
          N=$(( ${NGN:-0} + ${SKIPN:-0} ))
          if [ "$N" -gt 0 ]; then
            echo "::error::공급면적 ${NGN:-0}건 실패 · ${SKIPN:-0}줄 미룸 — 재시도 사다리가 새 러너로 이어받습니다"
            exit 1
          fi
          if [ "${CAPN:-0}" -gt 0 ]; then
            echo "🧾 오늘 몫(${DAYCAP:-0}건)을 다 썼습니다 — 미리 채우기 ${CAPN}줄은 내일 예약이 이어받습니다(초록불이 맞습니다)"
            exit 0
          fi
          echo "✅ 남은 것 없음"

name: 데이터 수집 (daily)

# 매일 데이터 수집. 실제 외부 API 호출은 이 Actions 환경(네트워크 개방)에서 이뤄진다.
on:
  schedule:
    # 06:30 KST (21:30 UTC), 평일 — 미국장 마감 후 + 한국 데이터
    - cron: "30 21 * * 1-5"
  workflow_dispatch: # 수동 실행 버튼 (운영자가 언제든 테스트)

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      - name: 데이터 수집
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: pnpm --filter @wirit/collectors collect

      - name: 수집 결과 업로드(아티팩트)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-data
          path: data/raw/
          if-no-files-found: warn
          retention-days: 14

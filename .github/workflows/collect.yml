name: 데이터 수집 (daily)

# 매일 데이터 수집. 실제 외부 API 호출은 이 Actions 환경(네트워크 개방)에서 이뤄진다.
on:
  # schedule:  ← 2026-08-31 해제(아래 주석 참고)
    # 06:30 KST (21:30 UTC), 평일 — 미국장 마감 후 + 한국 데이터
        # ⚠️ **정각을 피한다** (2026-08-27). 8/26~27 GitHub Actions 장애 때
    #    21:00~22:10 UTC 창의 예약이 통째로 사라졌다 — 관제탑 배포(21:00)·데이터 수집(21:30)·
    #    파이프라인(22:00)·소재 보드(22:00)·신고가(22:00)가 한꺼번에 안 떴다.
    #    같은 시간대의 `17 */2`·`37 */2` 는 멀쩡히 돌았다. 정각은 전 세계가 몰리는 자리다.
    #    ↳ 파수꾼은 **안 뜬 것을 찾아낸다**. 이 줄은 **애초에 덜 몰리게 한다**. 둘 다 필요하다.
  #    - cron: "34 21 * * 1-5"
  # ── 2026-08-31 예약 해제 — 수동(workflow_dispatch)·푸시 방아쇠로만 돈다.
  #    30일 실측에서 예약이 몰린 시간대일수록 스케줄러가 건너뛰었다(파수꾼 7%).
  #    매일 도는 예약은 텔레그램 알림 2건과 그 재료 4개만 남긴다:
  #      applyhome-collect(10:00) · singo-daily(07:30) · molit-peak-backfill(11:00) · apt-universe(매달 1일)
  #    깨우는 법: 대기열 파일에 한 줄 쓰고 push (CLAUDE.md §6) 또는 Actions 에서 Run workflow.
  workflow_dispatch: # 수동 실행 버튼 (운영자가 언제든 테스트)

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 파서 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      - name: 데이터 수집
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: pnpm --filter @wirit/collectors collect

      - name: 수집 결과 업로드(아티팩트)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-data
          path: data/raw/
          if-no-files-found: warn
          retention-days: 14

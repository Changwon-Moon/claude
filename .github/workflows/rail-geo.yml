name: 철도 선형 좌표 (OSM 탐사)

# 수도권 건설중 8개 노선의 선형·역 좌표를 OSM 에서 받는다.
#
# ⚠️ **왜 Actions 인가**: 코워크 컨테이너에서는 Overpass 가 막혀 있다.
#    collect.yml 이 스스로 적어 둔 대로 "실제 외부 API 호출은 이 Actions 환경에서 이뤄진다".
#
# ⚠️ **예약을 걸지 않는다.** 이건 한 번 재서 판단하려는 탐사이지 매일 도는 배관이 아니다.
#    (2026-08-31 실측 — 예약이 몰린 시간대일수록 스케줄러가 건너뛴다. 안 도는 예약을
#     늘리는 것은 파수꾼이 볼 것만 늘린다.)
on:
  workflow_dispatch:
    inputs:
      only:
        description: "한 노선만 (sinansan / gtxa / ... 비우면 8개 전부)"
        type: string
        required: false
        default: "sinansan"

# 봇이 결과 파일을 커밋한다 — 기본 GITHUB_TOKEN 은 읽기만 되어서 첫 실행이 커밋 단계에서
# 죽었다(run 34176171620). 탐사 자체는 성공했는데 결과가 저장소에 안 남아 볼 수가 없었다.
permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: OSM 탐사
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            node scripts/collect-rail-geo.mjs --probe --only "${{ inputs.only }}"
          else
            node scripts/collect-rail-geo.mjs --probe
          fi

      - name: 결과 커밋
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@github.com"
          # ⚠️ 경로를 한 줄에 몰아 쓰지 않는다 — 하나라도 없으면 add 가 통째로 실패해
          #    아무것도 안 담긴다 (singo-daily.yml 이 2026-08-12 에 이렇게 잃었다).
          [ -e data/geo/_probe-rail-osm.json ] && git add -f data/geo/_probe-rail-osm.json || true
          if git diff --cached --quiet; then
            echo "바뀐 것 없음 — 커밋 생략"
          else
            git commit -m "OSM 탐사 — 철도 선형 좌표가 어떤 모양으로 있는지 [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

name: 문지기 (guard)

# ══════════════════════════════════════════════════════════════
# 여러 세션이 같은 저장소를 민다. 오늘(2026-08-04~06) 겪은 사고 셋은 전부
# **"바뀐 것을 아무도 즉시 몰랐다"** 에서 나왔다.
#
#   ① 다른 세션이 공용 렌더러를 바꿔 오너 확정 카드의 픽셀이 달라졌다
#      → 며칠 뒤 doctor 를 돌리고서야 알았다
#   ② 워크플로 YAML 이 깨져 GitHub 에 등록조차 안 됐다
#      → 실행 목록에 뜨지도 않아 몇 주간 안 돌았고, 빨간불조차 없었다
#   ③ probe 결과가 브랜치 경합으로 유실됐다
#
# 셋 다 **푸시 시점에 검사가 돌았으면 그 자리에서 잡혔다.**
# 이 워크플로가 그 문지기다. 사람이 기억해서 돌리는 검사는 언젠가 안 돈다.
#
# ── 무엇을 보나
#   · 셀프테스트 (파서·규칙·가드 전부)
#   · 워크플로 YAML (깨지면 등록조차 안 된다)
#
# ── ⚠️ 픽셀 검사는 여기서 하지 않는다 (2026-08-12 오너 결정)
# 예전엔 `doctor.mjs` 를 통째로 불렀다. 그런데 doctor 는 **실제로 렌더한다** —
# 이 워크플로엔 Chromium 설치 단계가 없어서(tower-deploy.yml 에는 있다) GitHub 러너에선
# 렌더가 전량 실패했다. 그 결과 **문지기는 2026-08-08 이후 한 번도 성공하지 못했고,
# 늘 빨간불이라 아무도 보지 않는 검사**가 됐다. 항상 실패하는 문지기는 문지기가 아니다.
#
# 설치 단계를 넣어 고칠 수도 있었지만 그러지 않았다. 이 공장의 규칙은
# **「렌더 창구는 한 곳으로 고정한다」** — 여러 기계에서 번갈아 렌더하면 픽셀 기준선이
# 갈라진다. GitHub 러너를 새 렌더 창구로 들이면 그 규칙이 깨진다.
#
# 그래서 픽셀은 **원래 창구에서만** 지킨다:
#   · 작업 세션 — `node scripts/doctor.mjs` (커밋 전 필수, CLAUDE.md §1)
#   · 관제탑 배포 — Chromium 을 설치하고 렌더하는 tower-deploy.yml
# 문지기는 **브라우저 없이 확실히 판정할 수 있는 것만** 본다. 그게 늘 초록일 수 있는
# 유일한 방법이고, 늘 초록인 검사만 빨간불에 의미가 생긴다.
# ══════════════════════════════════════════════════════════════
on:
  push:
    branches: ["**"]
    paths:
      - "packages/**"
      - "templates/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/**"
      - "data/review/**"
      # ⚠️ 문서 경로가 빠져 있었다(2026-08-31 발견). 문지기에 「문서 링크」 검사를 걸어 두고도
      #    **문서만 고쳐 푸시하면 문지기가 아예 안 떠서** 검사가 무용지물이었다.
      #    검사를 거는 것과 그 검사가 도는 것은 다른 일이다.
      - "docs/**"
      - "company/**"
      - "research/**"
      - "*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 같은 브랜치에 연달아 밀면 마지막 것만 본다 — 중간 것을 검사해도 의미가 없다.
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 빠른 것부터 — 깨진 YAML 은 10초면 잡히고, 잡히면 뒤를 볼 이유가 없다.
      - name: 워크플로 YAML
        run: node scripts/lint-workflows.mjs

      # 문서를 archive 로 옮기면 남은 문서가 옛 주소를 가리킨 채 남는다(2026-08-30).
      # 다음 세션이 "그 문서를 읽어라"를 따라갔다가 없는 파일에 부딪힌다.
      # 브라우저 없이 확실히 판정되는 검사라 문지기가 볼 수 있다.
      - name: 문서 링크
        run: node scripts/check-doc-links.mjs

      # 아래 둘은 doctor 에도 있지만 **세션이 doctor 를 안 돌리고 커밋할 수 있다**(실제로 그랬다).
      # 브라우저 없이 확실히 판정되는 검사라 문지기가 봐도 늘 초록일 수 있다.
      - name: 고아 스크립트
        run: node scripts/check-orphan-scripts.mjs --strict

      - name: STATUS 부피
        run: node scripts/prune-status.mjs

      - name: 문서 ↔ 배관 정합
        run: node scripts/check-schedule-docs.mjs

      # 구역을 나누지 않고 전부 본다 — 개별 검사가 놓치는 사이를 메운다
      - name: 전수 검사
        run: node scripts/audit-all.mjs --strict

      - name: 셀프테스트
        run: pnpm --filter @wirit/collectors selftest

      # ⚠️ 픽셀 검사(doctor)는 여기서 돌리지 않는다 — 맨 위 주석 참조(2026-08-12).
      #    브라우저가 없는 러너에서 렌더를 돌려 문지기가 나흘간 상시 빨간불이었다.
      #    픽셀은 작업 세션(doctor)과 tower-deploy 에서 지킨다.
      #    대신 명세 파일이 깨지지 않았는지는 브라우저 없이 볼 수 있다.
      - name: 명세 파일(JSON) 파싱
        run: |
          for f in data/review/sets.json data/review/builders.json data/review/pixel-baselines.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              && echo "  ✅ $f" || { echo "::error::$f 가 깨졌습니다"; exit 1; }
          done

      # 세트가 가리키는 빌더 스크립트가 실제로 있는지. 없으면 그 카드는 새 clone·CI 에서
      # 영영 안 나온다(2026-07-26 '월급 34평' 사고와 같은 계열). 브라우저 없이 잴 수 있다.
      - name: 세트 ↔ 빌더 정합
        run: |
          node -e '
            const fs=require("fs");
            const B=JSON.parse(fs.readFileSync("data/review/builders.json","utf8")).builders||[];
            const S=JSON.parse(fs.readFileSync("data/review/sets.json","utf8")).sets||[];
            let bad=0;
            for (const b of B) if (!fs.existsSync(b.cmd)) { console.log(`::error::빌더 스크립트 없음 — ${b.label} → ${b.cmd}`); bad++; }
            const has=new Set(B.map(b=>b.label));
            for (const s of S) if (s.state==="오너 확정" && !has.has(s.label))
              console.log(`::warning::확정 세트인데 빌더 미등록 — ${s.label}`);
            console.log(`  세트 ${S.length} · 빌더 ${B.length} · 빌더 파일 누락 ${bad}`);
            process.exit(bad?1:0);
          '

      - name: 무엇이 걸렸나
        if: failure()
        run: |
          echo "::error::문지기가 막았습니다. 아래 중 하나입니다:"
          echo "  · 워크플로 YAML 이 깨졌다 → 그 워크플로는 GitHub 에 등록조차 안 됩니다"
          echo "  · 셀프테스트가 깨졌다 → 파서·수집 규칙이 바뀌었습니다"
          echo "  · 명세 JSON 이 깨졌다 → sets/builders/pixel-baselines 를 확인하세요"
          echo ""
          echo "확정 카드 픽셀은 문지기가 보지 않습니다(2026-08-12 결정)."
          echo "  공용 템플릿·CSS·렌더러를 건드렸다면 **작업 세션에서** 확인하세요:"
          echo "    node scripts/doctor.mjs"
          echo "  픽셀이 달라졌고 그게 의도한 변경이면 오너 확인을 받고"
          echo "  data/review/pixel-baselines.json 을 갱신하되, 무엇이 왜 바뀌었는지 note 에 적으세요."
          echo "  기준값만 고쳐 통과시키는 것은 가드를 없애는 것과 같습니다."

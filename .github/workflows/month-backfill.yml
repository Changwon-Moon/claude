name: 「구 × 월」 캐시 백필 (곡선을 호출 없이 그리기 위한 적재)

# ── 무엇을 하나 (2026-09-02)
#
# 곡선 수집기는 「그 단지의 이력」이 아니라 **「그 구의 그 달 전체 거래」**를 받아
# 우리 단지만 골라낸다. 그래서 카드 19장에 약 **1,500회**가 들었다 —
# 아침 신고가 알림 전체가 122회다. 09-02 에 그것 하나가 하루 예산을 태워
# 낮에는 모든 국토부 배관이 막혔다(문구는 `등록되지 않은 서비스키`, 실은 **일일 한도**).
#
# 받아 둔 달을 `data/datasets/molit-monthly/{구}/{연월}.json` 에 접어 두면
# 곡선은 **호출 0회**로 그려진다. 과거 달의 값은 변하지 않기 때문이다.
#
# ── 왜 매일 조금씩인가
# 처음 한 번 채우는 값이 61구 × 79개월 ≈ **4,900회**다. 하루에 다 하면 09-02 가 되풀이된다.
# 그래서 **하루 예산만큼만** 채우고 접는다. 사나흘이면 다 찬다.
#
# ⚠️ 아침 신고가(04:55 KST)를 지키는 것이 1순위다 — 그게 계정의 심장이다.
#    그래서 이 예약은 아침 알림이 **끝난 뒤**에 돌고, 예산을 넘기지 않는다.
on:
  schedule:
    # 10:40 KST = 01:40 UTC — **아침 알림 창이 완전히 끝난 뒤**
    #
    # ⚠️ 원래 06:40 이었다. 그런데 09-03 에 아침 예약이 **2시간 34분 지각**해 07:29 에 뜨면서
    #    백필이 **먼저** 돌아 버렸다. 호출량이 원인은 아니지만(같은 날 1,200회를 연속으로 쏘고도
    #    전부 성공한 실행이 있다), **같은 시간대에 두 잡이 돌면 어느 쪽이 왜 실패했는지 가리기가
    #    어려워진다.** 실제로 오전 내내 그것을 가리는 데 시간을 썼다.
    #    아침 알림은 04:55~07:10 예약 + 재시도로 09:20 무렵까지 이어지므로 그 뒤로 옮긴다.
    #    백필은 급하지 않다 — 며칠에 걸쳐 채우는 일이다.
    - cron: "40 1 * * *"
  # ── 대기열 방아쇠 (2026-09-02 신설)
  #
  # 이 워크플로에는 방아쇠가 예약과 버튼뿐이었다. 그런데 **작업 세션은 버튼을 못 누른다**
  # (api.github.com 이 프록시에서 403 — CLAUDE.md §6). 그래서 세션이 급한 창을 먼저
  # 채우고 싶어도 **다음 날 아침까지 기다리는 수밖에** 없었다. 다른 배관과 같은 방식으로
  # 손잡이를 단다: 파일 한 줄을 밀면 그 줄로 한 번 돈다.
  #
  #   한 줄 형식:  budget=600 from=201911 to=202003 [lawd=41210]
  #
  # ⚠️ 예약 런은 이 파일을 **읽지 않는다** — 8/1 에 민 한 줄이 상시 설정이 되어 정기 실거래
  #    수집이 두 주 동안 엉뚱한 범위로 돌았다(molit-collect.yml 의 같은 자리 참고).
  push:
    paths:
      - "data/month-backfill-queue.txt"
  workflow_dispatch:
    inputs:
      budget:
        description: "오늘 쓸 호출 수 (기본 1200)"
        required: false
        default: "1200"
      lawd:
        description: "특정 구만 (비우면 전부)"
        required: false
        default: ""
      from:
        description: "시작월 YYYYMM (비우면 2020-01)"
        required: false
        default: ""
      to:
        description: "끝월 YYYYMM (비우면 두 달 전까지)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: month-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # ── 🔒 아침 알림이 1순위다 — 그게 아직 성공 못 했으면 **오늘 백필은 미룬다** (2026-09-03)
      #
      # 백필은 며칠에 걸쳐 채우는 일이라 하루 미뤄도 아무것도 안 잃는다.
      # 아침 알림은 그날 못 보내면 **그날치가 없어진다.** 우선순위를 문서가 아니라 코드에 박는다.
      #
      # ⚠️ 호출량이 서로를 막는다는 뜻이 아니다(그건 09-03 에 아니라고 실측했다).
      #    같은 창 안에서 두 잡이 돌면 **무엇이 왜 실패했는지 가릴 수 없게 되는 것**이 문제다.
      - name: 아침 알림이 오늘 성공했나
        id: morning
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "손으로 부른 실행 — 그냥 진행합니다"; echo "go=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --quiet origin ${{ github.ref_name }} || true
          # ⚠️ **머리 8줄만 본다.** 이 파일은 머리(실행·결과) 아래에 **수집기 로그를 통째로** 담는다.
          #    파일 전체에서 「결과: **성공**」을 찾으면 로그 안의 글자에 걸릴 수 있고,
          #    그러면 실패한 날을 성공으로 읽어 **그날 알림을 통째로 건너뛴다.**
          #    (2026-09-03 에 이 로직을 일부러 깨뜨려 보다가 찾았다 — 통과만 봤으면 못 봤다.)
          HEAD8=$(git show origin/${{ github.ref_name }}:data/singo-last.md 2>/dev/null || cat data/singo-last.md 2>/dev/null || true)
          HEAD8=$(printf '%s' "$HEAD8" | head -8)
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          # 그리고 **줄머리를 고정**해서 본다(`^- 실행:` · `^- 결과:`). 로그 줄은 그 모양이 아니다.
          # 머리 자르기와 줄머리 고정, **둘 다** 둔다 — 하나가 뚫려도 다른 하나가 받는다.
          if printf '%s' "$HEAD8" | grep -q "^- 실행: ${TODAY} (KST)" && printf '%s' "$HEAD8" | grep -q '^- 결과: \*\*성공\*\*'; then
            echo "✅ 아침 알림 성공 확인 — 백필을 진행합니다"; echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "⏸ 오늘(${TODAY}) 아침 알림이 아직 성공하지 못했습니다 — 백필은 내일로 미룹니다."
            echo "   (백필은 며칠에 걸쳐 채우는 일이라 하루 미뤄도 잃는 것이 없습니다)"
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 백필
        if: steps.morning.outputs.go == '1' 
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        shell: bash
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@github.com"
          B="${{ github.event.inputs.budget }}"
          L="${{ github.event.inputs.lawd }}"
          F="${{ github.event.inputs.from }}"
          T="${{ github.event.inputs.to }}"
          # ⛔ 예약 런은 대기열을 읽지 않는다 — 한 번 민 줄이 상시 설정이 되면 안 된다.
          EVT="${{ github.event_name }}"
          if { [ "$EVT" = "push" ] || [ "$EVT" = "workflow_dispatch" ]; } && [ -f data/month-backfill-queue.txt ]; then
            LINE=$(grep -v '^[[:space:]]*#' data/month-backfill-queue.txt | grep -v '^[[:space:]]*$' | tail -1)
            echo "대기열 마지막 줄: $LINE"
            [ -z "$B" ] && B=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^budget=//p')
            [ -z "$L" ] && L=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^lawd=//p')
            [ -z "$F" ] && F=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^from=//p')
            [ -z "$T" ] && T=$(echo "$LINE" | tr ' ' '\n' | sed -n 's/^to=//p')
          fi
          [ -z "$B" ] && B=1200
          echo "백필: 예산 $B · 창 ${F:-기본}~${T:-두 달 전} ${L:+· 구 $L}"
          pnpm --filter @wirit/collectors collect-month-backfill -- \
            --budget "$B" ${L:+--lawd "$L"} ${F:+--from "$F"} ${T:+--to "$T"} 2>&1 | tee "$RUNNER_TEMP/bf.log"

      - name: 커밋
        if: always()
        shell: bash
        run: |
          git config user.name "wirit-bot"
          git config user.email "actions@github.com"
          for P in data/datasets/molit-monthly data/molit-monthly-last.md; do
            [ -e "$P" ] && git add "$P" || true
          done
          if git diff --cached --quiet; then
            echo "바뀐 것 없음 — 커밋 생략"
          else
            git commit -m "「구 × 월」 캐시 백필"
            for TRY in 1 2 3; do
              git pull --rebase --autostash -q origin ${{ github.ref_name }} || true
              if git push -q origin HEAD:${{ github.ref_name }}; then break; fi
              sleep 5
            done
          fi

      # ── 실패해도 **저장소에 흔적을 남긴다** (2026-09-02 신설)
      #
      # 수집기는 `data/molit-monthly-last.md` 를 **끝까지 돈 뒤에만** 쓴다. 그래서 잡이
      # 중간에 죽으면 기록이 통째로 없고, 세션은 Actions 로그를 못 읽으므로
      # **「아직 도는 중」과 「죽었다」를 구별할 방법이 없다.** 실제로 09-02 에 그 상태로
      # 한 시간을 기다렸다. 실패하면 여기서 대신 적는다.
      - name: 실패를 기록에 남긴다
        if: failure()
        shell: bash
        run: |
          {
            echo "# 「구 × 월」 캐시 백필 — 마지막 실행"
            echo
            echo "- 실행: $(TZ=Asia/Seoul date +'%F %H:%M') (KST) · 방아쇠 \`${{ github.event_name }}\`"
            echo "- 결과: **실패** — 아래 로그를 보세요"
            echo
            echo '```'
            tail -25 "$RUNNER_TEMP/bf.log" 2>/dev/null || echo "(로그 없음 — 설치 단계에서 죽었을 수 있습니다)"
            echo '```'
          } > data/molit-monthly-last.md
          git config user.name "wirit-bot"
          git config user.email "actions@github.com"
          git add -f data/molit-monthly-last.md
          git diff --cached --quiet || {
            git commit -m "「구 × 월」 캐시 백필 실패 기록"
            for TRY in 1 2 3; do
              git pull --rebase --autostash -q origin ${{ github.ref_name }} || true
              if git push -q origin HEAD:${{ github.ref_name }}; then break; fi
              sleep 5
            done
          }

      # ── 실패하면 말한다 (2026-09-02 신설)
      #
      # 이 배관은 매일 도는 예약인데 실패 알림이 없었다 — 전수 검사가 경고로 잡고 있었다.
      # 캐시가 안 차면 곡선이 다시 API 를 두드리고, 그러면 09-02 의 한도 사고가 되풀이된다.
      # **성공은 말하지 않는다** — 매일 오는 알림은 읽지 않게 되고, 그러면 진짜 실패도 안 읽힌다.
      - name: 실패하면 말한다
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          TAIL=$(tail -12 "$RUNNER_TEMP/bf.log" 2>/dev/null || echo "(로그 없음)")
          MSG=$(printf '⛔ 「구 × 월」 캐시 백필 실패\n\n캐시가 안 차면 곡선이 다시 국토부를 두드립니다.\n\n%s' "$TAIL")
          node scripts/notify-telegram.mjs "$MSG"

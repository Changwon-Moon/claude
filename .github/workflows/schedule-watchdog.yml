name: 예약 파수꾼 (안 뜬 예약을 찾는다)

# ── 무엇을 하나 (2026-08-27 오너 "오늘 왜 신고가 안돌지? 메시지가 안오네?")
#
# **예약 런이 아예 안 생긴 것**을 찾아 말한다. 신고가는 대신 띄운다.
#
# ── 왜 필요한가 — 2026-08-27 아침에 드러난 구멍
# 그날 07시 신고가 톡이 안 왔다. 실패한 게 아니라 **실행 자체가 안 생겼다.**
# GitHub Actions 장애(8/26~27, "up to 4% of runs failed to trigger")가
# 21:00~22:10 UTC 창을 덮었고, **그 창에 있는 일일 예약이 통째로 사라졌다**:
#   관제탑 배포(21:00) · 데이터 수집(21:30) · 파이프라인(22:00) ·
#   소재 보드(22:00) · **오늘의 신고가(22:00)**
# 반면 `17 */2` · `37 */2` 처럼 **odd 분·다른 시각**의 예약은 멀쩡히 돌았다.
#
# 🔴 그런데 아무도 그걸 몰랐다. **우리 감시는 전부 런 "안"에 있다** —
#    빌더 종료코드, 검수, 실패 톡, `data/*-last.md`. 런이 안 생기면 **말할 입이 없다.**
#    실패는 시끄럽고 **부재는 조용하다.** 조용한 쪽이 더 위험하다.
#
# ── 그래서 이 워크플로는 밖에 선다
# 매시 **23분**(정각을 피한다 — 정각이 가장 붐비고, 이번에 죽은 것도 정각 무리다)에
# Actions API 로 「마지막 예약 런이 언제였나」를 묻는다. 26시간 넘게 없으면 말한다.
#
# ⚠️ 26시간인 이유: 일일 예약은 24시간마다 온다. GitHub 예약은 늦게 뜨는 것이 정상이라
#    (실측 최대 40분) 여유를 둔다. 25시간이면 늦은 날마다 거짓 경보가 난다.
# ⚠️ **신고가만 대신 띄운다.** 오너가 매일 읽는 것이고, 하루를 놓치면 그날 소식이
#    그날 안 온다. 나머지는 **말만 한다** — 대신 눌러야 할지는 사람이 정한다.
# ⚠️ 파수꾼이 띄운 런에는 **재시도 사다리가 안 붙는다**(사다리는 「오늘의 신고가」
#    워크플로의 실패를 보고 뜨는데 파수꾼 런은 파수꾼 워크플로의 런이다).
#    그래서 그 런의 톡에 그 사실을 적는다. 다음 시각에 파수꾼이 다시 본다.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

# ⚠️ `contents: write` 가 필요하다 — 이 파수꾼 자신은 아무것도 커밋하지 않지만,
#    아래에서 **부르는** 신고가 워크플로가 결과를 커밋한다. 불려 가는 워크플로의 권한은
#    **부르는 쪽의 권한을 넘을 수 없다.** `contents: read` 로 뒀더니 런이 잡 하나 없이
#    `startup_failure` 로 죽었다(2026-08-27 실측) — 스텝이 안 생기니 로그도 없다.
#    `actions: read` 는 「마지막 예약 런이 언제였나」를 API 로 묻는 데 쓴다.
permissions:
  contents: write
  actions: read

concurrency:
  group: schedule-watchdog
  cancel-in-progress: false

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      singo_stale: ${{ steps.singo.outputs.stale }}
    steps:
      - uses: actions/checkout@v4

      - name: 오늘 신고가가 돌았나 (증거 파일로 본다)
        id: singo
        shell: bash
        run: |
          # ⚠️ **API 로 「마지막 예약 런」을 보면 안 된다** (2026-08-27 실측).
          #    파수꾼이 대신 띄운 런은 `singo-daily.yml` 의 런이 아니라 **파수꾼 워크플로의
          #    런**이라 그 목록에 안 뜬다. 그래서 API 로 재면 파수꾼이 매시간 다시 띄운다.
          #    옳은 열쇠는 **그 런이 남긴 증거**다 — 누가 띄웠든 여기에 오늘 날짜가 찍힌다.
          TODAY=$(TZ=Asia/Seoul date +%F)
          HOUR=$(TZ=Asia/Seoul date +%H)
          LAST=$(sed -n 's/^- 실행: \([0-9-]\{10\}\).*/\1/p' data/singo-last.md 2>/dev/null | head -1)
          echo "오늘(KST) $TODAY ${HOUR}시 · 마지막 실행 기록 ${LAST:-(없음)}"
          # 예약은 07:00 KST 다. 늦게 뜨는 것이 정상이라(실측 최대 40분) **08:30 까지 기다린다.**
          # 그 전에는 「아직 안 왔다」와 「안 뜬다」를 구분할 수 없다.
          if [ "$LAST" = "$TODAY" ]; then
            echo "stale=0" >> "$GITHUB_OUTPUT"; echo "· 오늘 이미 돌았습니다"
          elif [ "$HOUR" -lt 8 ]; then
            echo "stale=0" >> "$GITHUB_OUTPUT"; echo "· 아직 08시 전 — 기다립니다"
          else
            echo "stale=1" >> "$GITHUB_OUTPUT"; echo "⚠️ 오늘 신고가가 안 돌았습니다"
          fi

      - name: 다른 일일 예약도 살핀다 (말만 한다)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 지켜보는 것 — `파일|이름|최대공백분`
          # ⚠️ **분**으로 잰다. 시간 단위로 자르면 26시간 22분이 「26」이 되어 문턱을 못 넘는다
          #    (2026-08-27 첫 실행이 정확히 그래서 조용히 넘어갔다).
          # ⚠️ 데이터 수집은 **평일(1-5)만** 돈다 — 주말을 끼면 최대 74시간이 정상이다.
          #    같은 잣대로 재면 월요일 아침마다 거짓 경보가 난다.
          # `파일|이름|최대공백분|이벤트`
          # ⚠️ 관제탑 배포는 **푸시로도 돈다.** 예약 런만 세면 "예약이 안 떴다"고 매시간
          #    보채는데, 실제로는 방금 푸시로 배포됐을 수 있다(2026-08-27 실측).
          #    **그 일이 됐는지**를 물어야지 **어느 문으로 들어왔는지**를 물으면 안 된다.
          #    그래서 배포는 이벤트를 안 가린다(`any`).
          # ⚠️ **텔레그램이 오는 배관을 먼저 넣는다** (2026-08-27 추가).
          #    첫 판에는 청약홈이 빠져 있었다 — 그런데 오너가 그날 처음 물은 것이
          #    "오늘 청약 메시지를 못 받았어"였다. 오너가 **매일 눈으로 기다리는 알림**이
          #    감시 밖에 있으면, 안 온 날 물어보는 사람이 오너가 된다.
          #    청약홈(11:04) · 1000세대 명부(10:20) · 최고가 인덱스(11:40) 셋 다 톡이 온다.
          #
          # ⚠️ 이 셋은 `schedule` 이 아니라 **`any`** 로 잰다. 08-27 에 청약홈 예약이 또 안 떠서
          #    세션이 대기열로 대신 돌렸는데, `schedule` 로 재면 **톡이 이미 갔는데도**
          #    파수꾼이 "예약이 안 떴다"고 계속 보챈다. 관제탑 배포에서 이미 배운 것이다 —
          #    **그 일이 됐는지**를 물어야지 **어느 문으로 들어왔는지**를 물으면 안 된다.
          # ⚠️ 1620 → **1530분**(25.5시간). 청약홈은 11:04 예약이라 실제 도착이 12시 안팎인데,
          #    1620(27시간)이면 오늘 안 온 것을 **다음 날 15시**에야 말한다 — 매일 오는 알림에
          #    하루 늦은 경보는 없는 것과 같다.
          WATCH="tower-deploy.yml|관제탑 배포|1530|any
          collect.yml|데이터 수집|4440|schedule
          research-digest.yml|소재 보드 수집|1530|schedule
          pipeline-tick.yml|파이프라인 진행|1530|schedule
          applyhome-collect.yml|청약홈 수집|1530|any
          apt-universe.yml|1000세대 명부|1530|any
          molit-peak-backfill.yml|최고가 인덱스|1530|any"
          NOW=$(date -u +%s)
          STALE=""
          while IFS='|' read -r FILE NAME MAXM EVT; do
            [ -z "$FILE" ] && continue
            FILE=$(echo "$FILE" | tr -d ' '); MAXM=$(echo "$MAXM" | tr -d ' '); EVT=$(echo "$EVT" | tr -d ' ')
            Q=""; [ "$EVT" != "any" ] && Q="event=${EVT}&"
            LAST=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${FILE}/runs?${Q}per_page=1" \
                     --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || true)
            if [ -z "$LAST" ]; then echo "· ${NAME} — 예약 런 기록이 없습니다(건너뜁니다)"; continue; fi
            AGE=$(( (NOW - $(date -u -d "$LAST" +%s)) / 60 ))
            echo "· ${NAME} — 마지막 예약 ${LAST} (${AGE}분 전 / 한계 ${MAXM})"
            if [ "$AGE" -gt "$MAXM" ]; then
              STALE="${STALE}"$'\n'"· ${NAME} — $((AGE/60))시간째 예약이 안 떴습니다"
            fi
          done <<< "$WATCH"
          {
            echo "stale<<EOF"
            echo "$STALE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 말한다
        if: steps.check.outputs.stale != '' || steps.singo.outputs.stale == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ steps.singo.outputs.stale }}" = "1" ]; then
            EXTRA=$'\n\n신고가는 파수꾼이 지금 대신 돌립니다 — 잠시 뒤 목록이 옵니다.'
          fi
          HEAD="🐕 예약이 안 떴습니다 (GitHub Actions 쪽 문제입니다)"
          SINGO=""
          if [ "${{ steps.singo.outputs.stale }}" = "1" ]; then
            SINGO=$'\n'"· 오늘의 신고가 — 07시 예약이 안 떴습니다"
          fi
          node scripts/notify-telegram.mjs "${HEAD}${SINGO}${{ steps.check.outputs.stale }}${EXTRA}"

  # ── 신고가만 대신 띄운다. 나머지는 말만 한다(사람이 정한다).
  singo:
    needs: look
    if: needs.look.outputs.singo_stale == '1'
    uses: ./.github/workflows/singo-daily.yml
    with:
      watchdog: true
    secrets: inherit

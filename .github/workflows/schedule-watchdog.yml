name: 예약 파수꾼 (안 뜬 예약을 찾는다)

# ── 무엇을 하나 (2026-08-27 오너 "오늘 왜 신고가 안돌지? 메시지가 안오네?")
#
# **예약 런이 아예 안 생긴 것**을 찾아 말한다. 신고가는 대신 띄운다.
#
# ── 왜 필요한가 — 2026-08-27 아침에 드러난 구멍
# 그날 07시 신고가 톡이 안 왔다. 실패한 게 아니라 **실행 자체가 안 생겼다.**
# GitHub Actions 장애(8/26~27, "up to 4% of runs failed to trigger")가
# 21:00~22:10 UTC 창을 덮었고, **그 창에 있는 일일 예약이 통째로 사라졌다**:
#   관제탑 배포(21:00) · 데이터 수집(21:30) · 파이프라인(22:00) ·
#   소재 보드(22:00) · **오늘의 신고가(22:00)**
# 반면 `17 */2` · `37 */2` 처럼 **odd 분·다른 시각**의 예약은 멀쩡히 돌았다.
#
# 🔴 그런데 아무도 그걸 몰랐다. **우리 감시는 전부 런 "안"에 있다** —
#    빌더 종료코드, 검수, 실패 톡, `data/*-last.md`. 런이 안 생기면 **말할 입이 없다.**
#    실패는 시끄럽고 **부재는 조용하다.** 조용한 쪽이 더 위험하다.
#
# ── 그래서 이 워크플로는 밖에 선다
# 매시 **23분**(정각을 피한다 — 정각이 가장 붐비고, 이번에 죽은 것도 정각 무리다)에
# Actions API 로 「마지막 예약 런이 언제였나」를 묻는다. 26시간 넘게 없으면 말한다.
#
# ⚠️ 26시간인 이유: 일일 예약은 24시간마다 온다. GitHub 예약은 늦게 뜨는 것이 정상이라
#    (실측 최대 40분) 여유를 둔다. 25시간이면 늦은 날마다 거짓 경보가 난다.
# ⚠️ **신고가만 대신 띄운다.** 오너가 매일 읽는 것이고, 하루를 놓치면 그날 소식이
#    그날 안 온다. 나머지는 **말만 한다** — 대신 눌러야 할지는 사람이 정한다.
# ⚠️ 파수꾼이 띄운 런에는 **재시도 사다리가 안 붙는다**(사다리는 「오늘의 신고가」
#    워크플로의 실패를 보고 뜨는데 파수꾼 런은 파수꾼 워크플로의 런이다).
#    그래서 그 런의 톡에 그 사실을 적는다. 다음 시각에 파수꾼이 다시 본다.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: schedule-watchdog
  cancel-in-progress: false

jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      singo_stale: ${{ steps.check.outputs.singo_stale }}
    steps:
      - uses: actions/checkout@v4

      - name: 마지막 예약 런을 묻는다
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 지켜보는 것 — 하루에 한 번 도는 예약들. `파일|이름|최대공백시간`
          WATCH="singo-daily.yml|오늘의 신고가|26
          tower-deploy.yml|관제탑 배포|26
          collect.yml|데이터 수집|74
          research-digest.yml|소재 보드 수집|26
          pipeline-tick.yml|파이프라인 진행|26"
          # ⚠️ 데이터 수집은 **평일(1-5)만** 돈다 — 주말을 끼면 최대 74시간이 정상이다.
          #    같은 잣대로 재면 월요일 아침마다 거짓 경보가 난다.
          NOW=$(date -u +%s)
          STALE=""
          SINGO=0
          while IFS='|' read -r FILE NAME MAXH; do
            [ -z "$FILE" ] && continue
            FILE=$(echo "$FILE" | tr -d ' ')
            LAST=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${FILE}/runs?event=schedule&per_page=1" \
                     --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || true)
            if [ -z "$LAST" ]; then
              echo "· ${NAME} — 예약 런 기록이 아예 없습니다(건너뜁니다)"
              continue
            fi
            AGE=$(( (NOW - $(date -u -d "$LAST" +%s)) / 3600 ))
            echo "· ${NAME} — 마지막 예약 ${LAST} (${AGE}시간 전 / 한계 ${MAXH})"
            if [ "$AGE" -gt "$MAXH" ]; then
              STALE="${STALE}"$'\n'"· ${NAME} — ${AGE}시간째 예약이 안 떴습니다"
              case "$FILE" in singo-daily.yml) SINGO=1;; esac
            fi
          done <<< "$WATCH"
          echo "singo_stale=$SINGO" >> "$GITHUB_OUTPUT"
          {
            echo "stale<<EOF"
            echo "$STALE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 말한다
        if: steps.check.outputs.stale != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ steps.check.outputs.singo_stale }}" = "1" ]; then
            EXTRA=$'\n\n신고가는 파수꾼이 지금 대신 돌립니다 — 잠시 뒤 목록이 옵니다.'
          fi
          node scripts/notify-telegram.mjs "🐕 예약이 안 떴습니다 (GitHub Actions 쪽 문제입니다)${{ steps.check.outputs.stale }}${EXTRA}"

  # ── 신고가만 대신 띄운다. 나머지는 말만 한다(사람이 정한다).
  singo:
    needs: look
    if: needs.look.outputs.singo_stale == '1'
    uses: ./.github/workflows/singo-daily.yml
    with:
      watchdog: true
    secrets: inherit

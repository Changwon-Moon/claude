name: 텔레그램 한 통 보내기

# ── 왜 있나 (2026-08-12)
# 세션은 텔레그램 토큰을 쥐고 있지 않다(GitHub Secrets 안에 있고, 거기서만 쓴다).
# 그래서 "지금 한 통만 보내달라"는 요청을 받으면 보낼 길이 없었다.
#
# 이 워크플로가 그 길이다: `data/notify-once.txt` 에 보낼 내용을 적어 푸시하면
# **그 파일 내용을 그대로** 한 번 보낸다. 정기물이 아니라 **1회용 손잡이**다.
#
# ⚠️ 내용을 만드는 것과 보내는 것은 다른 일이다. 수치가 들어가는 문구는
#    반드시 코드가 만든 것(예: `collect-singo-preview`)을 넣는다 — 사람이 옮겨 적지 않는다.
on:
  push:
    paths:
      - "data/notify-once.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-once

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 보내기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(cat data/notify-once.txt 2>/dev/null || true)
          if [ -z "$MSG" ]; then
            echo "data/notify-once.txt 가 비어 있습니다 — 보낼 것이 없습니다"
            exit 0
          fi
          node scripts/notify-telegram.mjs "$MSG"

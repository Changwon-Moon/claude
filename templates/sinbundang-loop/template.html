<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!--WIRIT_SHARED_CSS-->
    <style>
      /* sinbundang-loop@1 — 노선 2열 접이(U자) + 환승뱃지 + 편집형(역명/단지/세대·년식 3줄 + 측면 시세). */
      .slp-head { padding: 0 2px; margin-top: 34px; }
      .slp .wirit-title { font-size: 72px; line-height: 1.04; margin: 0; white-space: nowrap; }
      .slp .wirit-title .ln { color: #d4003b; }
      .slp-stage { position: relative; width: 100%; height: 940px; margin: 74px 0 0; }
      .slp-svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

      .slp-card { position: absolute; z-index: 2; display: flex; align-items: center; gap: 9px; }
      .slp-card.r { flex-direction: row; justify-content: space-between; }
      .slp-card.l { flex-direction: row-reverse; justify-content: space-between; }
      /* 단지 카드 음영은 시세 히트맵(빌더가 inline background 로 농도 지정) */
      .slp-card.rb { border-radius: 13px; padding: 6px 7px; }
      /* 이름만 역: 라벨을 레일(역) 쪽으로 붙인다 */
      .slp-card.no { justify-content: flex-end; }

      /* 텍스트 블록: 역명 / 단지 / (세대·년식) — 레일 쪽 붉은 괘선 */
      .slp-txt { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
      .slp-card.r .slp-txt { align-items: flex-start; text-align: left; border-left: 4px solid #d4003b; padding-left: 13px; }
      .slp-card.l .slp-txt { align-items: flex-end; text-align: right; border-right: 4px solid #d4003b; padding-right: 13px; }
      .slp-stnrow { display: inline-flex; align-items: center; gap: 6px; }
      .slp-stn { font-size: 19px; font-weight: 800; color: #d4003b; letter-spacing: 0.01em; line-height: 1.15; }
      /* 행정구역(구) 칩 */
      .slp-gu { font-size: 13px; font-weight: 800; color: #fff; padding: 1px 7px; border-radius: 6px; letter-spacing: -0.02em; line-height: 1.35; }
      /* 최고가 강조 칩 */
      .slp-top { font-size: 13px; font-weight: 800; color: #fff; background: #d4003b; padding: 1px 7px; border-radius: 6px; line-height: 1.35; }
      .slp-danji { font-size: 21px; font-weight: 800; color: var(--wirit-ink); letter-spacing: -0.045em; line-height: 1.15;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 172px; }
      .slp-meta { font-size: 14px; font-weight: 600; color: #8a97a6; letter-spacing: -0.02em; line-height: 1.15;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 172px; }
      /* 측면 시세 — 좌우 공간 활용, 잉크 큰 숫자. 레일(역 원) 쪽으로 살짝 여백 */
      .slp-priceB { font-family: var(--font-num); font-size: 32px; font-weight: 900; color: var(--wirit-ink); line-height: 1; white-space: nowrap; flex: 0 0 auto; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
      .slp-priceB.top { color: #d4003b; }
      .slp-card.r .slp-priceB { margin-right: 6px; }
      .slp-card.l .slp-priceB { margin-left: 6px; }
      .slp-priceB .u { font-size: 18px; font-weight: 800; color: #7a8494; margin-left: 2px; }

      .slp-name { font-size: 24px; font-weight: 700; color: var(--wirit-gray); letter-spacing: -0.01em; padding: 0 15px; }
    </style>
  </head>
  <body>
    <div class="wirit-card slp">
      <div class="wirit-topcap">{{#if subtitle}}<span>{{subtitle}}</span>{{/if}}</div>
      <div class="slp-head"><h1 class="wirit-title">{{{title}}}</h1></div>

      <div class="slp-stage">
        {{{svg}}}
        {{#each cards}}
        <div class="slp-card {{this.align}} {{#if this.rep}}rb{{else}}no{{/if}}" style="{{{this.style}}}">
          {{#if this.rep}}
          <div class="slp-txt">
            <span class="slp-stnrow"><span class="slp-stn">{{this.name}}</span><span class="slp-gu" style="background:{{this.guc}}">{{this.gu}}</span>{{#if this.top}}<span class="slp-top">최고가</span>{{/if}}</span>
            <span class="slp-danji">{{this.danji}}</span>
            <span class="slp-meta">{{this.meta}}</span>
          </div>
          <div class="slp-priceB{{#if this.top}} top{{/if}}">{{this.pr}}<span class="u">억</span></div>
          {{else}}
          <span class="slp-stnrow"><span class="slp-name">{{this.name}}</span><span class="slp-gu" style="background:{{this.guc}}">{{this.gu}}</span></span>
          {{/if}}
        </div>
        {{/each}}
      </div>

      <div class="wirit-footer">
        <span>{{#if source.name}}출처 · {{source.name}}{{/if}}</span>
        <span class="wirit-watermark">@wirit_note<span class="dot">.</span></span>
      </div>
    </div>

    <script>
      /* 제목은 항상 폭을 꽉 채운다(fitTitle). */
      window.__wiritFit = function () {
        var el = document.querySelector(".slp .wirit-title");
        if (!el) return;
        var avail = el.parentElement.clientWidth;
        if (!avail) return;
        var hi = 120, lo = 34, best = lo;
        el.style.fontSize = hi + "px";
        if (el.scrollWidth <= avail) { best = hi; }
        else { for (var i=0;i<24;i++){ var mid=(lo+hi)/2; el.style.fontSize=mid+"px";
          if (el.scrollWidth<=avail){best=mid;lo=mid;} else {hi=mid;} } }
        el.style.fontSize = best.toFixed(2) + "px";
      };
      window.__wiritFit();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(window.__wiritFit);
    </script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!--WIRIT_SHARED_CSS-->
    <style>
      /* insight-points@1 — 인사이트·체크포인트·마무리 장(번호 포인트 + CTA). 본문 톤(페이퍼·잉크·코발트). */
      .ip {
        padding-top: 52px;
      }
      .ip-head {
        padding: 0 8px;
        margin-top: 8px;
      }
      .ip .wirit-title {
        font-size: 68px;
        line-height: 1.08;
        text-align: center;
        white-space: nowrap;
        margin: 0;
      }
      .ip-points {
        margin: 34px 0 22px;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
      }
      .ip-pt {
        display: grid;
        grid-template-columns: 88px 1fr;
        align-items: center;
        gap: 24px;
        background: var(--wirit-ink-06);
        border-radius: 22px;
        padding: 28px 32px;
      }
      .ip-n {
        width: 74px;
        height: 74px;
        border-radius: 50%;
        background: var(--wirit-cobalt);
        color: #fff;
        font-family: var(--font-num);
        font-weight: 900;
        font-size: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ip-tx {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .ip-tx b {
        font-size: 38px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--wirit-ink);
      }
      .ip-tx span {
        font-size: 28px;
        font-weight: 600;
        color: var(--wirit-gray);
        line-height: 1.28;
      }
      .ip-tx b em {
        font-style: normal;
        color: var(--wirit-cobalt);
      }
      .ip-cta {
        background: var(--wirit-ink);
        border-radius: 24px;
        padding: 30px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .ip-cta-note {
        font-size: 23px;
        font-weight: 600;
        color: #97a3b2;
        text-align: center;
        line-height: 1.4;
      }
      .ip-cta-main {
        font-size: 48px;
        font-weight: 900;
        color: #fff;
        letter-spacing: -0.02em;
      }
      .ip-cta-main .dot {
        color: var(--wirit-cobalt);
      }
    </style>
  </head>
  <body>
    <div class="wirit-card ip">
      <div class="wirit-topcap">{{#if subtitle}}<span>{{subtitle}}</span>{{/if}}</div>
      <div class="ip-head"><h1 class="wirit-title">{{title}}</h1></div>

      <div class="ip-points">
        {{#each points}}
        <div class="ip-pt">
          <span class="ip-n">{{this.n}}</span>
          <div class="ip-tx"><b>{{{this.head}}}</b><span>{{this.body}}</span></div>
        </div>
        {{/each}}
      </div>

      <div class="ip-cta">
        {{#if note}}<div class="ip-cta-note">{{note}}</div>{{/if}}
        <div class="ip-cta-main">＋ 팔로우 @wirit_note<span class="dot">.</span></div>
      </div>

      <div class="wirit-footer">
        <span>출처 · {{source.name}}{{#if source.asOf}} · {{source.asOf}} 기준{{/if}}</span>
        <span class="wirit-watermark">@wirit_note<span class="dot">.</span></span>
      </div>
    </div>
  </body>
</html>

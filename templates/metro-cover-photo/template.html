<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!--WIRIT_SHARED_CSS-->
    <style>
      /* metro-cover-photo@1 — 캐러셀 후킹 커버(실사진 풀블리드 + 후킹 문구 + 극단 대비) */
      .cvr {
        --mono: 66px;
        position: relative;
        padding: 0;
        overflow: hidden;
      }
      .cvr-bg {
        position: absolute;
        inset: 0;
      }
      .cvr-bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cvr-grad {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(9, 13, 20, 0.74) 0%,
          rgba(9, 13, 20, 0.28) 34%,
          rgba(9, 13, 20, 0.4) 56%,
          rgba(9, 13, 20, 0.88) 100%
        );
      }
      .cvr-inner {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 74px 60px 52px;
        color: #fff;
      }
      .cvr-cap {
        font-size: 30px;
        font-weight: 700;
        color: #e2e9f0;
        letter-spacing: -0.01em;
      }
      .cvr-hook {
        font-family: var(--font-sans);
        font-weight: 900;
        font-size: 86px;
        line-height: 1.14;
        margin: 20px 0 0;
        letter-spacing: -0.02em;
        white-space: pre-line;
        text-shadow: 0 3px 20px rgba(0, 0, 0, 0.55);
      }
      .cvr-hook .pt {
        color: #ffd24a;
      }
      .cvr-ex {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .cvr-row {
        display: flex;
        align-items: center;
        gap: 18px;
        background: rgba(255, 255, 255, 0.13);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 20px;
        padding: 16px 22px;
      }
      .cvr-row .s {
        font-size: 37px;
        font-weight: 800;
        flex: 1;
        white-space: nowrap;
        letter-spacing: -0.02em;
      }
      .cvr-row .v {
        font-family: var(--font-num);
        font-size: 50px;
        font-weight: 900;
        white-space: nowrap;
      }
      .cvr-row .v i {
        font-size: 25px;
        font-style: normal;
        font-weight: 700;
        margin-left: 4px;
        opacity: 0.85;
      }
      .cvr-row .tag {
        font-size: 29px;
        font-weight: 800;
        white-space: nowrap;
      }
      .cvr-row.fast .v {
        color: #8ab4ff;
      }
      .cvr-row.slow .v {
        color: #ff8f8f;
      }
      .cvr-q {
        background: #6b7482;
      }
      .cvr-cta {
        margin-top: 4px;
        text-align: center;
        font-size: 31px;
        font-weight: 800;
        color: #ffd24a;
        letter-spacing: -0.01em;
      }
      /* 기본: 하단 잉크 바(본문 푸터와 통일) — 사진 커버 표준 */
      .cvr-src {
        margin: 22px -60px -52px;
        padding: 28px 60px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 22px;
        color: #aeb8c4;
        background: var(--wirit-ink);
      }
      /* 시안: 하단 푸터 바 흰색 버전 */
      .cvr.st-white .cvr-src {
        background: #fff;
      }
      .cvr.st-white .cvr-src .wm {
        color: var(--wirit-ink);
      }
      .cvr-src .ph {
        display: block;
        font-size: 17px;
        color: #8b96a3;
        margin-top: 3px;
      }
      .cvr-src .wm {
        font-weight: 800;
        color: #fff;
        font-size: 30px;
      }
      /* 기본: 코너 뱃지 흰 반전(어두운 사진에서 wirit 각인) — 사진 커버 표준 */
      .cvr .wirit-corner {
        background: #fff;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      }
      .cvr .wirit-corner .mark {
        color: var(--wirit-ink);
      }

      /* 노선 뱃지(metroBadge) — 커버용, 살짝 크게 */
      .rt-line {
        width: var(--mono);
        height: var(--mono);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: var(--font-sans);
        font-weight: 800;
        line-height: 0.94;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      }
      .rt-line.ln-white {
        color: #fff;
      }
      .rt-line.ln-white .num,
      .rt-line.ln-white .nm,
      .rt-line.ln-white .gtx {
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
      }
      .rt-line.ln-dark {
        color: #1c2431;
      }
      .rt-line .num {
        font-size: calc(var(--mono) * 0.58);
        font-weight: 900;
      }
      .rt-line .nm {
        font-size: calc(var(--mono) * 0.3);
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      .rt-line .nm.two {
        font-size: calc(var(--mono) * 0.28);
        line-height: 1;
      }
      .rt-line .gtx {
        display: flex;
        flex-direction: column;
        line-height: 0.86;
      }
      .rt-line .gtx i {
        font-style: italic;
        font-weight: 900;
        font-size: calc(var(--mono) * 0.24);
      }
      .rt-line .gtx b {
        font-size: calc(var(--mono) * 0.32);
      }
      /* ── 아이덴티티 시안 ── */
      /* 시안1: 하단 잉크 바(본문 톤 통일) + 코너 뱃지 흰 테두리 */
      .cvr.st-bar .cvr-src {
        margin: 22px -60px -52px;
        padding: 30px 60px;
        background: var(--wirit-ink);
        color: #aeb8c4;
        align-items: center;
      }
      .cvr.st-bar .cvr-src .wm {
        font-size: 30px;
      }
      .cvr.st-bar .wirit-corner {
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.92);
      }
      /* 시안2: 코너 뱃지 흰색 반전(강한 대비) */
      .cvr.st-invert .wirit-corner {
        background: #fff;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      }
      .cvr.st-invert .wirit-corner .mark {
        color: var(--wirit-ink);
      }
      /* 시안3: 원형 대형 wirit 엠블럼(흰 원) */
      .cvr.st-ring .wirit-corner {
        border-radius: 50%;
        width: 118px;
        height: 118px;
        padding: 0;
        justify-content: center;
        background: #fff;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }
      .cvr.st-ring .wirit-corner .mark {
        color: var(--wirit-ink);
        font-size: 30px;
      }
    </style>
  </head>
  <body>
    <div class="wirit-card cvr {{#if coverStyle}}st-{{coverStyle}}{{/if}}">
      <div class="cvr-bg"><img src="../_shared/photos/{{photo}}" alt="" /></div>
      <div class="cvr-grad"></div>
      <div class="cvr-inner">
        <h1 class="cvr-hook">{{{hook}}}</h1>
        <div class="cvr-ex">
          <div class="cvr-row fast">
            {{#if top.line}}{{{metroBadge top.line}}}{{else}}<span class="rt-line ln-white cvr-q"><span class="num">?</span></span>{{/if}}
            <span class="s">{{top.seg}}</span>
            <span class="v">{{top.value}}<i>km/h</i></span>
            <span class="tag">🚀 {{top.tag}}</span>
          </div>
          <div class="cvr-row slow">
            {{#if bottom.line}}{{{metroBadge bottom.line}}}{{else}}<span class="rt-line ln-white cvr-q"><span class="num">?</span></span>{{/if}}
            <span class="s">{{bottom.seg}}</span>
            <span class="v">{{bottom.value}}<i>km/h</i></span>
            <span class="tag">🐢 {{bottom.tag}}</span>
          </div>
          {{#if cta}}<div class="cvr-cta">{{cta}}</div>{{/if}}
          <div class="cvr-src">
            <span class="wm">@wirit_note</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

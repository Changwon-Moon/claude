<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!--WIRIT_SHARED_CSS-->
    <style>
      /* metro-p3@1 — 캐러셀 마무리 장(요약 + 팔로우 유도). 본문 톤(페이퍼·잉크·코발트) 유지. */
      .p3-head {
        padding: 0 8px;
        margin-top: 40px;
      }
      .p3 .wirit-title {
        font-size: 66px;
        line-height: 1.08;
        text-align: center;
        white-space: nowrap;
        margin: 0;
      }
      .p3-points {
        margin: 40px 0 26px;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 22px;
      }
      .p3-pt {
        display: grid;
        grid-template-columns: 92px 1fr;
        align-items: center;
        gap: 26px;
        background: var(--wirit-ink-06);
        border-radius: 22px;
        padding: 30px 34px;
      }
      .p3-n {
        width: 78px;
        height: 78px;
        border-radius: 50%;
        background: var(--wirit-cobalt);
        color: #fff;
        font-family: var(--font-num);
        font-weight: 900;
        font-size: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .p3-tx {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .p3-tx b {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--wirit-ink);
      }
      .p3-tx span {
        font-size: 29px;
        font-weight: 600;
        color: var(--wirit-gray);
        line-height: 1.25;
      }
      .p3-tx b em {
        font-style: normal;
        color: var(--wirit-cobalt);
      }
      .p3-cta {
        background: var(--wirit-ink);
        border-radius: 24px;
        padding: 34px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .p3-cta-main {
        font-size: 34px;
        font-weight: 700;
        color: #c9d3df;
      }
      .p3-cta-sub {
        font-size: 52px;
        font-weight: 900;
        color: #fff;
        letter-spacing: -0.02em;
      }
      .p3-cta-sub .dot {
        color: var(--wirit-cobalt);
      }
    </style>
  </head>
  <body>
    <div class="wirit-card p3">
      <div class="wirit-topcap">{{#if subtitle}}<span>{{subtitle}}</span>{{/if}}</div>
      <div class="p3-head"><h1 class="wirit-title">{{title}}</h1></div>

      <div class="p3-points">
        {{#each points}}
        <div class="p3-pt">
          <span class="p3-n">{{this.n}}</span>
          <div class="p3-tx"><b>{{{this.head}}}</b><span>{{this.body}}</span></div>
        </div>
        {{/each}}
      </div>

      <div class="p3-cta">
        <div class="p3-cta-main">{{cta}}</div>
        <div class="p3-cta-sub">＋ 팔로우 @wirit_note<span class="dot">.</span></div>
      </div>

      <div class="wirit-footer">
        <span>출처 · {{source.name}}{{#if source.asOf}} · {{source.asOf}} 기준{{/if}}</span>
        <span class="wirit-watermark">@wirit_note<span class="dot">.</span></span>
      </div>
    </div>
  </body>
</html>

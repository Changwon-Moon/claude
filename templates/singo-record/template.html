<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!--WIRIT_SHARED_CSS-->
    <style>
      /* =========================================================
         singo-record@1 — 오늘의 신고가, 단지 한 곳 (2026-08-13)

         무엇을 그리나: **한 단지·한 타입이 기준선 이후 최고가를 새로 쓴 사건** 한 건.
         구조: [킥커: 계약일·지역] → [제목] → [단지 한 줄] → [실거래가 + 갱신폭]
               → [월별 최고가 곡선] → [팩트 3칸] → [기준 문구] → [푸터]

         왜 gov-bars 를 안 쓰나: 저쪽은 몇 개 구간의 **크기 비교**라 막대가 맞다.
         여기는 한 계열이 시간을 따라 올라와 **선을 넘는 순간**이 소식이라, 곡선과
         가로 점선(넘은 선)이 있어야 뜻이 산다.

         · 좌표는 전부 **빌더가 계산한다.** 템플릿은 그리기만 한다(TEMPLATES 규칙).
         · 색: 이 카드는 전부 '오름'이라 방향 색이 변별력을 잃는다(gov-bars 와 같은 문제).
           그래서 곡선·수치는 잉크 단색이고 **레드는 이번 거래 점 하나**에만 준다.
         · ⚠️ 수집을 못 한 달(ok=false)은 곡선을 **끊는다.** 이어 버리면 "그때도 이 값이었다"는
           거짓말이 된다. 빌더가 구간을 나눠 여러 개의 path 로 넘긴다.
         ========================================================= */
      .sr { display: flex; flex-direction: column; }

      /* 킥커 — 계약일과 지역. 제목이 말하지 않는 '언제·어디'를 여기서 받는다. */
      .sr-kick {
        font-family: var(--font-num); font-size: 30px; font-weight: 800;
        color: var(--wirit-gray); letter-spacing: -0.01em; white-space: nowrap;
      }

      .sr-head { padding: 0; margin: 40px 0 0; } /* 뱃지 아래 30px 확보(badgeclear) */
      /* 제목 — 이 판형의 주인공은 제목이 아니라 **가격**이다(오너 2026-08-13).
         그래서 제목은 한 줄로 낮추고, 지역은 회색으로 물러나 단지·평형만 잉크로 남긴다. */
      .sr .wirit-title {
        font-size: 84px; line-height: 1.06; text-align: left; white-space: nowrap;
        margin: 0; letter-spacing: -0.045em;
      }
      .sr .wirit-title .rg { color: var(--wirit-gray); }

      /* 주인공 줄 — 왼쪽 가격, 오른쪽 단지 제원 */
      /* 제목 바로 아래에 올 때는 28px 이상 띄운다(designQa titlegap). 역 뱃지 줄이
         사이에 끼면 그만큼 붙여도 된다 — 사이에 이미 한 줄이 있기 때문이다. */
      .sr-hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 34px; margin: 32px 0 0; }

      .sr-price {
        font-family: var(--font-num); font-size: 150px; font-weight: 900;
        color: var(--wirit-red); letter-spacing: -0.055em; line-height: 0.94; white-space: nowrap;
      }
      /* 제원 — 세대수 · 준공 · 전용 · 층. 가격 오른쪽에 두 줄로 접어 세운다.
         ⚠️ "이번 거래"·"중개거래" 같은 말은 뺐다(오너 2026-08-13) — 카드가 이미 거래 이야기다. */
      .sr-spec { text-align: right; font-family: var(--font-num); font-size: 36px; line-height: 1.32; }
      /* 줄마다 block — inline span 은 scrollWidth 가 믿을 게 못 돼 폭 맞춤이 어긋난다.
         크기는 .sr-spec 이 정하고 줄은 물려받는다(그래야 두 줄이 같은 크기로 붙는다). */
      .sr-spec .l {
        display: block; font-size: inherit; font-weight: 800; color: var(--wirit-ink);
        letter-spacing: -0.03em; white-space: nowrap;
      }
      .sr-spec .l .sep { color: var(--wirit-gray); font-weight: 700; padding: 0 6px; }

      /* ── 가까운 역 — **최상단 킥커 옆**으로 (오너 2026-08-16)
         제목 아래에 혼자 떠 있던 것을 위로 올렸다. 킥커와 같은 줄에 있으면
         '오늘 어디 소식인가'가 한 줄로 읽힌다. 우상단 로고 뱃지 자리는 침범하지 않는다. */
      .wirit-topcap { display: flex; align-items: center; gap: 16px; }
      .sr-stn {
        --mono: 34px;
        display: inline-flex; align-items: center; gap: 10px;
        padding: 5px 18px 5px 5px; border-radius: 999px;
        background: var(--wirit-ink-06); flex: 0 0 auto;
      }
      .sr-stn .nmx {
        font-family: var(--font-sans); font-size: 26px; font-weight: 800;
        color: var(--wirit-ink); letter-spacing: -0.035em; white-space: nowrap;
      }
      .sr-stn .rt-line {
        width: var(--mono); height: var(--mono); border-radius: 50%;
        display: flex; align-items: center; justify-content: center; text-align: center;
        font-family: var(--font-sans); font-weight: 800; line-height: 0.94; flex: 0 0 auto;
      }
      .sr-stn .rt-line.ln-white { color: #fff; }
      .sr-stn .rt-line.ln-dark { color: #1c2431; }
      .sr-stn .rt-line .num { font-size: calc(var(--mono) * 0.56); font-weight: 900; }
      .sr-stn .rt-line .nm { font-size: calc(var(--mono) * 0.3); font-weight: 800; letter-spacing: -0.04em; }
      .sr-stn .rt-line .nm.two { font-size: calc(var(--mono) * 0.28); line-height: 1; }
      .sr-stn .rt-line.plain { background: var(--wirit-gray); color: #fff; }

      /* ── 곡선 ─────────────────────────────────────────────
         카드 아래에 따로 있던 '지난 사이클' 블록을 여기로 들여왔다(오너 2026-08-16).
         기준선 세 줄이 이야기를 다 한다:
           · 위  = 이번에 넘은 선(라벨은 **오늘 자리**인 오른쪽 끝에)
           · 중간 = 지난 사이클 고점  + 빨강 '고점 대비 +N%'
           · 아래 = 기준선 이후 최저점 + 파랑 '저점 대비 +N%'
         색은 방향이 아니라 **무엇과 견주는가**로 고정했다 — 고점=빨강, 저점=파랑.
         곡선은 단조 3차 보간이라 두 점 사이를 벗어나지 않는다(빌더가 다시 잰다). */
      .sr-chart { flex: 1 1 auto; display: flex; align-items: center; margin: 24px 0 22px; min-height: 0; }
      .sr-svg { display: block; width: 100%; height: auto; }
      /* 판 바탕 — 아주 옅게. 진해지면 회색 덩어리가 앉은 것처럼 보인다. */
      .sr-bg { fill: var(--wirit-ink); opacity: 0.035; }
      .sr-line { fill: none; stroke: var(--wirit-ink); stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .sr-obs { fill: var(--wirit-ink); opacity: 0.45; }
      /* 이번에 넘은 선 — 진하게. 이게 이 카드의 사건이다. */
      .sr-thr { stroke: var(--wirit-ink); stroke-width: 3; stroke-dasharray: 11 9; opacity: 0.55; }
      .sr-thrlab {
        font-family: var(--font-num); font-size: 28px; font-weight: 900;
        fill: var(--wirit-ink); opacity: 0.7;
      }
      /* 기준선 두 줄 — 한 단계 물러난다. 셋이 같은 무게면 무엇이 사건인지 흐려진다. */
      .sr-base { stroke: var(--wirit-gray); stroke-width: 2.5; stroke-dasharray: 6 9; opacity: 0.9; }
      .sr-baselab { font-family: var(--font-num); font-size: 27px; }
      /* 1행 = 값(연월). 2행 = 무엇과 견줬는지 + 몇 % — 색은 그 기준이 정한다. */
      .sr-baselab .v { font-weight: 800; fill: var(--wirit-ink); }
      .sr-baselab .p { font-weight: 900; }
      .sr-baselab .p.hi { fill: var(--wirit-red); }
      .sr-baselab .p.lo { fill: var(--wirit-cobalt); }
      /* 폭 표시 직선 — 두 선 사이의 **길이가 곧 그 퍼센트**다.
         곡선 뒤에 깔아 그림의 주인공을 뺏지 않는다. */
      .sr-brk { stroke-width: 3.5; }
      .sr-brk.hi { stroke: var(--wirit-red); }
      .sr-brk.lo { stroke: var(--wirit-cobalt); }
      /* 빈 원 = 그 값이 난 달. 라벨의 숫자를 그림에서 찾게 해 준다. */
      .sr-old { fill: var(--wirit-paper); stroke: var(--wirit-ink); stroke-width: 4; }
      .sr-ax { font-family: var(--font-num); font-size: 23px; font-weight: 700; fill: var(--wirit-gray); }

    </style>
  </head>
  <body>
    <div class="wirit-card sr">
      <div class="wirit-topcap">
        {{#if kicker}}<span class="sr-kick">{{kicker}}</span>{{/if}}
        {{#if station}}
        <span class="sr-stn">
          {{#if station.lines}}{{{metroBadge station.lines.[0]}}}{{else}}<span class="rt-line plain"><span class="nm">역</span></span>{{/if}}
          <span class="nmx">{{station.name}}</span>
        </span>
        {{/if}}
      </div>
      <div class="sr-head"><h1 class="wirit-title">{{{title}}}</h1></div>

      <div class="sr-hero">
        <span class="sr-price">{{price}}</span>
        <span class="sr-spec">{{#each spec}}<span class="l">{{{this}}}</span>{{/each}}</span>
      </div>

      <div class="sr-chart">
        <svg class="sr-svg" viewBox="{{chart.vb}}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          {{#if chart.bg}}<rect class="sr-bg" x="{{chart.bg.x}}" y="{{chart.bg.y}}" width="{{chart.bg.w}}" height="{{chart.bg.h}}" rx="{{chart.bg.r}}" />{{/if}}
          {{#if chart.prevLine}}<line class="sr-base" x1="{{chart.prevLine.x1}}" y1="{{chart.prevLine.y}}" x2="{{chart.prevLine.x2}}" y2="{{chart.prevLine.y}}" />{{/if}}
          {{#if chart.lowLine}}<line class="sr-base" x1="{{chart.lowLine.x1}}" y1="{{chart.lowLine.y}}" x2="{{chart.lowLine.x2}}" y2="{{chart.lowLine.y}}" />{{/if}}
          {{#if chart.threshold}}
          <line class="sr-thr" x1="{{chart.threshold.x1}}" y1="{{chart.threshold.y}}" x2="{{chart.threshold.x2}}" y2="{{chart.threshold.y}}" />
          <text class="sr-thrlab" x="{{chart.threshold.tx}}" y="{{chart.threshold.ty}}" text-anchor="{{chart.threshold.anchor}}">{{chart.threshold.text}}</text>
          {{/if}}
          <!-- 폭 표시 직선 — 곡선 **뒤**에 깐다 -->
          {{#with chart.brkHi}}
          <g class="sr-brk {{tone}}">
            <line x1="{{x}}" y1="{{y1}}" x2="{{x}}" y2="{{y2}}" />
            <line x1="{{tickX1}}" y1="{{y1}}" x2="{{tickX2}}" y2="{{y1}}" />
            <line x1="{{tickX1}}" y1="{{y2}}" x2="{{tickX2}}" y2="{{y2}}" />
          </g>
          {{/with}}
          {{#with chart.brkLo}}
          <g class="sr-brk {{tone}}">
            <line x1="{{x}}" y1="{{y1}}" x2="{{x}}" y2="{{y2}}" />
            <line x1="{{tickX1}}" y1="{{y1}}" x2="{{tickX2}}" y2="{{y1}}" />
            <line x1="{{tickX1}}" y1="{{y2}}" x2="{{tickX2}}" y2="{{y2}}" />
          </g>
          {{/with}}
          {{#each chart.paths}}<path class="sr-line" d="{{d}}" />{{/each}}
          <!-- 실제 거래가 있던 달만 점으로 찍는다. 점 사이를 잇는 선은 **관측 사이를 이은 것**이지
               그 사이에 그 값이었다는 뜻이 아니다 — 점이 있어야 그 차이가 보인다. -->
          {{#each chart.dots}}<circle class="sr-obs" cx="{{x}}" cy="{{y}}" r="{{r}}" />{{/each}}
          {{#each chart.axis}}<text class="sr-ax" x="{{x}}" y="{{y}}" text-anchor="{{anchor}}">{{text}}</text>{{/each}}
          <!-- 기준선 라벨 2행. 종이색 테두리를 둘러 곡선 위에서도 읽히게 한다 -->
          {{#with chart.prevLine}}
          <text class="sr-baselab" x="{{tx}}" text-anchor="{{anchor}}" paint-order="stroke" stroke="#f6f6f3" stroke-width="9" stroke-linejoin="round">
            <tspan class="v" x="{{tx}}" y="{{ty1}}">{{text1}}</tspan><tspan class="p {{tone}}" x="{{tx}}" y="{{ty2}}">{{text2}}</tspan>
          </text>
          {{/with}}
          {{#with chart.lowLine}}
          <text class="sr-baselab" x="{{tx}}" text-anchor="{{anchor}}" paint-order="stroke" stroke="#f6f6f3" stroke-width="9" stroke-linejoin="round">
            <tspan class="v" x="{{tx}}" y="{{ty1}}">{{text1}}</tspan><tspan class="p {{tone}}" x="{{tx}}" y="{{ty2}}">{{text2}}</tspan>
          </text>
          {{/with}}
          {{#if chart.old}}<circle class="sr-old" cx="{{chart.old.x}}" cy="{{chart.old.y}}" r="{{chart.old.r}}" />{{/if}}
          {{#if chart.lowDot}}<circle class="sr-old" cx="{{chart.lowDot.x}}" cy="{{chart.lowDot.y}}" r="{{chart.lowDot.r}}" />{{/if}}
          {{#if chart.dot}}
          <circle cx="{{chart.dot.x}}" cy="{{chart.dot.y}}" r="{{chart.dot.rOuter}}" fill="#fafaf8" />
          <circle cx="{{chart.dot.x}}" cy="{{chart.dot.y}}" r="{{chart.dot.r}}" fill="#e5484d" />
          {{/if}}
        </svg>
      </div>

      <div class="wirit-footer">
        <span>출처 · {{source.name}}{{#if source.asOf}} · {{source.asOf}} 기준{{/if}}</span>
        <span class="wirit-watermark">@wirit_note<span class="dot">.</span></span>
      </div>
    </div>

    <script>
      /* 제목과 제원 블록을 카드 폭에 맞춘다 — 고정 크기는 태백체·긴 단지명에서 넘친다.
         ⚠️ 제원(세대수·준공·전용·층)은 단지마다 글자 수가 달라서 **반드시 재야 한다.**
            "3,432세대 | 2022년 준공(22년식)" 처럼 길어지면 가격을 밀어낸다. */
      window.__wiritFit = function () {
        var fit = function (el, box, lo, hi, measure) {
          if (!el || !box) return;
          var bs = getComputedStyle(box);
          var avail = box.clientWidth - (parseFloat(bs.paddingLeft) || 0) - (parseFloat(bs.paddingRight) || 0);
          var best = lo;
          for (var i = 0; i < 24; i++) {
            var mid = (lo + hi) / 2;
            el.style.fontSize = mid + "px";
            if (measure() <= avail) { best = mid; lo = mid; } else { hi = mid; }
          }
          el.style.fontSize = best.toFixed(2) + "px";
        };

        var title = document.querySelector(".sr .wirit-title");
        if (title) fit(title, title.parentElement, 30, 92, function () { return title.scrollWidth; });

        /* 제원은 **가격이 차지하고 남은 폭**에 맞춘다. hero 전체 scrollWidth 로 재면
           가격까지 함께 재게 되어 둘이 서로를 밀어낸다. */
        var hero = document.querySelector(".sr .sr-hero");
        var spec = document.querySelector(".sr .sr-spec");
        var price = document.querySelector(".sr .sr-price");
        if (hero && spec && price) {
          var gap = parseFloat(getComputedStyle(hero).columnGap || "34") || 34;
          var room = hero.clientWidth - price.scrollWidth - gap;
          var lo = 18, hi = 40, best = 18;
          for (var k = 0; k < 24; k++) {
            var mid = (lo + hi) / 2;
            spec.style.fontSize = mid + "px";
            var lines = spec.querySelectorAll(".l"), w = 0;
            for (var m = 0; m < lines.length; m++) w = Math.max(w, lines[m].scrollWidth);
            if (w <= room) { best = mid; lo = mid; } else { hi = mid; }
          }
          spec.style.fontSize = best.toFixed(2) + "px";
        }
      };
    </script>
  </body>
</html>

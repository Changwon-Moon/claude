<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!--WIRIT_SHARED_CSS-->
    <style>
      /* index-cover@1 — 증시 커버. 시그니처 = '1위(빨강·취소선) → 세계 꼴찌(블루·초대형)' 색 반전 타이포.
         구성: 부제목·제목은 상단, CTA는 하단 가운데(기존 커버 기준). 한국 증시 관례: 상승=빨강, 하락=파랑. */
      .icv { position: relative; padding: 0; overflow: hidden; background: #0a0e16; }
      .icv-bg { position: absolute; inset: 0; }
      .icv-bg img { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.72) brightness(0.72); }
      /* 파랑 틴트 다크 그라디언트 + 하단 비네트 → 티커는 텍스처로만 */
      .icv-grad { position: absolute; inset: 0;
        background:
          radial-gradient(130% 80% at 30% 8%, rgba(10,14,22,0.35), transparent 55%),
          linear-gradient(180deg, rgba(8,11,18,0.72) 0%, rgba(8,11,18,0.42) 34%, rgba(9,16,30,0.72) 70%, rgba(6,9,16,0.97) 100%); }
      .icv-in { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column;
        padding: 60px 60px 52px; color: #eef2f7; }

      /* 부제목 — 상단(기존 커버 기준) */
      .icv-cap { font-size: 32px; font-weight: 800; color: #cbd5e2; letter-spacing: 0.02em; }

      /* 반전 히어로 — 상단(부제목 아래). 줄간격 넉넉하게. */
      .icv-hero { margin-top: 34px; }
      .icv-setup { font-family: var(--font-sans); font-size: 48px; font-weight: 800; line-height: 1.42;
        letter-spacing: -0.02em; color: #dbe3ec; }
      .icv-setup s { color: #ff5a5f; text-decoration-thickness: 5px; text-decoration-color: rgba(255,90,95,0.85); text-underline-offset: 2px; }
      .icv-setup b { color: #fff; font-weight: 900; }

      .icv-lead { margin-top: 26px; font-family: var(--font-title); font-size: 62px; font-weight: 700;
        letter-spacing: -0.03em; color: #eef2f7; line-height: 1.08; }
      .icv-crash { display: block; margin-top: 14px; font-family: var(--font-title); font-size: 188px;
        font-weight: 800; line-height: 0.98; letter-spacing: -0.03em; color: #3d7bff; white-space: nowrap;
        text-shadow: 0 6px 34px rgba(61,123,255,0.4); }

      /* 시그니처 서포트: 급락 화살표 + 근거 한 줄 */
      .icv-under { margin-top: 28px; display: flex; align-items: center; gap: 16px; }
      .icv-under .plunge { font-size: 40px; color: #3d7bff; }
      .icv-under .fact { font-size: 26px; font-weight: 700; color: #b7c3d1; letter-spacing: -0.01em; }
      .icv-under .fact em { font-style: normal; color: #eef2f7; font-weight: 800; }
      .icv-src { margin-top: 12px; font-size: 22px; font-weight: 700; color: #8a99ab; letter-spacing: -0.01em; }

      /* CTA — 하단 가운데(기존 커버 기준) */
      .icv-cta { margin-top: auto; padding-top: 30px; text-align: center; font-size: 34px; font-weight: 800; color: #ffd24a; letter-spacing: -0.01em; }
      .icv-cta b { color: #fff; }

      .icv-foot { margin: 24px -60px -52px; padding: 30px 60px; display: flex; align-items: center; justify-content: center; background: #05070c; }
      .icv-foot .wm { font-weight: 800; color: #fff; font-size: 44px; }
      .icv-foot .wm .dot { color: #3d7bff; }

      .icv .wirit-corner { background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,0.45); }
      .icv .wirit-corner .mark { color: var(--wirit-ink); }
    </style>
  </head>
  <body>
    <div class="wirit-card icv">
      <div class="icv-bg"><img src="../_shared/photos/{{photo}}" alt="" /></div>
      <div class="icv-grad"></div>
      <div class="icv-in">
        <div class="icv-cap">{{caption}}</div>

        <div class="icv-hero">
          <div class="icv-setup">{{{setup}}}</div>
          <div class="icv-lead">{{lead}}</div>
          <div class="icv-crash">{{crash}}</div>
          <div class="icv-under">
            <span class="plunge">▼</span>
            <span class="fact">{{{fact}}}</span>
          </div>
          {{#if source}}<div class="icv-src">{{source}}</div>{{/if}}
        </div>

        {{#if cta}}<div class="icv-cta">{{{cta}}}</div>{{/if}}
        <div class="icv-foot"><span class="wm">@wirit_note<span class="dot">.</span></span></div>
      </div>
    </div>
  </body>
</html>

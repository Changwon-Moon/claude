/*
 * wirit 공통 브랜드 스타일 (base.css)
 * BRAND.md 의 잉크네이비 팔레트·규칙을 구현한다.
 * 폰트: Pretendard Variable 번들 (모든 웨이트 포함) → 머신 간 동일 렌더.
 */

@font-face {
  font-family: "Pretendard";
  font-weight: 45 920; /* Variable: 얇은~Black 전 구간 */
  font-style: normal;
  font-display: block;
  src: url("../_shared/fonts/PretendardVariable.woff2") format("woff2-variations");
}
@font-face {
  font-family: "Wanted Sans";
  font-weight: 100 900;
  font-style: normal;
  font-display: block;
  src: url("../_shared/fonts/WantedSansVariable.woff2") format("woff2-variations");
}
@font-face {
  font-family: "Black Han Sans"; /* 헤드라인 전용 디스플레이(굵고 임팩트) */
  font-weight: 400;
  font-style: normal;
  font-display: block;
  src: url("../_shared/fonts/BlackHanSans-Korean.woff2") format("woff2");
}
@font-face {
  font-family: "TAEBAEK"; /* 제목 기본 서체(운영자 지정 2026-07-23, 태백체) */
  font-weight: 100 900; /* 단일 마스터 — 전 웨이트 요청을 이 서체로 매핑(폴백 이탈 방지) */
  font-style: normal;
  font-display: block;
  /* OTF(CFF+vhea/vmtx)는 Chromium OTS가 거부 → WOFF2로 재패키징(font-convert.yml) */
  src: url("../_shared/fonts/TAEBAEK.woff2") format("woff2");
}

:root {
  --wirit-ink: #141821; /* 본문, 수치, 다크 배경 */
  --wirit-paper: #fafaf8; /* 기본 배경 */
  --wirit-cobalt: #2e6bff; /* 강조 1축 */
  --wirit-red: #e5484d; /* 상승·경고 시그널 전용 */
  --wirit-gray: #5b6b7f; /* 보조 텍스트, 비강조 */
  --wirit-ink-06: rgba(20, 24, 33, 0.06); /* 행 밴딩, 구분선 */
  --wirit-ink-12: rgba(20, 24, 33, 0.12);

  /* 폰트 후보 스택 */
  --font-pretendard: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR",
    system-ui, sans-serif;
  --font-wanted: "Wanted Sans", "Pretendard", "Apple SD Gothic Neo",
    system-ui, sans-serif;
  --font-blackhan: "Black Han Sans", "Wanted Sans", "Pretendard", sans-serif;
  --font-taebaek: "TAEBAEK", "Wanted Sans", "Pretendard", sans-serif;

  /* 확정 폰트 시스템:
     - 헤드라인(title) = 태백체 (2026-07-23 운영자 지정, 이전 Wanted Sans)
     - 숫자(num)       = Wanted Sans
     - 본문·라벨(sans) = Pretendard */
  --font-sans: var(--font-pretendard);
  --font-num: var(--font-wanted);
  --font-title: var(--font-taebaek);
}

/* ⭐ 2026-09-07 오너 확정 — **새 판형의 기본 세트**.
 * 제목만 태백체, 숫자를 포함한 나머지 전부 Pretendard(= Wanted Sans 퇴역).
 * 왜 기본값(:root)을 안 바꾸나: `--font-num` 을 갈면 확정본 51개 세트와
 *   `--font-num` 을 쓰는 판형 33개가 다시 그려질 때 픽셀이 전부 바뀐다.
 *   「발행본·확정본 픽셀 불변」(CLAUDE.md §8)에 정면으로 걸린다 →
 *   **새 스타일은 variant 로 격리**한다는 그 규칙대로 세트를 하나 더 둔다.
 * 쓰는 법: 새로 만드는 판형의 카드 루트에 `class="wirit-card font-taebaek-pretendard ..."`.
 *   옛 카드는 아무것도 안 붙이므로 자기 픽셀 그대로 남는다.
 * 로고 뱃지(`.wirit-corner .mark`)는 이 세트의 대상이 아니다 — 폰트가 아니라 CI 다. */
.font-taebaek-pretendard {
  --font-sans: var(--font-pretendard);
  --font-num: var(--font-pretendard);
  --font-title: var(--font-taebaek);
}

/* 폰트 세트 전환(실험용). 기본은 위 하이브리드. */
.font-pretendard {
  --font-sans: var(--font-pretendard);
  --font-num: var(--font-pretendard);
  --font-title: var(--font-pretendard);
}
.font-wanted {
  --font-sans: var(--font-wanted);
  --font-num: var(--font-wanted);
  --font-title: var(--font-wanted);
}
.font-wanted-blackhan {
  --font-sans: var(--font-pretendard);
  --font-num: var(--font-wanted);
  --font-title: var(--font-blackhan);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  font-family: var(--font-sans);
  background: var(--wirit-paper);
  color: var(--wirit-ink);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum" 1; /* 표 정렬용 고정폭 숫자 */
}

/* 카드 프레임: 뷰포트(config 크기)에 맞춤 — 4:5(1080×1350) 기본, 1:1(1080×1080) 등 config로 전환 */
.wirit-card {
  width: 100%;
  height: 100%;
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 72px 72px 0;
  background: var(--wirit-paper);
  font-family: var(--font-sans); /* 카드 폰트세트 전환이 하위에 전파되도록 */
}

/* 상단: 카테고리 뱃지 + 제목 */
.wirit-badge {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  gap: 8px;
  padding: 10px 20px;
  border-radius: 999px;
  background: var(--wirit-cobalt);
  color: #fff;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.01em;
}

.wirit-title {
  font-family: var(--font-title); /* 제목만 개성 폰트 적용 가능 */
  margin-top: 28px;
  font-size: 76px;
  font-weight: 900;
  line-height: 1.08;
  letter-spacing: -0.03em;
  color: var(--wirit-ink);
}

.wirit-subtitle {
  margin-top: 18px;
  font-size: 34px;
  font-weight: 600;
  color: var(--wirit-gray);
  letter-spacing: -0.01em;
}

/* 색 유틸 */
.up {
  color: var(--wirit-red);
} /* 상승·경고 (시그널 전용) */
.accent {
  color: var(--wirit-cobalt);
}
.muted {
  color: var(--wirit-gray);
}

/* 하단 고정: 출처 + 워터마크
 * margin-top:auto 로 플렉스 컬럼의 맨 아래에 고정 → 본문과 절대 겹치지 않음 */
/* 하단 바: 로고색(잉크네이비) 풀블리드 배경 + 흰색 글씨 (로고와 동일 톤)
 * 높이 1.5배(패딩 확대), 워드마크 확대 */
.wirit-footer {
  margin-top: auto;
  margin-left: -72px;
  margin-right: -72px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 34px 72px;
  font-size: 24px;
  font-weight: 600;
  background: var(--wirit-ink);
  color: #aeb8c4; /* 출처 등 보조 텍스트는 밝은 회청색 */
}

.wirit-watermark {
  font-weight: 800;
  font-size: 37px; /* 푸터 워드마크 확대 */
  color: #ffffff; /* 로고처럼 흰색 워드마크 */
}
.wirit-watermark .dot {
  color: var(--wirit-cobalt); /* 로고의 코발트 마침표 */
}

/* 우상단 로고 뱃지 (wirit.) — 네이비 둥근 사각형, 글자에 맞춘 여백. 자동 삽입(renderHtml) */
.wirit-corner {
  position: absolute;
  top: 40px;
  right: 40px;
  padding: 13px 21px;
  border-radius: 18px;
  background: var(--wirit-ink);
  display: inline-flex;
  align-items: center;
  z-index: 6;
}
.wirit-corner .mark {
  font-family: "Wanted Sans", "Pretendard", sans-serif;
  font-weight: 800;
  font-size: 36px;
  line-height: 1;
  letter-spacing: -0.03em;
  color: #ffffff;
}
.wirit-corner .mark .dot {
  color: var(--wirit-cobalt);
}

/* 공용 상단 캡션: 날짜·부제를 좌상단 로고 라인에 옅고 작게 (모든 카드 기본) */
.wirit-topcap {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: -30px; /* 우상단 로고 뱃지 라인에 맞춤 */
  min-height: 62px;
  padding-right: 190px; /* 우상단 로고 자리 확보 */
  color: var(--wirit-gray);
  font-size: 28px;
  font-weight: 600;
}

/* 그래픽 내부 스탬프(아이덴티티 슬롯 C) — 지도·차트·사진이 카드의 절반 이상을 차지해
 * "그래픽만 잘라 쓰기"가 가능한 카드에만 1개. 데이터 위에는 절대 올리지 않는다(빈 코너 전용).
 * 위치는 각 템플릿이 지정(부모에 position:relative 필요). 다크/사진 위에는 .on-dark. */
.wirit-stamp {
  position: absolute;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--wirit-ink);
  opacity: 0.16;
  pointer-events: none;
  z-index: 5;
}
.wirit-stamp.on-dark {
  color: #ffffff;
  opacity: 0.26;
}

/* 브랜드 컬러 로고칩: 실제 로고가 없을 때 브랜드색 원 + 약칭(흰 글씨).
 * 배경색은 인라인 style="background:{brandColor}" 로 지정.
 * 폴백 순서: 이미지 로고 > 컬러칩(logoColor) > 회색 모노그램 */
.wirit-chip {
  border-radius: 50%;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-sans);
  font-weight: 800;
  line-height: 1;
  text-align: center;
  flex: none;
}

/* 카드 테두리(아이덴티티) — 콘텐츠 위에 오버레이(레이아웃 영향 없음).
 * 최외곽 얇은 흰색 라인 + 그 안쪽 잉크 프레임 → 캡처 시 어떤 배경에서도 카드 경계가 또렷.
 * border(흰색 3px)=최외곽, inset box-shadow(잉크 12px)=안쪽 프레임. */
.wirit-card::after {
  content: "";
  position: absolute;
  inset: 0;
  border: 3px solid #ffffff;
  box-shadow: inset 0 0 0 12px var(--wirit-ink);
  pointer-events: none;
  z-index: 10;
}

        background: linear-gradient(180deg, rgba(20,24,33,0) 0%, rgba(20,24,33,0.55) 46%, rgba(20,24,33,0.9) 80%, var(--ink) 100%);
      }
      /* 부제가 밝은 하늘에 묻히지 않게 위쪽에만 얕은 그늘 */
      .dcv-topshade {
        position: absolute; left: 0; right: 0; top: 0; height: 190px;
        background: linear-gradient(180deg, rgba(8,11,18,0.46) 0%, rgba(8,11,18,0.1) 60%, rgba(8,11,18,0) 100%);
      }
      /* ⚠️ 조감도가 없어 대체 사진을 깐 경우의 경고. 조감도 출처 표기를 지우면서(오너 지시)
         이 표시까지 함께 사라졌었다 — 그러면 **아무 사진이나 그 단지의 조감도로 읽힌다.**
         출처를 지우는 것과 거짓을 허용하는 것은 다르다. 발행 전에 반드시 걷어내야 할 상태다. */
      .dcv-ph {
        position: absolute; right: 72px; top: 118px; padding: 8px 16px; border-radius: 4px;
        background: rgba(255, 196, 0, 0.92); color: #1a1400;
        font-size: 22px; font-weight: 800; letter-spacing: -0.01em;
      }

      .dcv .wirit-topcap {
        position: absolute; left: 72px; right: 72px; top: 0;
        margin-top: 0; padding-top: 46px; color: rgba(255,255,255,0.82);
        text-shadow: 0 1px 8px rgba(0,0,0,0.6);
      }

      /* 제목 — 이전 '단지명 자리'로 내려왔다. 잉크 밴드 안이라 그림자가 필요 없다. */
      .dcv-head { position: absolute; left: 72px; right: 72px; bottom: 34px; }
      .dcv-title { font-size: 92px; }
      .dcv-title .ln {
        font-family: var(--font-title); font-size: 1em; font-weight: 900; line-height: 1.08;
        letter-spacing: -0.035em; color: #fff; white-space: nowrap; width: max-content; max-width: 100%;
      }
      /* 제목 강조는 **잉크 위 전용 틴트**다 — 오너 확정 2026-09-03: "청약은 원래 블루가 맞는 컬러네."
         한 번 브랜드 토큰(var(--wirit-cobalt)/var(--wirit-red))으로 옮겨 봤다가 되돌렸다.
         이 두 색은 표지형의 어두운 잉크 밴드 위에서만 쓰이는 값이고, 청약 카드 11장이
         2026-08-03 부터 이 색으로 나갔다 — 판형의 정체성에 가깝다.
         ⚠️ 그래서 `audit-head` 가 이 둘을 **표지형에 한해** 규격색으로 인정한다
         (packages/renderer/src/auditHead.ts 의 DANJI_TITLE_TINT). 기준선에 끼워 넣어
         통과시키는 것과 다르다 — 허용이 코드에 적혀 있고 판형 밖에서는 여전히 걸린다. */
      .dcv-title .hi { color: #7aa6ff; }
      .dcv-title .up { color: #ff8a8e; }

      /* 단지명 · 주소 · 로고를 **한 행**에 두고 아랫단을 맞춘다(오너 지시 2026-08-03).
         주소가 단지명 아래 두 번째 줄일 때는 로고만 오른쪽에 홀로 떠 있었다 —
         오른쪽에 글자 하나를 붙여 주면 로고가 행의 일부가 된다.
         `align-items: flex-end` + 세 요소 모두 `line-height: 1` → 글자 밑선과 마크 밑변이 한 줄. */
      .dcv-nm {
        margin-top: 22px; display: flex; flex-wrap: nowrap;
        align-items: flex-end; justify-content: space-between; gap: 28px;
      }
      .dcv-nm .nm {
        display: block; font-family: var(--font-sans); font-size: 52px; font-weight: 800;
        letter-spacing: -0.03em; color: #fff; line-height: 1; white-space: nowrap;
      }
      .dcv-nm .rt { display: flex; align-items: flex-end; gap: 22px; flex: none; }
      .dcv-nm .loc {
        display: block; font-family: var(--font-sans); font-size: 28px; font-weight: 700;
        letter-spacing: -0.02em; color: rgba(255,255,255,0.72); line-height: 1; white-space: nowrap;
        padding-bottom: 2px; /* 글자 밑선을 마크 밑변에 맞춘다 */
      }
      /* 짙은 단색 브랜드 마크는 잉크 위에서 사라진다 — 흰색으로 뒤집는다(형태는 그대로) */
      .dcv-nm .lg {
        flex: none; height: 62px; width: auto; max-width: 220px; object-fit: contain;
        filter: brightness(0) invert(1); opacity: 0.95;
      }

      /* ── 종이 위 단: 타입 · 분양가 ──
       * 타입과 금액을 **같은 크기**로 둔다(오너 지시). 위계는 크기가 아니라 색이 만든다 —
       * 타입은 회색, 금액은 잉크, 주력 면적대만 코발트. */
      .dcv-price { margin-top: 30px; }
      /* 남는 세로를 **위아래로 나눈다** (오너 지시 2026-08-06 "정보가 제목 쪽에 붙어 있다").
       * .dcv-note 하나만 auto 면 남는 자리가 전부 아래로 몰려 표가 제목에 달라붙는다.
       * auto 를 하나 더 두면 free space 가 반씩 갈려 표 덩어리가 종이 한가운데에 앉는다.
       * ⚠️ 확정본(한강·송도)에는 걸리지 않게 **규모 우선 판(.scale)에만** 준다.
       *    처음엔 `:has(.frow.four)` 로 걸었는데 그러면 **세 칸짜리 카드가 빠진다** —
       *    충정로가 그래서 아래 여백만 넓었다(2026-08-08 오너 지적). 판형으로 걸어야 맞다. */
      .dcv.scale .dcv-price { margin-top: auto; }
      .dcv-price .top { display: flex; align-items: baseline; justify-content: space-between; }
      .dcv-grid { display: grid; column-gap: 22px; row-gap: 20px; }
      /* 타입과 금액은 칸 **가운데** 로 맞춘다(오너 지시 2026-08-03). 왼쪽 맞춤이면 '84A'와
         '7.7억'의 글자 수가 달라 둘의 무게중심이 어긋나 보인다. */
      .dcv-item { min-width: 0; text-align: center; }
      /* 평형이 하나뿐이면 칸이 카드 폭 전체다 — 가운데로 밀면 왼쪽 머리글과 따로 논다.
         이때만 왼쪽 맞춤으로 되돌린다. */
      .dcv-grid .dcv-item:only-child { text-align: left; }
      .dcv-item .a {
        display: block; font-family: var(--font-num); font-size: var(--t-n); font-weight: 800;
        letter-spacing: -0.03em; color: var(--wirit-gray); line-height: 1; margin-bottom: 10px; white-space: nowrap;
      }
      .dcv-item .p {
        display: block; font-family: var(--font-num); font-size: var(--t-n); font-weight: 900;
        letter-spacing: -0.03em; color: var(--wirit-ink); line-height: 1; white-space: nowrap;
      }
      /* 코발트는 **금액에만**. 타입은 주력이든 아니든 전부 회색이다(오너 지시 2026-08-03) —
         타입은 금액을 읽기 위한 열쇠지 그 자체가 강조 대상이 아니다. */
      .dcv-item.main .p { color: var(--wirit-cobalt); }
      /* 범위 라벨(`114~115㎡`)은 대표타입 라벨(`84A`)의 두 배 길이다. 금액과 같은 크기로 두면
         이 칸 하나가 공통 수치 크기를 통째로 끌어내린다 — 범위일 때만 작게 찍는다(오너 지시
         2026-09-03). 크기는 CSS 가 아니라 __wiritFit 이 공통 크기의 비율로 정한다(SMALL_A) —
         공통 크기가 카드마다 28~52px 로 다르기 때문이다. 여기서는 자간만 조인다. */
      .dcv-item .a.sm { letter-spacing: -0.02em; }
      /* 면적대 꼬리표 — `114~115㎡ (국평)`. 면적보다 한 급 작게 두어 **면적이 먼저** 읽히게 한다.
         ⚠️ 색은 주지 않는다 — 강조는 금액 하나뿐이다(2026-09-03 오너 확정). */
      .dcv-item .a .nt { font-size: 0.84em; }
      /* '안전마진' 처럼 상승·차익 시그널을 말하는 칸 전용(오너 지시 2026-08-11).
         빨강은 --wirit-red 의 원래 용도(상승·경고 시그널)와 맞다 — 분양가 자체에는 안 쓴다.
         opt-in 클래스라 기존 확정 카드(main 만 쓰는 카드)의 픽셀은 그대로다. */
      .dcv-item.warn .p { color: var(--wirit-red); }
      /* '빛나는 카드' — 오너 지시(2026-08-11)로 이 한 칸만 예외로 튀운다.
         판형 원칙(AI티 금지: 큰 라운드·옅은 회색 채움 상자)과는 결이 다르다는 걸 알고 쓴다 —
         라운드를 작게, 채움 대신 얇은 글로우로 절제해 '상자'보다 '빛'에 가깝게 잡았다. */
      .dcv-item.glow {
        padding: 10px 6px; border-radius: 12px; margin: -10px -6px;
        background: linear-gradient(180deg, rgba(229,72,77,.09), rgba(229,72,77,.02));
        box-shadow: 0 0 0 1.5px rgba(229,72,77,.4), 0 6px 18px rgba(229,72,77,.22);
      }
      .dcv-item.glow .a { color: var(--wirit-ink); }

      /* 위 단이 없는 판에서는 표지 바로 아래가 제원 줄이다 — 종이 첫 줄이 잉크에 달라붙는다.
         `.dcv-price` 가 있는 카드에서는 이 선택자가 아예 안 맞으므로 확정본은 그대로다. */
      .dcv-cover + .dcv-facts { margin-top: 34px; }

      /* ── 가운데 선: 위 단(가격)과 아래 단(제원·일정)을 가른다 ── */
      .dcv-rule { height: 1px; background: var(--wirit-ink-12); margin: 24px 0; }

      /* ── 종이 아래 단: 제원 3 + 일정 3 = 두 줄 괘선 그리드 ──
       * 오너: "카드 형태로 표현한다든지, 위아래 줄을 구분할 수 있는 선을 추가한다든지."
       * 옅은 회색 채움 상자는 쓰지 않는다(AI티 금지, CEO 07-18). 대신 **괘선만**으로 짠다 —
       * 가로선이 제원/일정을 가르고, 세로선이 세 칸을 가른다. 채움이 없으니 카드가 무거워지지
       * 않고, 선이 있으니 숫자가 허공에 뜨지 않는다. 인쇄 매체의 제원표가 쓰는 방식이다.
       * 선의 굵기는 하나(1px)이고 농도만 둘 — 가로 12%, 세로 9%. 세로선이 더 옅은 이유는
       * 그것이 '구분'이지 '단락'이 아니기 때문이다.
       *
       * 라벨(세대수·동수·최고 층수)은 오너 지시로 지웠다. 값이 단위를 데리고 있어
       * '2,682세대'만으로 읽힌다. 층수만 예외로 '최고'가 앞에 붙는다 — 그게 없으면
       * 38층이 최고층인지 평균층인지 카드가 말하지 못한다.
       * 단위는 **크기 그대로, 색만 회색**(오너 지시). '2,682세대'는 숫자와 단위가 한 낱말이다. */
      /* 칸 안의 내용은 **가운데**로 앉힌다(오너 지시 2026-08-03).
         다만 라벨(특별공급·1순위…)과 내역(APT …)은 값과 **왼쪽 선을 맞춘다** — 각자 가운데로
         맞추면 짧은 라벨이 값 한가운데로 밀려 두 줄이 서로 어긋나 보인다.
         그래서 라벨+값을 `.box` 한 덩어리로 묶어 **덩어리를 가운데**로 두고,
         덩어리 **안**은 왼쪽 맞춤으로 둔다. 두 줄의 왼쪽 선이 하나가 된다. */
      .dcv-facts .cell { text-align: center; }
      .dcv-facts .box { display: block; text-align: left; }
      /* 제원 3칸은 균등이 아니다(오너 지시 2026-08-03): 세대수 칸을 넓히고 동수 칸을 줄인다 —
         세대수만 아래에 내역 한 줄이 더 붙어 실제로 필요한 폭이 다르다.
         ⚠️ **col3 은 1fr 그대로 둔다.** 그래야 두 번째 세로선이 936-312 = 624px 에 그대로 남고,
         일정 줄(1:1:1:1.5)의 마지막 세로선과 계속 겹친다. 넓힌 만큼은 col1↔col2 사이에서만
         주고받는다 — 여백(column-gap·padding-left 28)은 손대지 않으므로 리듬도 그대로다. */
      /* 기본은 **균등 3등분**. 세대수 칸에 내역 한 줄(.brk)이 붙는 카드만 그 칸을 넓힌다 —
         내역이 없는 카드까지 1.15fr 로 두면 첫 값만 리듬이 어긋나 보인다(오너 지적).
         어느 쪽이든 두 번째 세로선은 936-312 = 624px 라 일정 줄과 계속 겹친다. */
      .dcv-facts .frow { display: grid; grid-template-columns: 1fr 1fr 1fr; }
      .dcv-facts .frow:has(.brk) { grid-template-columns: 1.15fr 0.85fr 1fr; }
      /* 타입이 넷인 무순위 카드는 **균등 4등분**이다(오너 지시 2026-08-06). 네 값의 성격이
         같으니 폭도 같아야 한다 — 일정 줄과 달리 유독 긴 값이 하나만 있는 게 아니다.
         `:has(.brk)` 뒤에 둬야 .brk 가 섞여도 4등분이 이긴다. */
      .dcv-facts .frow.four { grid-template-columns: repeat(4, 1fr); }
      /* 일정은 4칸(오너 지시). 마지막 칸만 1.5배로 넓힌다 — '2031년 1월'이 가장 긴 값이라
         균등 4열이면 이 칸이 공통 수치 크기를 통째로 끌어내린다.
         덤: 1:1:1:1.5 의 마지막 경계는 936×3/4.5 = 624px 로, 위 줄(3등분)의 두 번째
         세로선과 **정확히 겹친다.** 두 줄이 선 하나를 공유하니 그리드가 우연처럼 보이지 않는다. */
      .dcv-facts .frow.when { grid-template-columns: 1fr 1fr 1fr 1.5fr; }
      /* 일정이 3칸인 카드(청약 결과 등)도 있다. 4열 고정이면 빈 열이 남고 세로선이 어긋난다.
         칸 수를 세어 열 수를 맞춘다 — 데이터가 판을 정하지, 판이 데이터를 정하지 않는다.
         3칸일 때는 균등 3열이 정답이다: 위 줄(제원)도 3등분이라 **두 세로선이 모두 겹치고**,
         칸 폭 284px 는 가장 긴 '2029년 2월'을 52px 로 담기에 넉넉하다. */
      .dcv-facts .frow.when:has(.cell:nth-child(3):last-child) { grid-template-columns: 1fr 1fr 1fr; }
      /* ⚠️ 여백은 **좌우 대칭**이어야 한다. 왼쪽에만 28px 를 주면 `text-align:center` 가
         '패딩 안쪽의 가운데'를 잡아 글자가 칸 중심에서 14px 오른쪽으로 밀린다
         (오너 지적: "12개동이 가운데 정렬 안 됐어"). 세로선은 border 라 패딩과 무관하다. */
      /* 칸 안의 덩어리는 **아래로 붙인다.** 세대수 칸만 위에 회색 한 줄이 더 붙어서,
         위로 붙이면 그 칸의 값만 34px 내려앉아 세 값의 밑선이 어긋난다(오너 지적).
         칸 자체는 늘어난 채로 둬야 세로 괘선이 같은 높이로 선다 — 그래서 칸을 세로 플렉스로
         만들고 **안의 덩어리만** 아래로 민다. */
      .dcv-facts .cell {
        min-width: 0; padding: 0 22px;
        display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
      }
      /* 세 값의 **밑선을 맞춘다.** 한 칸에만 위(.abv) 또는 아래(.brk) 회색 줄이 붙으면 그 칸의
         큰 값만 위아래로 밀려 나머지와 어긋난다(오너 지적).
         덩어리를 통째로 위/아래로 미는 것으로는 안 된다 — 줄이 **위**에 붙는 카드와 **아래**에
         붙는 카드에서 방향이 반대라, 한쪽을 맞추면 다른 쪽이 깨진다.
         그래서 **없는 칸에 같은 높이의 빈 자리를 만든다.** 그러면 값의 자리가 저절로 같아진다.
         (.abv 24 + 아래여백 10 = 34 · .brk 위여백 12 + 24 = 36) */
      .dcv-facts .frow:has(.abv) .box:not(:has(.abv))::before { content: ""; display: block; height: 34px; }
      .dcv-facts .frow:has(.brk) .box:not(:has(.brk))::after { content: ""; display: block; height: 36px; }
      .dcv-facts .cell + .cell { border-left: 1px solid rgba(20, 24, 33, 0.09); }
      .dcv-facts .fhr { height: 1px; background: var(--wirit-ink-12); margin: 22px 0; }
      .dcv-facts .v {
        display: block; font-family: var(--font-num); font-size: var(--t-n); font-weight: 900;
        line-height: 1; letter-spacing: -0.03em; color: var(--wirit-ink); white-space: nowrap;
      }
      .dcv-facts .v b,
      .dcv-facts .v i {
        font-family: var(--font-num); font-style: normal; font-weight: 900;
        font-size: 1em; color: var(--wirit-gray);
      }
      .dcv-facts .v b { margin-right: 10px; }
      .dcv-facts .v i { margin-left: 4px; }
      .dcv-facts .v.tbd { color: var(--wirit-gray); }
      .dcv-facts .v.tbd i, .dcv-facts .v.tbd b { color: var(--wirit-gray); }
      /* 값 **위**에 붙는 회색 한 줄('총 1,640세대 중'). 아래에 붙는 내역(.brk)과 같은 급이다. */
      .dcv-facts .abv {
        display: block; margin-bottom: 10px; font-family: var(--font-sans); font-size: 24px;
        font-weight: 700; letter-spacing: -0.02em; color: var(--wirit-gray); line-height: 1; white-space: nowrap;
      }
      .dcv-facts .v .num.hi { color: var(--wirit-cobalt); }
      .dcv-facts .brk {
        display: block; margin-top: 12px; font-family: var(--font-sans); font-size: 24px;
        font-weight: 700; letter-spacing: -0.02em; color: var(--wirit-gray); line-height: 1; white-space: nowrap;
      }

      /* 최하단 문구는 **푸터에 붙는다**(오너 지시). margin-top:auto 로 남는 세로를 위로 몰아
         문구가 푸터 바로 위에 앉게 한다. 아래 여백 22px 은 다른 덩어리 간격과 같은 급이다. */
      /* 한 급 작은 판(오너 지시 2026-09-03) — 두 줄짜리 특이사항은 34px 이면 무게가 커서
         종이의 마지막 말이 표보다 세진다. **옵트인**이라 기존 확정본 픽셀은 건드리지 않는다. */
      .dcv-note.sm { font-size: 30px; }
      /* ⚠️ **표지가 늘어나는 카드에서만** 이 줄의 `margin-top:auto` 를 뺀다.
         플렉스에서 auto 여백은 `flex-grow` **보다 먼저** 남는 자리를 먹는다 — 그게 있으면
         표지는 1px 도 못 늘어난다. 그렇다고 통째로 빼면 **손으로 맞춘 카드가 깨진다**:
         송파·구리 줍줍에서 푸터가 1px·10px 카드 밖으로 나갔다(전수 검사가 잡았다).
         그래서 판을 보고 가른다 — 고정 표지(.fixed)는 옛 동작 그대로, 탄력 표지만 뺀다.
         탄력 표지가 한계까지 늘어난 뒤 남는 세로는 공용 푸터의 auto 가 받으므로
         "문구가 푸터에 붙는다"는 원래 의도는 지켜진다. */
      .dcv:has(.dcv-cover:not(.fixed)) .dcv-note { margin-top: 24px; }
      .dcv-note {
        margin: 24px 0 22px; margin-top: auto; font-family: var(--font-sans); font-size: 34px; font-weight: 700;
        letter-spacing: -0.02em; color: var(--wirit-ink); line-height: 1.25; word-break: keep-all;
      }
      .dcv-note .tag { color: var(--wirit-cobalt); }
      /* 아이콘은 글자를 돕는 것이지 글자와 겨루는 것이 아니다 — 본문보다 작게, 옅게.
         (오너: "이모지는 튀지 않는 것으로") */
      .dcv-note .em {
        font-style: normal; font-size: 0.78em; opacity: 0.72;
        margin-right: 10px; vertical-align: 0.04em;
      }

      /* 출처 줄이 길어졌다(조감도 출처가 붙었다) — 워터마크와 붙지 않게 최소 간격을 준다.
         ⚠️ `margin-top: 0` 이 중요하다. 공용 푸터는 `margin-top: auto` 로 바닥에 붙는데,
         `.dcv-note` 도 auto 를 갖게 되면 **남는 세로를 둘이 나눠 갖는다** — 그래서 문구가
         푸터에 붙지 않고 중간에 떴다(오너 지적). 미는 쪽은 하나여야 한다. */
      .dcv .wirit-footer { gap: 28px; margin-top: 0; }
    </style>
  </head>
  <body>
    <div class="wirit-card dcv"><div class="wirit-corner"><span class="mark">wirit<span class="dot">.</span></span></div>
      <div class="dcv-cover" style="--cover-h:690px;min-height:690px;max-height:1122px">
        <div class="dcv-photo">
            <img src="../_shared/photos/define-artia.jpg" alt="" />
          <div class="dcv-topshade"></div>
          <div class="dcv-fade"></div>
        </div>
        

        <div class="wirit-topcap"><span class="tx">오늘의 주요 청약 이슈 (2026.09.09)</span></div>

        <div class="dcv-head">
          <div class="dcv-title">
            <div class="ln"><span class="hi">노량진</span> 무순위 줍줍 <span class="hi">7세대</span></div>
          </div>
          <div class="dcv-nm">
            <span class="nm">드파인 아르티아(2차)</span>
            <div class="rt">
              <span class="loc">서울 동작구 노량진동</span>
              <img class="lg" src="../_shared/logos/define-tight.png" alt="" />
            </div>
          </div>
        </div>
      </div>


      <div class="dcv-facts">
        <div class="frow">
          <div class="cell"><div class="box">
            <span class="abv">84B · 2세대</span>
            <span class="v"><span class="num">26.6억</span></span>
            
          </div></div>
          <div class="cell"><div class="box">
            <span class="abv">109A · 5세대</span>
            <span class="v"><span class="num hi">30.6억</span></span>
            
          </div></div>
          <div class="cell"><div class="box">
            <span class="abv">총 2개동</span>
            <span class="v"><b>최고</b><span class="num">45</span><i>층</i></span>
            
          </div></div>
        </div>
        <div class="fhr"></div>
        <div class="frow when">
          <div class="cell"><div class="box">
            <span class="lab">무순위 접수</span>
            <span class="v"><span class="num hi">9/14(월)</span></span>
          </div></div>
          <div class="cell"><div class="box">
            <span class="lab">당첨자 발표</span>
            <span class="v"><span class="num">9/17(목)</span></span>
          </div></div>
          <div class="cell"><div class="box">
            <span class="lab">입주 예정</span>
            <span class="v"><span class="num">2029년 11월</span></span>
          </div></div>
        </div>
      </div>

      <div class="dcv-note"><i class="em">💡</i>서울 거주 무주택세대구성원 · 청약통장 불필요</div>

      <div class="wirit-footer">
        <span>출처 · 청약홈 무순위 입주자모집공고</span>
        <span class="wirit-watermark">@wirit_note<span class="dot">.</span></span>
      </div>
    </div>

    <script>
      /* 폭 맞춤 둘.
         ① 제목 — 한 줄이 카드 폭을 꽉 채우는 크기(줄이기만 하지 않고 키운다).
         ② 수치 — **타입·분양가·제원·일정을 한 자로 재서 같은 크기**로 만든다.
            타입(.a)까지 이 그룹에 넣은 것이 @1 과의 차이다(오너 지시: 타입도 같은 크기). */
      window.__wiritFit = function () {
        var t = document.querySelector(".dcv-title");
        if (t) {
          var lines = t.querySelectorAll(".ln");
          var availW = t.clientWidth;
          if (lines.length) {
            var lo = 40, hi = 128, best = lo;
            for (var i = 0; i < 26; i++) {
              var mid = (lo + hi) / 2;
              t.style.fontSize = mid + "px";
              var fits = true;
              for (var j = 0; j < lines.length; j++) if (lines[j].scrollWidth > availW + 0.5) { fits = false; break; }
              if (fits) { best = mid; lo = mid; } else { hi = mid; }
            }
            t.style.fontSize = best + "px";
          }
        }
        /* 단지명은 주소·로고와 **한 행**을 나눠 쓴다 — 셋의 합이 카드 폭을 넘지 않는 최대 크기를
           찾는다. 고정 크기로 두면 이름이 긴 단지에서 로고가 밖으로 밀려난다. */
        var nmEl = document.querySelector(".dcv-nm .nm");
        var nmRow = document.querySelector(".dcv-nm");
        if (nmEl && nmRow) {
          var lo2 = 30, hi2 = 60, best2 = lo2;
          for (var q = 0; q < 22; q++) {
            var m2 = (lo2 + hi2) / 2;
            nmEl.style.fontSize = m2 + "px";
            if (nmRow.scrollWidth <= nmRow.clientWidth + 0.5) { best2 = m2; lo2 = m2; } else { hi2 = m2; }
          }
          nmEl.style.fontSize = best2 + "px";
        }

        /* ⚠️ 재는 자는 **칸(.cell)** 이지 부모가 아니다. 제원·일정의 값은 이제
           shrink-to-fit 인 `.box` 안에 들어 있어서, 부모 폭으로 재면 언제나 "딱 맞음"이 나와
           넘침 보호가 통째로 꺼진다. 칸의 **내용 폭**(패딩 제외)으로 잰다. */
        function boxOf(el) {
          var c = el.closest(".cell") || el.parentNode;
          var cs = getComputedStyle(c);
          return c.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
        }
        /* ── 시각적 왼쪽 맞춤 (오너 지적 2026-08-03) ──
         * 레이아웃 상자가 같은 x 에서 시작해도 **글자는 안 그렇다.**
         * 원인은 본문에 걸린 `font-feature-settings: "tnum"`(고정폭 숫자)이다. 숫자는 모두
         * 같은 자리를 쓰는데 글자 폭은 제각각이라, 좁은 '1' 은 그 자리 **가운데로 밀려**
         * 잉크가 7px 안쪽에서 시작한다. '8' 은 2px, 한글은 0px 다 — **글자마다 다르다.**
         * 그래서 상수로 박을 수 없고, 매번 잰다:
         *   비례폭(canvas measureText) + 실제 자리폭(DOM) 으로 가운데 밀린 양을 구하고,
         *   거기에 글자 자체의 좌측 여백(actualBoundingBoxLeft)을 더한다.
         * 캔버스는 폰트를 제대로 물고 있다(한글 advance 가 DOM 과 0.01px 차이). */
        var __cv = document.createElement("canvas");
        var __cx = __cv.getContext("2d");
        var __probe = document.createElement("span");
        __probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;left:-9999px";
        document.body.appendChild(__probe);
        function inkLeft(el) {
          var t = (el.textContent || "").trim();
          if (!t) return 0;
          var ch = t.charAt(0);
          var cs = getComputedStyle(el);
          __cx.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
          var m = __cx.measureText(ch);
          /* ⚠️ `style.font` 단축 속성은 **font-feature-settings 를 초기화한다** — 그러면 tnum 이
             풀려 자리폭이 비례폭과 같아지고, 보정값이 0에 가깝게 나온다(첫 구현에서 그랬다).
             속성을 하나씩 옮긴다. */
          __probe.style.fontFamily = cs.fontFamily;
          __probe.style.fontSize = cs.fontSize;
          __probe.style.fontWeight = cs.fontWeight;
          __probe.style.fontStyle = cs.fontStyle;
          __probe.style.fontFeatureSettings = cs.fontFeatureSettings;
          __probe.style.fontVariationSettings = cs.fontVariationSettings;
          __probe.style.letterSpacing = "normal";
          __probe.textContent = ch;
          var domAdv = __probe.getBoundingClientRect().width;      /* tnum 이 걸린 실제 자리폭 */
          var centered = Math.max(0, (domAdv - m.width) / 2);      /* 그 자리에서 가운데로 밀린 양 */
          return centered - (m.actualBoundingBoxLeft || 0);
        }
        Array.prototype.forEach.call(document.querySelectorAll(".dcv-facts .box"), function (box) {
          var v = box.querySelector(".v");
          if (!v) return;
          var vOff = inkLeft(v.querySelector(".num") || v);
          Array.prototype.forEach.call(box.querySelectorAll(".abv,.lab,.brk"), function (el) {
            var dx = vOff - inkLeft(el);
            el.style.marginLeft = Math.abs(dx) < 20 ? dx.toFixed(2) + "px" : "0px";
          });
        });
        __probe.remove();

        var nums = [];
        Array.prototype.forEach.call(
          document.querySelectorAll(".dcv-item .a,.dcv-item .p,.dcv-facts .v"),
          function (el) { nums.push({ el: el, box: boxOf(el) }); },
        );
        if (nums.length) {
          /* 상한 52 — 이 이상 키우면 아래 단이 푸터를 밀어낸다(칸 폭이 아니라 카드 높이가 한계다) */
          var loS = 28, hiS = 52, bestS = loS;
          for (var k = 0; k < 24; k++) {
            var m = (loS + hiS) / 2;
            for (var a = 0; a < nums.length; a++) nums[a].el.style.fontSize = m + "px";
            var ok = true;
            for (var b = 0; b < nums.length; b++) if (nums[b].el.scrollWidth > nums[b].box) { ok = false; break; }
            if (ok) { bestS = m; loS = m; } else { hiS = m; }
          }
          for (var c = 0; c < nums.length; c++) nums[c].el.style.fontSize = bestS + "px";
          /* 범위 라벨(.a.sm)만 공통 크기의 비율로 내린다 — 위에서 **전체 크기와 함께 재고**
             나서 줄이므로 넘칠 일이 없다(큰 크기로 들어간 칸을 작게 만드는 것뿐이다).
             비율을 CSS 에 두지 않는 이유는 공통 크기가 카드마다 달라서다(28~52px). */
          var SMALL_A = 0.74;
          Array.prototype.forEach.call(document.querySelectorAll(".dcv-item .a.sm"), function (el) {
            el.style.fontSize = (bestS * SMALL_A).toFixed(2) + "px";
          });
        }
      };
      window.__wiritFit();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(window.__wiritFit);
    </script>
  </body>
</html>

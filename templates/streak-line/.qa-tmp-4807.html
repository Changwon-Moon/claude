<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
/*
 * wirit 공통 브랜드 스타일 (base.css)
 * BRAND.md 의 잉크네이비 팔레트·규칙을 구현한다.
 * 폰트: Pretendard Variable 번들 (모든 웨이트 포함) → 머신 간 동일 렌더.
 */

@font-face {
  font-family: "Pretendard";
  font-weight: 45 920; /* Variable: 얇은~Black 전 구간 */
  font-style: normal;
  font-display: block;
  src: url("../_shared/fonts/PretendardVariable.woff2") format("woff2-variations");
}
@font-face {
  font-family: "Wanted Sans";
  font-weight: 100 900;
  font-style: normal;
  font-display: block;
  src: url("../_shared/fonts/WantedSansVariable.woff2") format("woff2-variations");
}
@font-face {
  font-family: "Black Han Sans"; /* 헤드라인 전용 디스플레이(굵고 임팩트) */
  font-weight: 400;
  font-style: normal;
  font-display: block;
  src: url("../_shared/fonts/BlackHanSans-Korean.woff2") format("woff2");
}
@font-face {
  font-family: "TAEBAEK"; /* 제목 기본 서체(운영자 지정 2026-07-23, 태백체) */
  font-weight: 100 900; /* 단일 마스터 — 전 웨이트 요청을 이 서체로 매핑(폴백 이탈 방지) */
  font-style: normal;
  font-display: block;
  /* OTF(CFF+vhea/vmtx)는 Chromium OTS가 거부 → WOFF2로 재패키징(font-convert.yml) */
  src: url("../_shared/fonts/TAEBAEK.woff2") format("woff2");
}

:root {
  --wirit-ink: #141821; /* 본문, 수치, 다크 배경 */
  --wirit-paper: #fafaf8; /* 기본 배경 */
  --wirit-cobalt: #2e6bff; /* 강조 1축 */
  --wirit-red: #e5484d; /* 상승·경고 시그널 전용 */
  --wirit-gray: #5b6b7f; /* 보조 텍스트, 비강조 */
  --wirit-ink-06: rgba(20, 24, 33, 0.06); /* 행 밴딩, 구분선 */
  --wirit-ink-12: rgba(20, 24, 33, 0.12);

  /* 폰트 후보 스택 */
  --font-pretendard: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR",
    system-ui, sans-serif;
  --font-wanted: "Wanted Sans", "Pretendard", "Apple SD Gothic Neo",
    system-ui, sans-serif;
  --font-blackhan: "Black Han Sans", "Wanted Sans", "Pretendard", sans-serif;
  --font-taebaek: "TAEBAEK", "Wanted Sans", "Pretendard", sans-serif;

  /* 확정 폰트 시스템:
     - 헤드라인(title) = 태백체 (2026-07-23 운영자 지정, 이전 Wanted Sans)
     - 숫자(num)       = Wanted Sans
     - 본문·라벨(sans) = Pretendard */
  --font-sans: var(--font-pretendard);
  --font-num: var(--font-wanted);
  --font-title: var(--font-taebaek);
}

/* ⭐ 2026-09-07 오너 확정 — **새 판형의 기본 세트**.
 * 제목만 태백체, 숫자를 포함한 나머지 전부 Pretendard(= Wanted Sans 퇴역).
 * 왜 기본값(:root)을 안 바꾸나: `--font-num` 을 갈면 확정본 51개 세트와
 *   `--font-num` 을 쓰는 판형 33개가 다시 그려질 때 픽셀이 전부 바뀐다.
 *   「발행본·확정본 픽셀 불변」(CLAUDE.md §8)에 정면으로 걸린다 →
 *   **새 스타일은 variant 로 격리**한다는 그 규칙대로 세트를 하나 더 둔다.
 * 쓰는 법: 새로 만드는 판형의 카드 루트에 `class="wirit-card font-taebaek-pretendard ..."`.
 *   옛 카드는 아무것도 안 붙이므로 자기 픽셀 그대로 남는다.
 * 로고 뱃지(`.wirit-corner .mark`)는 이 세트의 대상이 아니다 — 폰트가 아니라 CI 다. */
.font-taebaek-pretendard {
  --font-sans: var(--font-pretendard);
  --font-num: var(--font-pretendard);
  --font-title: var(--font-taebaek);
}

/* 폰트 세트 전환(실험용). 기본은 위 하이브리드. */
.font-pretendard {
  --font-sans: var(--font-pretendard);
  --font-num: var(--font-pretendard);
  --font-title: var(--font-pretendard);
}
.font-wanted {
  --font-sans: var(--font-wanted);
  --font-num: var(--font-wanted);
  --font-title: var(--font-wanted);
}
.font-wanted-blackhan {
  --font-sans: var(--font-pretendard);
  --font-num: var(--font-wanted);
  --font-title: var(--font-blackhan);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  font-family: var(--font-sans);
  background: var(--wirit-paper);
  color: var(--wirit-ink);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum" 1; /* 표 정렬용 고정폭 숫자 */
}

/* 카드 프레임: 뷰포트(config 크기)에 맞춤 — 4:5(1080×1350) 기본, 1:1(1080×1080) 등 config로 전환 */
.wirit-card {
  width: 100%;
  height: 100%;
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 72px 72px 0;
  background: var(--wirit-paper);
  font-family: var(--font-sans); /* 카드 폰트세트 전환이 하위에 전파되도록 */
}

/* 상단: 카테고리 뱃지 + 제목 */
.wirit-badge {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  gap: 8px;
  padding: 10px 20px;
  border-radius: 999px;
  background: var(--wirit-cobalt);
  color: #fff;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.01em;
}

.wirit-title {
  font-family: var(--font-title); /* 제목만 개성 폰트 적용 가능 */
  margin-top: 28px;
  font-size: 76px;
  font-weight: 900;
  line-height: 1.08;
  letter-spacing: -0.03em;
  color: var(--wirit-ink);
}

.wirit-subtitle {
  margin-top: 18px;
  font-size: 34px;
  font-weight: 600;
  color: var(--wirit-gray);
  letter-spacing: -0.01em;
}

/* 색 유틸 */
.up {
  color: var(--wirit-red);
} /* 상승·경고 (시그널 전용) */
.accent {
  color: var(--wirit-cobalt);
}
.muted {
  color: var(--wirit-gray);
}

/* 하단 고정: 출처 + 워터마크
 * margin-top:auto 로 플렉스 컬럼의 맨 아래에 고정 → 본문과 절대 겹치지 않음 */
/* 하단 바: 로고색(잉크네이비) 풀블리드 배경 + 흰색 글씨 (로고와 동일 톤)
 * 높이 1.5배(패딩 확대), 워드마크 확대 */
.wirit-footer {
  margin-top: auto;
  margin-left: -72px;
  margin-right: -72px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 34px 72px;
  font-size: 24px;
  font-weight: 600;
  background: var(--wirit-ink);
  color: #aeb8c4; /* 출처 등 보조 텍스트는 밝은 회청색 */
}

.wirit-watermark {
  font-weight: 800;
  font-size: 37px; /* 푸터 워드마크 확대 */
  color: #ffffff; /* 로고처럼 흰색 워드마크 */
}
.wirit-watermark .dot {
  color: var(--wirit-cobalt); /* 로고의 코발트 마침표 */
}

/* 우상단 로고 뱃지 (wirit.) — 네이비 둥근 사각형, 글자에 맞춘 여백. 자동 삽입(renderHtml) */
.wirit-corner {
  position: absolute;
  top: 40px;
  right: 40px;
  padding: 13px 21px;
  border-radius: 18px;
  background: var(--wirit-ink);
  display: inline-flex;
  align-items: center;
  z-index: 6;
}
.wirit-corner .mark {
  font-family: "Wanted Sans", "Pretendard", sans-serif;
  font-weight: 800;
  font-size: 36px;
  line-height: 1;
  letter-spacing: -0.03em;
  color: #ffffff;
}
.wirit-corner .mark .dot {
  color: var(--wirit-cobalt);
}

/* 공용 상단 캡션: 날짜·부제를 좌상단 로고 라인에 옅고 작게 (모든 카드 기본) */
.wirit-topcap {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: -30px; /* 우상단 로고 뱃지 라인에 맞춤 */
  min-height: 62px;
  padding-right: 190px; /* 우상단 로고 자리 확보 */
  color: var(--wirit-gray);
  font-size: 28px;
  font-weight: 600;
}

/* 그래픽 내부 스탬프(아이덴티티 슬롯 C) — 지도·차트·사진이 카드의 절반 이상을 차지해
 * "그래픽만 잘라 쓰기"가 가능한 카드에만 1개. 데이터 위에는 절대 올리지 않는다(빈 코너 전용).
 * 위치는 각 템플릿이 지정(부모에 position:relative 필요). 다크/사진 위에는 .on-dark. */
.wirit-stamp {
  position: absolute;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--wirit-ink);
  opacity: 0.16;
  pointer-events: none;
  z-index: 5;
}
.wirit-stamp.on-dark {
  color: #ffffff;
  opacity: 0.26;
}

/* 브랜드 컬러 로고칩: 실제 로고가 없을 때 브랜드색 원 + 약칭(흰 글씨).
 * 배경색은 인라인 style="background:{brandColor}" 로 지정.
 * 폴백 순서: 이미지 로고 > 컬러칩(logoColor) > 회색 모노그램 */
.wirit-chip {
  border-radius: 50%;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-sans);
  font-weight: 800;
  line-height: 1;
  text-align: center;
  flex: none;
}

/* 카드 테두리(아이덴티티) — 콘텐츠 위에 오버레이(레이아웃 영향 없음).
 * 최외곽 얇은 흰색 라인 + 그 안쪽 잉크 프레임 → 캡처 시 어떤 배경에서도 카드 경계가 또렷.
 * border(흰색 3px)=최외곽, inset box-shadow(잉크 12px)=안쪽 프레임. */
.wirit-card::after {
  content: "";
  position: absolute;
  inset: 0;
  border: 3px solid #ffffff;
  box-shadow: inset 0 0 0 12px var(--wirit-ink);
  pointer-events: none;
  z-index: 10;
}

</style>
    <style>
      /* streak-line@1 — 두 국면의 누적 상승률을 실제 주간 지수 곡선으로 비교한다.

         **주지 않으면 실선 그대로**라 기존 발행본(mae-streak·jeonse-streak) 픽셀은 안 바뀐다.

      .sl { display: flex; flex-direction: column; }

      .sl-badge.ink { color: var(--wirit-ink); }

         BRAND §「코발트 1개 축」의 예외이고, market-daily 가 이미 연 예외(상승 레드·하락 코발트)와 같은 결이다. */

      .sl .wirit-title .tg { color: #9aa3af; }
      /* 회색 줄 안에서 **숫자만 잉크로** 세울 때(2026-09-02 오너). 안 쓰면 기존 카드 불변. */
      .sl .wirit-title .ti { color: var(--wirit-ink); }

      /* ── (옵션) 그래프 아래 시나리오 표 — 범례를 아래로 내린 자리(2026-09-01 오너 지시).
         주지 않으면 아무 것도 안 그린다 → 기존 발행본 픽셀 불변. */
      .sl-scen { display: flex; flex-direction: column; gap: 14px; width: 100%; }
      .sl-scen-row {
        display: grid; grid-template-columns: 26px 1fr auto auto; align-items: center;

      .sl-scen .nm {

        letter-spacing: -0.03em; white-space: nowrap;
      }

      /* (옵션) 제목 리드 줄 — 본 제목의 절반 크기·진회색·가운데(양옆 여백 허용). 로고를 앞에 얹는다.
         titleLead 를 주지 않는 카드(예: mae-streak)엔 영향 없음(픽셀 불변). 크기는 __wiritFit 가 본줄의 1/2로 맞춘다. */
      .sl-lead {
        display: flex; align-items: center; justify-content: center; gap: 16px;
        margin: 0 0 6px; color: #3f4856; font-family: var(--font-title);
        font-weight: 800; white-space: nowrap; letter-spacing: -0.03em; line-height: 1.12;
      }
      .sl-lead-logo { height: 1em; width: auto; display: block; }

      .sl-chart { flex: 0 0 auto; display: flex; align-items: center; margin: 30px 0 0; }
      /* 하단 문구를 그래프와 푸터 사이 남은 공간의 정중앙에 둔다 */
      .sl-notewrap { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; }
      .sl-svg { display: block; width: 100%; height: auto; }
      .sl-grid { stroke: var(--wirit-ink-06); stroke-width: 1.6; }
      .sl-axis { stroke: #c9cdd4; stroke-width: 2.5; }
      .sl-yl { font-family: var(--font-num); font-size: 32px; font-weight: 700; fill: #9aa3af; }
      .sl-unit { font-family: var(--font-num); font-size: 30px; font-weight: 700; fill: #9aa3af; }
      .sl-xl { font-family: var(--font-num); font-size: 40px; font-weight: 900; }
      .sl-vl { font-family: var(--font-num); font-size: 54px; font-weight: 900; letter-spacing: -0.02em; }
      .sl-lg { font-family: var(--font-num); font-size: 40px; font-weight: 800; }
      .sl-lgs { font-family: var(--font-num); font-size: 31px; font-weight: 600; }
      .sl-arw { font-family: var(--font-num); font-size: 40px; font-weight: 900; }

      /* 그래프 아래·푸터 위 — 가운데 정렬 큰 마무리 문구(제목보다 조금 작게). */
      .sl-note {
        margin: 0; text-align: center; font-family: var(--font-title);
        font-size: 50px; font-weight: 900; color: var(--wirit-ink);
        letter-spacing: -0.05em; line-height: 1.2; white-space: nowrap;
      }
      .sl-note b { color: var(--wirit-red); font-weight: 900; }
    </style>

    <script>
      /* 제목 각 줄(.tl)을 카드 폭에 꽉 차게 개별 확대 → 위아랫줄 좌우 여백이 맞는다. */
      window.__wiritFit = function () {
        var box = document.querySelector(".sl .wirit-title");
        if (!box) return;
        var bs = getComputedStyle(box);
        var avail = box.clientWidth - (parseFloat(bs.paddingLeft) || 0) - (parseFloat(bs.paddingRight) || 0);
        var tls = box.querySelectorAll(".tl");
        for (var n = 0; n < tls.length; n++) {
          var el = tls[n], lo = 44, hi = 150, best = 44;
          for (var i = 0; i < 26; i++) {
            var mid = (lo + hi) / 2;
            el.style.fontSize = mid + "px";
            if (el.scrollWidth <= avail) { best = mid; lo = mid; } else { hi = mid; }
          }
          el.style.fontSize = best.toFixed(2) + "px";
        }
        /* (옵션) 리드 줄이 있으면 본 제목처럼 카드 폭에 꽉 차게 개별 확대(좌우 꽉참). 없으면 아무 것도 안 한다. */
        var lead = document.querySelector(".sl .sl-lead");
        if (lead) {
          var llo = 30, lhi = 150, lbest = 30;
          for (var j = 0; j < 26; j++) {
            var lmid = (llo + lhi) / 2;
            lead.style.fontSize = lmid + "px";
            if (lead.scrollWidth <= avail) { lbest = lmid; llo = lmid; } else { lhi = lmid; }
          }
          lead.style.fontSize = lbest.toFixed(2) + "px";
        }
      };
    </script>

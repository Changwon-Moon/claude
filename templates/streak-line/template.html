<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!--WIRIT_SHARED_CSS-->
    <style>
      /* streak-line@1 — 두 국면의 '누적 상승률 궤적'을 직선 두 개로 비교한다.
         직선 = 시작→끝 평균 궤적(끝점 = 실제 누적). 주별 시계열 원자료가 없어 굴곡은 그리지 않는다(오보 0).
         현재(빨강)가 더 짧은데 더 가파르게 올라 더 높이 닿는다 — "이번 상승기는 이전과 다르다".
         좌표는 빌더가 계산한다(템플릿은 숫자를 만들지 않는다). 크롬은 record-grid 규격 상속. */
      .sl { display: flex; flex-direction: column; }
      .sl-badge {
        font-family: var(--font-num); font-size: 34px; font-weight: 900;
        color: var(--wirit-gray); letter-spacing: 0.005em;
      }
      .sl-head { padding: 0; margin: 30px 0 0; }
      .sl .wirit-title {
        font-family: var(--font-title);
        font-size: 74px; line-height: 1.12; text-align: left; letter-spacing: -0.04em;
        margin: 0; word-break: keep-all;
      }
      .sl .wirit-title .hi { color: var(--wirit-red); }
      .sl-sub {
        margin: 18px 0 0; font-family: var(--font-num); font-size: 42px; font-weight: 700;
        color: var(--wirit-gray); letter-spacing: -0.04em; word-break: keep-all; line-height: 1.2;
      }
      .sl-sub .hi { color: var(--wirit-red); font-weight: 900; }

      .sl-chart { flex: 1 1 auto; display: flex; align-items: center; margin: 30px 0 6px; }
      .sl-svg { display: block; width: 100%; height: auto; }
      .sl-grid { stroke: var(--wirit-ink-06); stroke-width: 1.5; }
      .sl-axis { stroke: #c9cdd4; stroke-width: 2.5; }
      .sl-yl { font-family: var(--font-num); font-size: 26px; font-weight: 700; fill: #9aa3af; }
      .sl-unit { font-family: var(--font-num); font-size: 25px; font-weight: 700; fill: #9aa3af; }
      .sl-xl { font-family: var(--font-num); font-size: 30px; font-weight: 900; }
      .sl-vl { font-family: var(--font-num); font-size: 44px; font-weight: 900; letter-spacing: -0.02em; }
      .sl-lg { font-family: var(--font-num); font-size: 30px; font-weight: 800; }
      .sl-lgs { font-family: var(--font-num); font-size: 24px; font-weight: 600; }
      .sl-arw { font-family: var(--font-num); font-size: 30px; font-weight: 900; }
    </style>
  </head>
  <body>
    <div class="wirit-card sl">
      <div class="wirit-topcap">{{#if badge}}<span class="sl-badge">{{badge}}</span>{{/if}}</div>
      <div class="sl-head">
        <h1 class="wirit-title">{{{title}}}</h1>
        {{#if subtitle}}<div class="sl-sub">{{{subtitle}}}</div>{{/if}}
      </div>

      <div class="sl-chart">
        <svg class="sl-svg" viewBox="{{chart.vb}}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          {{#each chart.grid}}<line class="sl-grid" x1="{{x1}}" y1="{{y}}" x2="{{x2}}" y2="{{y}}" />{{/each}}
          {{#each chart.areas}}<polygon points="{{points}}" fill="{{fill}}" opacity="{{opacity}}" />{{/each}}
          {{#if chart.base}}<line class="sl-axis" x1="{{chart.base.x1}}" y1="{{chart.base.y}}" x2="{{chart.base.x2}}" y2="{{chart.base.y}}" />{{/if}}
          {{#each chart.vmarks}}<line x1="{{x}}" y1="{{y1}}" x2="{{x}}" y2="{{y2}}" stroke="{{color}}" stroke-width="2" stroke-dasharray="7 7" opacity="0.55" />{{/each}}
          {{#if chart.yunit}}<text class="sl-unit" x="{{chart.yunit.x}}" y="{{chart.yunit.y}}" text-anchor="middle">{{chart.yunit.text}}</text>{{/if}}
          {{#each chart.ylabels}}<text class="sl-yl" x="{{x}}" y="{{y}}" text-anchor="end">{{text}}</text>{{/each}}
          {{#each chart.polylines}}<polyline points="{{points}}" fill="none" stroke="{{color}}" stroke-width="{{width}}" stroke-linejoin="round" stroke-linecap="round" />{{/each}}
          {{#each chart.dots}}<circle cx="{{x}}" cy="{{y}}" r="{{r}}" fill="#fff" stroke="{{color}}" stroke-width="6" />{{/each}}
          {{#each chart.vlabels}}<text class="sl-vl" x="{{x}}" y="{{y}}" fill="{{fill}}" text-anchor="{{anchor}}">{{text}}</text>{{/each}}
          {{#each chart.xlabels}}<text class="sl-xl" x="{{x}}" y="{{y}}" fill="{{fill}}" text-anchor="middle">{{text}}</text>{{/each}}
          {{#if chart.arrow}}
            <line x1="{{chart.arrow.x1}}" y1="{{chart.arrow.y}}" x2="{{chart.arrow.x2}}" y2="{{chart.arrow.y}}" stroke="{{chart.arrow.color}}" stroke-width="4" />
            {{#each chart.arrow.heads}}<polygon points="{{points}}" fill="{{fill}}" />{{/each}}
            <text class="sl-arw" x="{{chart.arrow.lx}}" y="{{chart.arrow.ly}}" fill="{{chart.arrow.color}}" text-anchor="middle">{{chart.arrow.text}}</text>
          {{/if}}
          {{#each chart.legend}}
            <line x1="{{sx1}}" y1="{{sy}}" x2="{{sx2}}" y2="{{sy}}" stroke="{{color}}" stroke-width="9" stroke-linecap="round" />
            <text class="sl-lg" x="{{tx}}" y="{{ty}}" fill="{{fill}}">{{text}}</text>
            {{#if sub}}<text class="sl-lgs" x="{{tx}}" y="{{sty}}" fill="#9aa3af">{{sub}}</text>{{/if}}
          {{/each}}
        </svg>
      </div>

      <div class="wirit-footer">
        <span>출처 · {{source.name}}{{#if source.asOf}} · {{source.asOf}} 기준{{/if}}</span>
        <span class="wirit-watermark">@wirit_note<span class="dot">.</span></span>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!--WIRIT_SHARED_CSS-->
    <style>
      /* index-2026@1 — 연중 주가추이(연초·고점·현재 주석 + 날짜축). 메인 포커스 = 고점대비 하락률. */
      .ix { padding-top: 50px; }
      .ix .wirit-corner { background: transparent; padding: 0; box-shadow: none; top: 42px; right: 56px; }
      .ix .wirit-corner .mark { color: var(--wirit-ink); font-size: 40px; }
      .ix > .wirit-topcap { padding-right: 150px; }

      .ix-head { margin: 8px 0 0; position: relative; }
      /* 태백체는 Wanted Sans보다 폭이 넓어 우측 '기준' 라벨과 겹치지 않게 크기 하향(78→64) */
      .ix .wirit-title { font-size: 64px; line-height: 1.06; text-align: center; letter-spacing: -0.03em; margin: 0; white-space: nowrap; }
      /* 7/21 기준: 제목 베이스라인에 맞춰 내리고 우측 치우침 */
      .ix .wirit-title .sub { position: absolute; right: 4px; bottom: 6px; font-size: 30px; font-weight: 700; color: var(--wirit-gray); letter-spacing: -0.01em; }

      .ix-list { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center;
        gap: 30px; margin: 24px 0; }
      .ix-block { display: flex; flex-direction: column;
        border: 2px solid var(--wirit-ink-12); border-radius: 24px; padding: 28px 34px 26px; background: #fff; }

      /* 헤더: 좌 지수명·현재가(크게), 우 고점대비(히어로) */
      .ix-top { display: flex; align-items: center; gap: 22px; }
      .ix-name { font-size: 46px; font-weight: 900; letter-spacing: -0.02em; color: var(--wirit-ink); }
      .ix-now { font-family: "Pretendard", sans-serif; font-size: 62px; font-weight: 800; color: var(--wirit-ink); font-feature-settings: "tnum"; letter-spacing: -0.02em; }
      .ix-dd { margin-left: auto; display: flex; align-items: center; gap: 14px;
        background: rgba(46,107,255,0.08); border-radius: 18px; padding: 10px 22px; }
      .ix-dd .k { display: flex; flex-direction: column; line-height: 1.15; text-align: right; }
      .ix-dd .k b { font-size: 24px; font-weight: 800; color: var(--wirit-gray); }
      .ix-dd .k .d { font-family: "Pretendard", sans-serif; font-size: 21px; font-weight: 800; color: var(--wirit-cobalt); font-feature-settings: "tnum"; letter-spacing: -0.01em; }
      .ix-dd .v { font-family: "Pretendard", sans-serif; font-size: 64px; font-weight: 800; color: var(--wirit-cobalt); letter-spacing: -0.02em; font-feature-settings: "tnum"; }
      .ix-dd .v i { font-style: normal; font-size: 36px; }

      /* 차트: 컨테이너 비율을 viewBox와 일치(1000:300)시켜 가로 늘림(왜곡) 방지 */
      .ix-chart { width: 100%; aspect-ratio: 1000 / 360; margin: 14px 0 0; }
      .ix-chart svg { width: 100%; height: 100%; display: block; }

      /* 차트 스타일 — 숫자는 Pretendard(정렬형) */
      .ix-line { fill: none; stroke: var(--wirit-ink); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .ix-area { fill: rgba(20,24,33,0.045); stroke: none; }
      .ix-axis { stroke: rgba(20,24,33,0.18); stroke-width: 2; }
      .ix-tick { font-family: "Pretendard", sans-serif; font-weight: 700; font-size: 22px; fill: #98a2b3; }
      .ix-dot-start { fill: var(--wirit-ink); }
      .ix-dot-peak { fill: var(--wirit-red); }
      .ix-dot-last { fill: var(--wirit-cobalt); }
      /* 주가 라벨: 흰 헤일로(라인 위에서도 또렷) */
      .ix-pt { font-family: "Pretendard", sans-serif; font-weight: 800; font-size: 25px; fill: var(--wirit-ink);
        paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
      .ix-pt.peak { fill: var(--wirit-red); }
      .ix-pt.last { fill: var(--wirit-cobalt); }
      .ix-rise { font-family: "Pretendard", sans-serif; font-weight: 800; fill: var(--wirit-red); }
      .ix-rise .big { font-size: 34px; font-weight: 800; }
      .ix-rise .sm { font-size: 23px; font-weight: 700; fill: #d08a8c; }
      .ix-risearc { fill: none; stroke: rgba(229,72,77,0.5); stroke-width: 3; stroke-linecap: round; }
      .ix-fallarc { fill: none; stroke: var(--wirit-cobalt); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; opacity: 0.92; }
    </style>
  </head>
  <body>
    <div class="wirit-card ix">
      <div class="wirit-topcap">{{#if subtitle}}<span>{{subtitle}}</span>{{/if}}</div>
      <div class="ix-head"><h1 class="wirit-title">{{{title}}}</h1></div>

      <div class="ix-list">
        {{#each blocks}}
        <div class="ix-block">
          <div class="ix-top">
            <span class="ix-name">{{this.name}}</span>
            <span class="ix-now">{{this.now}}</span>
            <span class="ix-dd"><span class="k"><b>고점 대비</b><span class="d">{{this.ddDays}}</span></span><span class="v">{{this.dd}}<i>%</i></span></span>
          </div>
          <div class="ix-chart">{{{this.chartSvg}}}</div>
        </div>
        {{/each}}
      </div>

      <div class="wirit-footer">
        <span>출처 · {{source.name}}{{#if source.asOf}} · {{source.asOf}} 기준{{/if}}</span>
        <span class="wirit-watermark">@wirit_note<span class="dot">.</span></span>
      </div>
    </div>
  </body>
</html>
